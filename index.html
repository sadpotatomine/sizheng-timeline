<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FBFAF7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#181716" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="思政时间轴">
<title>思政时间轴 · sadpotatomine 的复习本</title>
<style>
:root{
  --bg:#FBFAF7;--panel:#FFFFFF;--sunk:#F1EEE7;--ink:#1F1E1C;--ink-2:#4F4C46;--ink-3:#706C65;
  --line:#E6E1D7;--line-2:#EFEBE3;--hover:#F4F1EA;--focus:#2478C9;
  --warn-bg:#FBF1E6;--warn-line:#EFD3B4;--warn-ink:#8A4A12;--warn-k:rgba(217,115,13,.14);
  --mn-bg:#F1F6EC;--mn-line:#CFE0C2;--mn-ink:#355224;
  --gold:#86620A;--green:#267648;--mark:rgba(232,180,40,.32);
  --shadow:0 1px 2px rgba(31,30,28,.06),0 10px 30px rgba(31,30,28,.12);
  --serif:"Iowan Old Style","Palatino Linotype",Georgia,"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","Noto Serif SC",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC","Helvetica Neue",Arial,sans-serif;
  --era:#8C8880;--era-ink:#66625B;--era-tint:rgba(140,136,128,.10);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#181716;--panel:#1F1E1C;--sunk:#2A2825;--ink:#ECE9E3;--ink-2:#BFBAB1;--ink-3:#AAA49A;
  --line:#34322E;--line-2:#2A2825;--hover:#272522;--focus:#7DB6F0;
  --warn-bg:#30241A;--warn-line:#4F3B28;--warn-ink:#F0C08C;--warn-k:rgba(240,160,80,.16);
  --mn-bg:#1D271A;--mn-line:#33462B;--mn-ink:#B9D9A4;
  --gold:#E8B84A;--green:#5BBE88;--mark:rgba(232,180,40,.30);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 32px rgba(0,0,0,.45);
}}
[data-era=cn1]{--era:#A0694B;--era-ink:#87563A;--era-tint:rgba(160,105,75,.10)}
[data-era=cn2]{--era:#D44C47;--era-ink:#B0362F;--era-tint:rgba(212,76,71,.085)}
[data-era=cn3]{--era:#D9730D;--era-ink:#A4520A;--era-tint:rgba(217,115,13,.09)}
[data-era=cn4]{--era:#2F8F5B;--era-ink:#23744A;--era-tint:rgba(47,143,91,.09)}
[data-era=cn5]{--era:#2478C9;--era-ink:#1B62A6;--era-tint:rgba(36,120,201,.085)}
[data-era=my1]{--era:#8C8880;--era-ink:#66625B;--era-tint:rgba(140,136,128,.12)}
[data-era=my2]{--era:#8A56AC;--era-ink:#73439A;--era-tint:rgba(138,86,172,.09)}
[data-era=my3]{--era:#2478C9;--era-ink:#1B62A6;--era-tint:rgba(36,120,201,.085)}
[data-era=my4]{--era:#D44C47;--era-ink:#B0362F;--era-tint:rgba(212,76,71,.085)}
@media (prefers-color-scheme:dark){
  [data-era=cn1]{--era:#C98F6B;--era-ink:#DDAA88;--era-tint:rgba(201,143,107,.14)}
  [data-era=cn2]{--era:#E5625C;--era-ink:#F3928C;--era-tint:rgba(229,98,92,.14)}
  [data-era=cn3]{--era:#E8892E;--era-ink:#F2AA66;--era-tint:rgba(232,137,46,.14)}
  [data-era=cn4]{--era:#45A872;--era-ink:#7ACB9C;--era-tint:rgba(69,168,114,.14)}
  [data-era=cn5]{--era:#4A95E0;--era-ink:#8CBFF2;--era-tint:rgba(74,149,224,.15)}
  [data-era=my1]{--era:#9C978E;--era-ink:#C2BDB4;--era-tint:rgba(156,151,142,.15)}
  [data-era=my2]{--era:#A97BCB;--era-ink:#C9A6E3;--era-tint:rgba(169,123,203,.15)}
  [data-era=my3]{--era:#4A95E0;--era-ink:#8CBFF2;--era-tint:rgba(74,149,224,.15)}
  [data-era=my4]{--era:#E5625C;--era-ink:#F3928C;--era-tint:rgba(229,98,92,.14)}
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
svg{display:block;flex:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:100vh;height:100dvh}

/* 顶栏 */
.top{display:flex;align-items:center;gap:14px;padding:10px max(20px,env(safe-area-inset-right)) 10px max(20px,env(safe-area-inset-left));padding-top:max(10px,env(safe-area-inset-top));border-bottom:1px solid var(--line);background:var(--bg);position:relative;z-index:30}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;flex:1 1 0}
.brand b{font-family:var(--serif);font-weight:700;font-size:21px;letter-spacing:.08em;white-space:nowrap}
.brand span{font-size:14px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;padding:3px;gap:2px;border-radius:12px;background:var(--sunk);flex:none}
.seg button{min-height:44px;min-width:78px;padding:0 16px;border:0;border-radius:9px;background:transparent;color:var(--ink-2);font-size:15px;white-space:nowrap;transition:background .15s,color .15s}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--line),0 1px 3px rgba(0,0,0,.07)}
.tools{display:flex;align-items:center;justify-content:flex-end;gap:12px;flex:1 1 0;min-width:0}
.prog{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.prog .bar{width:64px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog .bar i{display:block;height:100%;width:0;background:var(--green);border-radius:3px;transition:width .3s}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:14px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn svg{width:17px;height:17px}
.btn:hover{background:var(--hover)}
.btn[aria-pressed="true"],.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.primary:hover,.btn[aria-pressed="true"]:hover{opacity:.9;background:var(--ink)}
.btn.sm{min-height:44px;padding:0 12px;font-size:14px;border-radius:9px}
.btn.on-star{background:transparent;color:var(--gold);border-color:currentColor}
.btn.on-done{background:transparent;color:var(--green);border-color:currentColor}
.btn.on-star:hover,.btn.on-done:hover{background:var(--hover);opacity:1}
.icon-btn{width:44px;padding:0}
.menu-btn,.drawer-head{display:none}

/* 主体 */
.wrap{display:grid;grid-template-columns:340px minmax(0,1fr);min-height:0}
.side{display:flex;flex-direction:column;min-width:0;min-height:0;border-right:1px solid var(--line);background:var(--bg)}
.side-head{padding:12px 14px 8px;display:grid;gap:9px;border-bottom:1px solid var(--line)}
.search{position:relative}
.search>svg{position:absolute;left:11px;top:50%;width:16px;height:16px;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}
.search input{display:block;width:100%;height:44px;padding:0 38px 0 34px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--ink-3)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.search input:focus{border-color:var(--focus);box-shadow:0 0 0 3px rgba(36,120,201,.18)}
.search kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font:14px/1 var(--sans);color:var(--ink-3);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:3px 6px;background:var(--bg);pointer-events:none}
.search .clear{position:absolute;right:0;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;border-radius:8px;background:transparent;color:var(--ink-3);display:grid;place-items:center}
.search .clear svg{width:16px;height:16px}
.search .clear[hidden]{display:none}
@media (hover:none){.search kbd{display:none}}
.filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.chip{min-height:44px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:14px;color:var(--ink-2);white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.chip:hover{background:var(--hover)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.sel{position:relative;grid-column:1/-1;min-width:0;max-width:100%;min-height:44px;display:inline-flex;align-items:center;gap:4px;padding:0 26px 0 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:14px;color:var(--ink-2)}
.sel span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sel::after{content:"";position:absolute;right:11px;top:50%;width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:translateY(-70%) rotate(45deg)}
.sel.on{border-color:var(--ink);color:var(--ink);font-weight:600}
.sel select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;-webkit-appearance:none;appearance:none;border:0}
.sel:focus-within{outline:2px solid var(--focus);outline-offset:2px}
.side-cap{font-size:14px;color:var(--ink-3);padding:0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:24px}
.grp{position:relative}
.era-h{position:sticky;top:0;z-index:2;display:grid;grid-template-columns:8px minmax(0,1fr);align-items:center;gap:0 8px;padding:9px 16px 7px;background:var(--bg);border-bottom:1px solid var(--line-2);font-size:14px;font-weight:600;color:var(--era-ink)}
.era-h .dot{width:8px;height:8px;border-radius:50%;background:var(--era);flex:none}
.era-h .en{white-space:normal;overflow-wrap:anywhere}
.era-h .yr{grid-column:2;font-weight:400;color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.item{position:relative;display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;min-height:60px;padding:9px 14px 9px 16px;border:0;border-bottom:1px solid var(--line-2);background:transparent;text-align:left}
.item:hover{background:var(--hover)}
.item[aria-current="true"]{background:var(--era-tint)}
.item[aria-current="true"]::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--era)}
.it-y{font-size:15px;font-weight:700;color:var(--era-ink);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.it-m{min-width:0;display:block}
.it-t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14.5px;line-height:1.42;color:var(--ink)}
.item[aria-current="true"] .it-t{font-weight:600}
.it-s{display:block;margin-top:2px;font-size:14px;line-height:1.4;color:var(--ink-3);white-space:normal;overflow-wrap:anywhere}
.it-f{display:flex;gap:3px;align-items:center}
.it-f i{display:block}
.it-f svg{width:15px;height:15px}
.it-f .fs{color:var(--gold)} .it-f .fd{color:var(--green)}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.empty{padding:44px 24px;text-align:center;color:var(--ink-2);font-size:14px}
.empty p{margin:0 0 14px;line-height:1.7}

/* 详情 */
.detail{overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--panel);outline:none}
.card{max-width:780px;margin:0 auto;padding:26px 44px 40px}
.card.enter{animation:enter .26s ease both}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.crumb{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;font-size:14px;font-weight:600;color:var(--era-ink);min-width:0}
.crumb .dot{width:9px;height:9px;border-radius:50%;background:var(--era);flex:none}
.crumb .yr{font-weight:400;color:var(--ink-3);white-space:nowrap}
.head{display:flex;align-items:flex-end;flex-wrap:wrap;gap:6px 18px;margin-top:8px}
.year{font-family:var(--serif);font-size:78px;line-height:.92;font-weight:600;color:var(--era);letter-spacing:-.01em;font-variant-numeric:lining-nums}
.when{display:grid;gap:3px;padding-bottom:7px;font-size:14px;color:var(--ink-2);min-width:0}
.when .date{font-weight:600;color:var(--ink)}
.when .place{display:flex;align-items:center;gap:4px;color:var(--ink-3)}
.when .place svg{width:14px;height:14px}
.acts{display:flex;gap:8px;margin-left:auto;padding-bottom:6px}
.title{font-family:var(--serif);font-size:31px;line-height:1.28;font-weight:700;letter-spacing:.01em;margin:16px 0 0;text-wrap:balance}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tag{display:inline-flex;align-items:baseline;flex-wrap:wrap;gap:2px 8px;min-height:44px;padding:6px 12px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-size:14px;color:var(--ink-3);text-align:left;line-height:1.45}
.tag b{color:var(--ink-2);font-weight:600;white-space:nowrap}
.tag.here{border-color:var(--era);background:var(--era-tint)}
.tag.here b{color:var(--era-ink)}
.tag:hover{background:var(--hover)}
.sig{margin:16px 0 0;padding:13px 18px;border-left:3px solid var(--era);background:var(--era-tint);border-radius:0 12px 12px 0;font-size:17px;line-height:1.6;font-weight:500}
.sig .lab{display:inline-block;margin-right:12px;font-size:14px;font-weight:700;letter-spacing:.1em;color:var(--era-ink);vertical-align:2px}
.sig.masked{display:flex;align-items:center}
.sig .mask{flex:1;max-width:340px;height:12px;border-radius:6px;background:repeating-linear-gradient(90deg,var(--line) 0 22px,transparent 22px 28px)}
.blk{margin-top:28px}
h3.lab{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:14px;font-weight:700;letter-spacing:.14em;color:var(--ink-3)}
h3.lab::after{content:"";flex:1;height:1px;background:var(--line)}
.bg{margin:0;font-size:16px;line-height:1.85;color:var(--ink-2)}
.pts{list-style:none;margin:0;padding:0;display:grid;gap:11px;counter-reset:p}
.pts li{position:relative;padding-left:36px;font-size:16px;line-height:1.75;counter-increment:p}
.pts li::before{content:counter(p);position:absolute;left:0;top:2px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--era-tint);color:var(--era-ink);font-size:14px;font-weight:700;line-height:1}
.tips{list-style:none;margin:0;padding:14px 18px;display:grid;gap:10px;border:1px solid var(--warn-line);background:var(--warn-bg);border-radius:12px}
.tips li{font-size:16px;line-height:1.75}
.tips .k{display:inline-block;margin-right:8px;padding:0 7px;border-radius:5px;background:var(--warn-k);color:var(--warn-ink);font-size:14px;font-weight:700;line-height:20px;vertical-align:1px}
.mn{margin:0;padding:12px 18px;border:1px dashed var(--mn-line);background:var(--mn-bg);border-radius:12px;color:var(--mn-ink);font-family:var(--serif);font-size:17.5px;letter-spacing:.06em;line-height:1.6}
.quiz{margin-top:24px;padding:24px 20px;border:1.5px dashed var(--line);border-radius:12px;background:var(--bg);text-align:center}
.quiz .qq{margin:0 0 16px;color:var(--ink-2);font-size:15px;line-height:1.7}
.qa,.grade{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.grade{margin-top:26px;padding:14px 16px;border-radius:12px;background:var(--sunk);justify-content:flex-end}
.grade span{margin-right:auto;font-size:14px;color:var(--ink-2)}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:32px}
.pn button{display:grid;gap:3px;min-height:66px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--bg);text-align:left;min-width:0}
.pn button:hover:not(:disabled){background:var(--hover)}
.pn .next{text-align:right}
.pn small{font-size:14px;color:var(--ink-3)}
.pn b{font-size:14.5px;font-weight:600;white-space:normal;overflow-wrap:anywhere}
.pn button:disabled{opacity:.5;cursor:default}
.note{margin:30px 0 0;font-size:14px;line-height:1.7;color:var(--ink-3);text-align:center}

/* 时间带 */
.ribbon-meta{display:none;position:absolute;top:0;left:0;right:0;align-items:center;justify-content:space-between;gap:12px;font-size:14px;line-height:22px;pointer-events:none}
.era-current{font-weight:600;color:var(--era-ink)}
.ribbon-count{color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:1100px){.ribbon-meta{display:flex}.band .bl{display:none}}

.ribbon{display:flex;align-items:center;gap:14px;padding:8px max(20px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));border-top:1px solid var(--line);background:var(--bg);position:relative;z-index:5}
.play{border-radius:50%;flex:none}
.track{position:relative;flex:1;height:72px;touch-action:none;cursor:pointer;user-select:none;-webkit-user-select:none;border-radius:8px}
.track:focus-visible{outline:2px solid var(--focus);outline-offset:4px}
.rail{position:absolute;left:0;right:0;top:26px;height:2px;background:var(--line);border-radius:1px}
.band{position:absolute;top:0;height:40px}
.band .bl{position:absolute;left:3px;right:3px;top:1px;font-size:14px;font-weight:600;color:var(--era-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.band .bb{position:absolute;left:1px;right:1px;top:24px;height:6px;border-radius:3px;background:var(--era);opacity:.2}
.dot-e{position:absolute;top:27px;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:var(--panel);border:1.5px solid var(--era);pointer-events:none;transition:opacity .2s}
.dot-e.done{background:var(--era)}
.dot-e.dim{opacity:.18}
.cur-line{position:absolute;top:13px;width:2px;height:28px;margin-left:-1px;border-radius:1px;background:var(--ink);pointer-events:none;transition:left .2s ease}
.cur-dot{position:absolute;top:27px;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--era);box-shadow:0 0 0 3px var(--bg),0 0 0 4.5px var(--era);pointer-events:none;transition:left .2s ease}
.tick,.cur-lab{position:absolute;top:47px;transform:translateX(-50%);font-size:14px;line-height:20px;white-space:nowrap;pointer-events:none;font-variant-numeric:tabular-nums}
.tick{color:var(--ink-3);transition:opacity .15s}
.tick.hide{opacity:0}
.cur-lab{font-size:14px;font-weight:700;color:var(--era-ink);transition:left .2s ease}
.tick.first,.cur-lab.first{transform:none}
.tick.last,.cur-lab.last{transform:translateX(-100%)}
.scrim{display:none}
.nos{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);font-size:16px;text-align:center}

@media (max-width:1060px){
  .wrap{grid-template-columns:310px minmax(0,1fr)}
  .card{padding:24px 30px 36px}
  .brand span{display:none}
}
@media (max-width:760px){
  .top{flex-wrap:wrap;gap:8px 8px;padding:8px max(12px,env(safe-area-inset-right)) 8px max(12px,env(safe-area-inset-left));padding-top:max(8px,env(safe-area-inset-top))}
  .menu-btn{display:inline-flex;order:0}
  .brand{order:1;flex:1 1 auto}
  .brand b{font-size:18px}
  .tools{order:2;flex:none;gap:8px}
  .prog .bar{display:none}
  .prog::before{content:"✓";color:var(--green);font-weight:700}
  .seg{order:3;width:100%}
  .seg button{flex:1;min-width:0;padding:0 8px}
  .wrap{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;z-index:50;top:0;bottom:0;left:0;width:min(88vw,360px);border-right:0;box-shadow:var(--shadow);transform:translateX(-104%);transition:transform .26s ease;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}

要矛盾。","k":["法国里昂工人两次起义（1831年、1834年）","英国宪章运动（19世纪30年代后期至40年代）","德国西里西亚纺织工人起义（1844年）","工人运动迫切需要科学理论的指导"],"q":["考法：马克思主义产生的经济社会根源是资本主义经济的发展，阶级基础是无产阶级反对资产阶级斗争的发展"],"m":"","c":["my"],"id":"1831a"},{"y":1840.49,"d":"1840年6月28日","t":"鸦片战争爆发","ch":["史纲·第一章"],"p":"广东沿海","s":"中国近代史的开端","b":"英国对华贸易长期处于逆差，便向中国大量走私鸦片。1839年林则徐虎门销烟，英国以此为借口，于1840年6月发动侵略战争。","k":["中国开始从一个独立的封建国家逐步沦为半殖民地半封建国家","近代中国两对主要矛盾：帝国主义和中华民族的矛盾、封建主义和人民大众的矛盾，前者是最主要的矛盾","两大历史任务：求得民族独立和人民解放；实现国家富强和人民幸福——前者为后者扫清障碍、创造前提","半殖民地（主权原因）：不平等条约破坏了中国的领土主权、领海主权、关税主权、司法主权等，中国丧失了完全独立的地位，但仍维持独立国家和政府的名义","半封建（经济原因）：中国出现了资本主义生产关系，但民族资本主义经济不可能成为社会经济的主要形式，外国资本及依附于它的官僚资本居于支配地位","鸦片战争成为中国近代史起点的依据：国情改变了（封建社会逐步变成半殖民地半封建社会），任务改变了（中国人民逐渐开始反帝反封建的资产阶级民主革命）","近代中国诞生的新兴被压迫阶级是工人阶级，它先于中国的资产阶级而产生，是中国沦为两半社会过程最早出现的新社会阶级","林则徐是近代中国睁眼看世界的第一人"],"q":["易混：1840年是“开始沦为”，1901年《辛丑条约》才是“完全沦为”半殖民地半封建社会","易混：两对主要矛盾在不同时期均可成为当时最主要的矛盾，但总体来看，帝国主义和中华民族的矛盾是最主要的矛盾"],"m":"一个开端，两对矛盾，两大任务","c":["sg"],"id":"1840a"},{"y":1842.66,"d":"1842年8月29日","t":"《南京条约》签订","ch":["史纲·第一章"],"p":"南京","s":"中国近代第一个不平等条约","b":"清军战败，清政府被迫在南京江面的英国军舰上签约；1843年又订立《五口通商章程》和《虎门条约》作为补充。","k":["主要内容：割香港岛；赔款2100万银元；开放广州、厦门、福州、宁波、上海五口通商；协定关税","补充条约使英国攫取了领事裁判权、片面最惠国待遇等特权","中国的领土主权、关税自主权和司法主权开始遭到破坏","《南京条约》破坏了中国的领土主权、领海主权、关税主权、司法主权等，中国丧失了完全独立的地位，在相当程度上被殖民地化了"],"q":["易混：领事裁判权、片面最惠国待遇出自1843年的补充条约，不在《南京条约》本身","易混：香港岛（1842年割让）→ 九龙司地方一区（1860年割让）→ 新界（1898年租借）"],"m":"割岛、赔款、五口、协定关税","c":["sg"],"id":"1842a"},{"y":1844.13,"d":"1844年2月","t":"完成“两个转变”·三大理论来源","ch":["马原·导论"],"p":"法国巴黎","s":"从唯心主义转向唯物主义，从革命民主主义转向共产主义","b":"马克思在《莱茵报》工作时“第一次遇到要对所谓物质利益发表意见的难事”，开始研究经济问题；恩格斯在英国曼彻斯特考察工人阶级状况。","k":["《德法年鉴》发表马克思的《〈黑格尔法哲学批判〉导言》《论犹太人问题》和恩格斯的《政治经济学批判大纲》等文章，标志着两人完成了“两个转变”","1844年8月底马克思和恩格斯在巴黎会面，从此开始毕生的合作","直接理论来源：德国古典哲学（黑格尔、费尔巴哈）、英国古典政治经济学（斯密、李嘉图）、英法空想社会主义（圣西门、傅立叶、欧文）","自然科学前提：细胞学说、能量守恒与转化定律、生物进化论"],"q":["易混：空想社会主义来源是“英法”的——圣西门、傅立叶是法国人，欧文是英国人"],"m":"德国哲学、英国经济学、英法空想社会主义","c":["my"],"id":"1844a"},{"y":1845.3,"d":"1845—1846年","t":"《关于费尔巴哈的提纲》《德意志意识形态》","ch":["马原·导论","马原·第一章","马原·第二章"],"p":"比利时布鲁塞尔","s":"新世界观的诞生","b":"迁居布鲁塞尔后，马克思、恩格斯决定共同阐明自己的见解，清算从前的哲学信仰。","k":["《关于费尔巴哈的提纲》被恩格斯称为“包含着新世界观的天才萌芽的第一个文件”","指出旧唯物主义的主要缺点是对对象、现实、感性只是从客体的或者直观的形式去理解，而不是当作实践去理解","“人的思维是否具有客观的真理性，这不是一个理论的问题，而是一个实践的问题”","“哲学家们只是用不同的方式解释世界，问题在于改变世界”","《德意志意识形态》第一次比较系统地阐述了历史唯物主义的基本观点"],"q":["考法：实践的观点是马克思主义哲学首要的和基本的观点"],"m":"","c":["my"],"id":"1845a"},{"y":1847.42,"d":"1847年6月2日","t":"共产主义者同盟成立","ch":["马原·导论"],"p":"英国伦敦","s":"第一个无产阶级政党","b":"1836年在巴黎成立的德国流亡工人秘密团体“正义者同盟”，接受马克思、恩格斯的建议进行改组。","k":["改名为共产主义者同盟，口号由“人人皆兄弟”改为“全世界无产者，联合起来！”","同年底同盟第二次代表大会委托马克思、恩格斯起草纲领，即《共产党宣言》"],"q":["考法：共产主义者同盟是第一个无产阶级政党，《共产党宣言》是它的纲领"],"m":"","c":["my"],"id":"1847a"},{"y":1848.14,"d":"1848年2月21日","t":"《共产党宣言》发表","ch":["马原·导论","马原·第六章","马原·第七章"],"p":"英国伦敦","s":"标志着马克思主义的公开问世","b":"《宣言》以德文在伦敦首次出版。","k":["第一次全面系统地阐述了科学社会主义理论，阐明了无产阶级的历史使命","揭示了资本主义必然灭亡、社会主义必然胜利的历史规律（“两个必然”）","共产主义革命就是同传统的所有制关系、同传统的观念实行最彻底的决裂（“两个决裂”）","未来社会将是“这样一个联合体，在那里，每个人的自由发展是一切人的自由发展的条件”"],"q":["易混：《宣言》标志马克思主义公开问世；《资本论》问世后，唯物史观“已经不是假设，而是科学地证明了的原理”（列宁）"],"m":"两个必然、两个决裂","c":["my"],"id":"1848a"},{"y":1848.15,"d":"1848年2月22日—1852年","t":"欧洲1848年革命·总结革命经验","ch":["马原·导论","马原·第六章"],"p":"法国·德国","s":"马克思主义在革命实践中受到检验和发展","b":"1848年欧洲多国爆发革命，马克思、恩格斯回到德国，创办《新莱茵报》，直接参加斗争。","k":["1850年《1848年至1850年的法兰西阶级斗争》第一次使用“无产阶级专政”的提法","1852年《路易·波拿巴的雾月十八日》提出无产阶级革命必须打碎旧的国家机器的思想","革命失败后，马克思在伦敦转向深入研究政治经济学"],"q":["考法：“无产阶级专政”的提法首见于《1848年至1850年的法兰西阶级斗争》"],"m":"","c":["my"],"id":"1848b"},{"y":1851.03,"d":"1851年1月11日","t":"金田起义","ch":["史纲·第二章"],"p":"广西桂平金田村","s":"太平天国运动爆发","b":"洪秀全以拜上帝会为组织形式，在广西桂平金田村发动起义，建号太平天国。","k":["太平天国运动是中国旧式农民战争的最高峰","沉重打击了清王朝的统治和外国侵略势力","先后提出《天朝田亩制度》和《资政新篇》两个纲领性文件","太平天国起义冲击了孔子和儒家经典的正统权威，在一定程度上削弱了封建统治的精神支柱"],"q":["考法：“旧式农民战争的最高峰”指太平天国；农民阶级不可能提出科学的革命纲领","考法：农民阶级不是新的生产力和生产关系的代表，无法克服小生产者固有的阶级局限性；除无产阶级外，阶级局限性是其他阶级革命运动失败的主观根本原因"],"m":"金田一声起，农民战争到顶峰","c":["sg"],"id":"1851a"},{"y":1853.21,"d":"1853年3月19日","t":"定都天京·《天朝田亩制度》","ch":["史纲·第二章"],"p":"天京（南京）","s":"建立与清王朝对峙的农民政权","b":"太平军攻克南京，定为首都，改称天京；同年颁布《天朝田亩制度》。1859年洪仁玕又提出《资政新篇》。","k":["《天朝田亩制度》以解决土地问题为中心，反映了农民废除封建土地所有制的强烈愿望","它带有绝对平均主义色彩，具有空想性，在当时无法实现","《资政新篇》是中国近代第一个比较系统的发展资本主义的方案，但缺乏实施条件","《天朝田亩制度》确立平均分配土地的方案：按“凡天下田，天下人同耕”的原则，土地按亩产高低分为9等，好坏搭配，按人口平均分配；16岁以上男女每人一份，不满16岁减半","《天朝田亩制度》描绘的理想社会是“有田同耕，有饭同食，有衣同穿，有钱同使，无处不均匀，无人不饱暖”，但它是闭塞的自给自足的自然经济、没有商品交换的绝对平均社会，平分土地方案在太平军占领地区也未能实行","《天朝田亩制度》否定了封建社会的经济基础即封建土地所有制，是对以往农民战争“均贫富”“等贵贱”“均平”“均田”思想的发展和超越","《资政新篇》主张学习西方、制定法律制度，“准富者请人雇工”，把向西方的学习从生产力领域扩展到生产关系领域，开始提倡资本主义的雇佣劳动制"],"q":["易混：《天朝田亩制度》= 平均分配土地（空想）；《资政新篇》= 学习西方、发展资本主义（未能实施）","易混：《资政新篇》既学技术、又学制度；魏源《海国图志》“师夷长技以制夷”只学技术、不学制度"],"m":"","c":["sg"],"id":"1853a"},{"y":1856.81,"d":"1856年10月23日","t":"第二次鸦片战争","ch":["史纲·第一章"],"p":"广州","s":"英法联合扩大侵华","b":"英国借口“亚罗号事件”，法国借口“马神甫事件”，联合发动侵华战争，1857年底攻占广州，1858年北上攻陷大沽炮台。","k":["1858年清政府被迫签订《天津条约》：外国公使进驻北京，增开通商口岸，外国人可到内地游历、经商、传教","沙俄趁火打劫，1858年迫签《瑷珲条约》，割占黑龙江以北、外兴安岭以南60多万平方公里领土","侵略势力由东南沿海深入内地和长江流域，中国半殖民地化程度加深"],"q":["易混：沙俄割地三步——《瑷珲条约》（1858，黑龙江以北）→《北京条约》（1860，乌苏里江以东）→《勘分西北界约记》（1864，西北）"],"m":"","c":["sg"],"id":"1856a"},{"y":1859.45,"d":"1859年6月","t":"《〈政治经济学批判〉序言》","ch":["马原·导论","马原·第三章"],"p":"英国伦敦","s":"对唯物史观基本原理的经典表述","b":"马克思在伦敦长期从事政治经济学研究，1859年出版《政治经济学批判》第一分册。","k":["人们在社会生产中发生一定的、必然的、不以他们的意志为转移的关系，即同物质生产力的一定发展阶段相适合的生产关系","不是人们的意识决定人们的存在，相反，是人们的社会存在决定人们的意识","“两个决不会”：无论哪一个社会形态，在它所能容纳的全部生产力发挥出来以前，是决不会灭亡的；新的更高的生产关系，在它的物质存在条件在旧社会的胎胞里成熟以前，是决不会出现的"],"q":["考法：“两个必然”讲历史趋势，“两个决不会”讲实现条件，二者相统一"],"m":"","c":["my"],"id":"1859a"},{"y":1860.8,"d":"1860年10月18日","t":"火烧圆明园·《北京条约》","ch":["史纲·第一章"],"p":"北京","s":"第二次鸦片战争结束","b":"英法联军攻入北京，劫掠并焚毁圆明园；清政府分别与英、法、俄签订《北京条约》。","k":["割九龙司地方一区给英国，增开天津为商埠，允许招募华工出国","沙俄以“调停有功”为名，割占乌苏里江以东约40万平方公里领土","此后清政府与外国侵略者逐步勾结，“借师助剿”镇压太平天国"],"q":["考法：第二次鸦片战争的主要条约 =《天津条约》（1858）+《北京条约》（1860）"],"m":"","c":["sg"],"id":"1860a"},{"y":1861.05,"d":"1861年1月20日—1894年","t":"洋务运动兴起","ch":["史纲·第二章"],"p":"北京·上海·安庆等地","s":"地主阶级洋务派“自强”“求富”的探索","b":"1861年清政府设立总理各国事务衙门。奕䜣、曾国藩、李鸿章、左宗棠、张之洞等以“中学为体，西学为用”为指导思想，学习西方技术。","k":["前期以“自强”为旗号兴办军用工业（如江南制造总局），后期以“求富”为旗号兴办民用企业（如轮船招商局）","创办新式学堂、派遣留学生，筹建北洋、南洋、福建水师","失败原因：具有封建性，对外国有依赖性，管理具有腐朽性；1894年甲午战败标志其失败","洋务运动是在清政府镇压太平天国起义的过程中兴起的，目的首先是购买洋枪洋炮镇压农民起义，同时发展本集团的政治、经济、军事实力","洋务派民用企业多数采取官督商办方式，基本上是资本主义性质的近代企业","洋务派主要活动：兴办近代企业、建立新式海陆军、创办新式学堂、派遣留学生"],"q":["易混：洋务运动客观上促进了中国早期工业化和民族资本主义的产生，但没有使中国走上富强道路","易混：洋务运动没有裁撤绿营，裁撤绿营是清末新政的内容"],"m":"中体西用，先自强后求富","c":["sg"],"id":"1861a"},{"y":1864.55,"d":"1864年7月19日","t":"天京陷落","ch":["史纲·第二章"],"p":"天京（南京）","s":"太平天国运动失败","b":"1856年天京变乱后，太平天国由盛转衰；1864年7月湘军攻破天京。","k":["失败的根本原因是农民阶级的局限性：没有先进阶级领导，不能提出科学的革命纲领","领导集团腐败，宗教思想不能指导斗争，对外国侵略者缺乏理性认识","证明单纯的农民战争不能完成反帝反封建的历史任务","太平天国起义表明农民具有伟大的革命潜力，是中国革命的主力军，但自身不能担负起领导反帝反封建斗争取得胜利的重任"],"q":["易混：天京变乱（1856）是由盛转衰的转折点；天京陷落（1864）标志运动失败"],"m":"","c":["sg"],"id":"1864a"},{"y":1864.75,"d":"1864年9月28日","t":"第一国际成立","ch":["马原·导论"],"p":"英国伦敦","s":"国际工人协会成立","b":"19世纪60年代欧洲工人运动重新高涨，各国工人代表在伦敦集会。","k":["马克思起草了《成立宣言》和《临时章程》，是第一国际的实际领导者","第一国际同蒲鲁东主义、巴枯宁主义等错误思潮进行斗争，促进了马克思主义的传播","1876年宣布解散"],"q":["易混：第一国际（1864—1876，马克思领导）；第二国际（1889—1914，恩格斯指导前期）；第三国际（1919—1943，列宁创建）"],"m":"","c":["my"],"id":"1864b"},{"y":1867.7,"d":"1867年9月14日","t":"《资本论》第一卷出版","ch":["马原·导论","马原·第四章"],"p":"德国汉堡","s":"马克思主义最厚重、最丰富的著作","b":"经过二十多年的政治经济学研究，马克思在汉堡出版《资本论》第一卷。","k":["创立劳动价值论和剩余价值论，揭示了资本主义生产方式的本质和运动规律","剩余价值学说是马克思经济理论的基石","恩格斯指出：唯物史观和剩余价值学说是马克思的两大发现，使社会主义从空想变成科学","第二卷、第三卷由恩格斯在马克思逝世后整理出版（1885年、1894年）"],"q":["易混：两大发现＝唯物史观＋剩余价值学说"],"m":"","c":["my"],"id":"1867a"},{"y":1871.21,"d":"1871年3月18日—5月28日","t":"巴黎公社","ch":["马原·导论","马原·第六章"],"p":"法国巴黎","s":"无产阶级建立政权的第一次伟大尝试","b":"普法战争中法国战败，巴黎工人举行武装起义，建立巴黎公社，存在了72天。","k":["马克思写作《法兰西内战》，总结公社经验：工人阶级不能简单地掌握现成的国家机器，并运用它来达到自己的目的","公社实行普选，公职人员可以随时罢免、只领取相当于熟练工人的工资，防止国家机关由社会公仆变为社会主人","公社失败后，公社委员鲍狄埃写下《国际歌》歌词"],"q":["考法：巴黎公社的根本经验——打碎旧的国家机器，建立无产阶级专政的新型国家"],"m":"","c":["my"],"id":"1871a"},{"y":1875.29,"d":"1875年4月","t":"《哥达纲领批判》","ch":["马原·导论","马原·第七章"],"p":"英国伦敦","s":"提出共产主义社会发展两个阶段的思想","b":"德国两个工人政党合并前起草了带有拉萨尔主义错误的纲领草案（哥达纲领），马克思写下批注予以批判。","k":["第一阶段：在经济、道德和精神方面还带着旧社会的痕迹，实行按劳分配","高级阶段：“各尽所能，按需分配”","在资本主义社会和共产主义社会之间有一个革命转变时期，这个时期的国家只能是无产阶级的革命专政"],"q":["易混：列宁在《国家与革命》中把共产主义第一阶段称为社会主义社会"],"m":"","c":["my"],"id":"1875a"},{"y":1878.54,"d":"1878年7月、1880年","t":"《反杜林论》《社会主义从空想到科学的发展》","ch":["马原·导论","马原·第六章"],"p":"英国伦敦","s":"全面阐述马克思主义理论体系","b":"杜林的错误观点在德国社会民主党内产生影响，恩格斯撰文系统批判。","k":["《反杜林论》（1878年出版）全面阐述了马克思主义哲学、政治经济学和科学社会主义三个组成部分","1880年恩格斯把其中三章改编为《社会主义从空想到科学的发展》，在工人中广泛流传","论述了空想社会主义的历史贡献与局限：看到了资本主义的弊端，却找不到实现社会变革的社会力量和现实道路"],"q":["考法：马克思主义的三个基本组成部分——马克思主义哲学、马克思主义政治经济学、科学社会主义"],"m":"","c":["my"],"id":"1878a"},{"y":1883.2,"d":"1883年3月14日","t":"马克思逝世·恩格斯晚年著述","ch":["马原·导论","马原·第一章"],"p":"英国伦敦","s":"恩格斯继续指导国际工人运动，发展马克思主义","b":"马克思在伦敦逝世，恩格斯在墓前讲话中称他“首先是一个革命家”。","k":["《在马克思墓前的讲话》概括了马克思一生的两大发现：唯物史观和剩余价值学说","1884年《家庭、私有制和国家的起源》论述了国家的起源和本质","1886年《路德维希·费尔巴哈和德国古典哲学的终结》指出：全部哲学，特别是近代哲学的重大的基本问题，是思维和存在的关系问题"],"q":["考法：哲学基本问题的两个方面——思维和存在何者为第一性（划分唯物主义和唯心主义）、二者有无同一性（划分可知论和不可知论）"],"m":"","c":["my"],"id":"1883a"},{"y":1883.95,"d":"1883年12月14日—1885年","t":"中法战争","ch":["史纲·第一章"],"p":"越南北部·镇南关","s":"“不败而败”的战争","b":"法国侵略越南并以越南为跳板进犯中国，1883年12月进攻驻越清军，战争爆发；1884年马尾海战中福建水师几乎全军覆没。","k":["1885年3月冯子材率军取得镇南关大捷","清政府“乘胜即收”，与法国签订《中法新约》，法国势力深入中国西南","暴露了清政府妥协退让、腐败无能"],"q":["考法：近代反侵略战争失败的根本原因是社会制度的腐败，重要原因是经济技术的落后"],"m":"","c":["sg"],"id":"1883b"},{"y":1889.53,"d":"1889年7月14日","t":"第二国际成立","ch":["马原·导论"],"p":"法国巴黎","s":"在恩格斯指导下重建国际工人组织","b":"各国工人政党相继建立，国际工人运动需要新的联合组织。","k":["成立大会决定以5月1日作为国际无产阶级的共同节日","恩格斯逝世后，伯恩施坦修正主义和考茨基机会主义逐渐占据上风","1914年第一次世界大战爆发后，多数党支持本国政府参战，第二国际事实上破产"],"q":["考法：五一国际劳动节源于1886年美国芝加哥工人争取八小时工作制的大罢工"],"m":"","c":["my"],"id":"1889a"},{"y":1894.56,"d":"1894年7月25日","t":"甲午中日战争","ch":["史纲·第一章"],"p":"黄海·辽东·威海卫","s":"洋务运动失败，民族危机空前严重","b":"日本借朝鲜问题挑起战争：1894年7月25日日军在丰岛海面袭击中国运兵船；9月黄海海战中邓世昌等壮烈殉国；1895年2月北洋舰队在威海卫全军覆没。","k":["标志着洋务运动的失败","战后帝国主义列强掀起瓜分中国的狂潮","民族危机空前加深，促进了中华民族的觉醒","历次反侵略战争失败的原因：社会制度的腐败和经济技术的落后，其中制度腐败是更根本的原因","帝国主义列强未能灭亡和瓜分中国的原因：列强之间的矛盾和互相制约是重要原因，最根本的原因是中华民族不屈不挠的反侵略斗争，中国长期是一个统一的大国也是原因之一","严复1895年写《救亡决论》，喊出“救亡”口号；1898年正式出版翻译的《天演论》，用“物竞天择”“适者生存”的社会进化论思想为民族意识提供理论根据"],"q":["易混：丰岛海战是开端；黄海海战是规模最大的海战；威海卫之战北洋舰队全军覆没","考法：北洋海军全军覆没标志着洋务运动彻底失败"],"m":"","c":["sg"],"id":"1894a"},{"y":1894.9,"d":"1894年11月24日","t":"兴中会成立","ch":["史纲·第三章"],"p":"美国檀香山","s":"第一个资产阶级革命团体","b":"孙中山在檀香山创立兴中会，誓词为“驱除鞑虏，恢复中华，创立合众政府”。","k":["中国第一个资产阶级革命团体","誓词提出推翻清王朝、建立共和政府的主张","1895年筹划广州起义，未发动即失败","孙中山在《兴中会章程》中喊出“振兴中华”这个时代的最强音"],"q":["易混：兴中会（1894）是第一个资产阶级革命团体；同盟会（1905）是第一个全国性的资产阶级革命政党","易混：第一个革命团体是兴中会（其他革命团体还有华兴会、科学补习所、光复会、岳王会等）；第一个领导资产阶级革命的政党是中国同盟会"],"m":"","c":["sg"],"id":"1894b"},{"y":1895.29,"d":"1895年4月17日","t":"《马关条约》签订","ch":["史纲·第一章"],"p":"日本马关（下关）","s":"中国半殖民地化程度大大加深","b":"清政府派李鸿章赴日本马关议和，签订《马关条约》。","k":["割让辽东半岛、台湾全岛及所有附属各岛屿、澎湖列岛给日本","赔偿日本军费白银2亿两；增开沙市、重庆、苏州、杭州为商埠","允许日本在中国通商口岸开设工厂，适应了列强资本输出的需要","《马关条约》使列强对华经济侵略由商品输出转向资本输出，掀起瓜分中国的狂潮，中国人民的民族意识开始普遍觉醒"],"q":["易混：俄、德、法“三国干涉还辽”后，清政府以3000万两白银“赎回”辽东半岛","考法：台湾被日本割占始于1895年，1945年抗战胜利后回归中国"],"m":"割辽台澎，赔两亿，开四口，准设厂","c":["sg"],"id":"1895a"},{"y":1895.59,"d":"1895年8月5日","t":"恩格斯逝世·晚年书信","ch":["马原·导论","马原·第三章"],"p":"英国伦敦","s":"晚年书信丰富和发展了唯物史观","b":"恩格斯晚年针对把唯物史观曲解为“经济唯一决定论”的倾向，写下一系列历史唯物主义书信。","k":["1890年致约·布洛赫的信提出“历史合力论”：历史结果由许多单个意志相互冲突、由无数个力的平行四边形产生出一个合力","经济因素归根到底是决定性的因素，但不是唯一决定性的因素，上层建筑各种因素也对历史进程发生影响","1895年8月恩格斯在伦敦逝世"],"q":["易混：“历史合力论”反对把唯物史观歪曲为“经济决定论”，但不否认经济因素归根到底的决定作用"],"m":"","c":["my"],"id":"1895b"},{"y":1898.44,"d":"1898年6月11日","t":"戊戌维新","ch":["史纲·第二章"],"p":"北京","s":"资产阶级维新派的政治改良尝试","b":"1895年康有为等发动“公车上书”，维新运动兴起。1898年6月11日光绪帝颁布“明定国是”诏书，变法开始；9月21日慈禧太后发动政变，变法失败，历时103天。","k":["是一次爱国救亡运动，一场资产阶级性质的政治改良运动，也是一场思想启蒙运动","失败原因：维新派不敢否定封建主义，对帝国主义抱有幻想，脱离并惧怕人民群众；守旧势力强大","教训：在半殖民地半封建的中国，自上而下的改良道路走不通","光绪皇帝发布的新政诏令没有采纳维新派多次提出的开国会、定宪法等政治主张，未触及封建制度的根本，是十分温和的不彻底的改革方案","戊戌维新是中国民族资产阶级登上政治舞台的第一次表演","维新派的局限还表现在思想上打着孔子旗号“托古改制”，未触及封建土地所有制"],"q":["易混：维新派与守旧派论战三问——要不要变法；要不要兴民权、设议院，实行君主立宪；要不要废八股、改科举、兴西学","考法：维新派与守旧派的论战实质上是资产阶级思想与封建主义思想在中国的第一次正面交锋"],"m":"公车上书起，百日维新止","c":["sg"],"id":"1898a"},{"y":1900.46,"d":"1900年6月17日","t":"义和团运动·八国联军侵华","ch":["史纲·第一章"],"p":"京津地区","s":"粉碎了列强瓜分中国的图谋","b":"义和团以“扶清灭洋”为口号在山东、直隶兴起。1900年6月，英、法、德、俄、美、日、意、奥组成八国联军侵华，8月攻占北京。","k":["义和团运动粉碎了列强瓜分中国的图谋，显示了中国人民巨大的反侵略力量","局限：带有笼统排外色彩和迷信落后的一面","列强未能瓜分中国的根本原因，是中华民族不屈不挠的反侵略斗争","义和团原名义和拳，起源于嘉庆年间，流行于山东、直隶、河南、山西一带；甲午战争后从秘密反清转向公开反对列强","义和团对帝国主义的认识还停留在感性阶段（五四运动后才进入理性认识阶段），存在笼统的排外主义错误，还蒙受封建统治者的欺骗"],"q":["考法：列强之间的矛盾和互相制约是列强未能瓜分中国的原因之一，但不是根本原因","考法：义和团蒙受封建统治者欺骗，是因为认识不到帝国主义联合中国封建地主阶级压迫中国人民的实质"],"m":"","c":["sg"],"id":"1900a"},{"y":1901.68,"d":"1901年9月7日","t":"《辛丑条约》签订","ch":["史纲·第一章"],"p":"北京","s":"中国完全沦为半殖民地半封建社会","b":"八国联军侵华战争后，清政府被迫与11国签订《辛丑条约》。","k":["赔款白银4.5亿两，分39年还清，本息合计9.8亿余两，以海关税、盐税等作担保","划定北京东交民巷为使馆界，允许各国驻兵保护；拆毁大沽炮台，允许列强在北京至山海关铁路沿线驻兵","清政府保证严禁人民参加反帝活动，从此完全成为帝国主义统治中国的工具","《辛丑条约》签订标志着以慈禧太后为首的清政府彻底放弃抵抗外国侵略者的念头，甘当“洋人的朝廷”","《辛丑条约》是赔款最多的条约，列强还获得了在中国领土上驻军的特权","1904—1905年日、俄两国为争夺在华利益在中国东北进行战争，清政府却宣称“局外中立”","清末新政（1901年4月成立督办政务处）：设立商部、学部、巡警部，裁撤绿营，建立新军，颁布商法商律、奖励工商，鼓励留学、颁布新学制，1906年起正式废除科举考试"],"q":["易混：“开始沦为”→1840年鸦片战争；“完全沦为”→1901年《辛丑条约》","易混：裁撤绿营是清末新政的内容，不是洋务运动"],"m":"四亿五千万，三十九年还","c":["sg"],"id":"1901a"},{"y":1903.54,"d":"1903年7月17日—8月10日","t":"俄国社会民主工党二大·布尔什维克","ch":["马原·导论","马原·第六章"],"p":"布鲁塞尔→伦敦","s":"布尔什维主义作为政治思想流派和政党而存在","b":"列宁1902年出版《怎么办？》，阐述建立新型无产阶级政党的思想。","k":["大会围绕党章第一条（党员资格）等问题发生分歧，选举中央机关时拥护列宁的一派获得多数，称布尔什维克（多数派），另一派称孟什维克（少数派）","列宁说，布尔什维主义作为一种政治思想流派和一个政党而存在，是从1903年开始的","《怎么办？》提出社会主义意识只能从外面“灌输”给工人"],"q":["易混：《帝国主义论》（1916）和“一国胜利论”（1915—1916）都不是1903年提出的"],"m":"","c":["my"],"id":"1903a"},{"y":1905.63,"d":"1905年8月20日","t":"中国同盟会成立","ch":["史纲·第三章"],"p":"日本东京","s":"第一个全国性的资产阶级革命政党","b":"孙中山和黄兴、宋教仁等人以兴中会和华兴会为基础，在日本东京成立中国同盟会，以《民报》为机关报，并确定了革命纲领。","k":["纲领：“驱除鞑虏，恢复中华，创立民国，平均地权”","孙中山在《民报》发刊词中将其概括为民族、民权、民生三大主义（旧三民主义）","1905—1907年革命派与改良派展开大论战，划清了革命与改良的界限","资产阶级革命派的骨干是一批资产阶级、小资产阶级知识分子青年，成为辛亥革命的中坚力量","革命派与改良派大论战的意义：划清了革命与改良的界限，传播了民主革命思想，促进了革命形势的发展","论战暴露了革命派思想理论方面的弱点：对“革命是否会招致帝国主义干涉”不敢正面回答，只希望通过“有秩序的革命”避免动乱和帝国主义干涉；所说的“国民”主要指资产阶级及其知识分子，而不是广大劳动群众；反对贫苦农民“夺富人之田为己有”"],"q":["易混：论战三问——要不要以革命手段推翻清王朝；要不要推翻帝制、实行共和；要不要进行社会革命","易混：改良派很大一部分就是戊戌维新时期的维新派，例如梁启超"],"m":"十六字纲领，三民主义","c":["sg"],"id":"1905a"},{"y":1911.78,"d":"1911年10月10日","t":"武昌起义·辛亥革命","ch":["史纲·第三章"],"p":"湖北武昌","s":"推翻统治中国两千多年的君主专制制度","b":"保路运动推动革命形势高涨，湖北新军中的革命团体文学社、共进会发动武昌起义，各省纷纷响应。","k":["推翻了清王朝，结束了统治中国两千多年的君主专制制度，建立了中华民国","使民主共和观念深入人心，为中国的进步打开了闸门","但没有改变中国半殖民地半封建的社会性质","辛亥革命推翻了清王朝，但封建主义的统治没有结束，一直到新中国成立才结束","辛亥革命的意义：沉重打击了中外反动势力，使中国反动统治者在政治上乱了阵脚；推动了中国人民的思想解放和社会变革；推动了亚洲各民族解放运动的高涨"],"q":["考法：辛亥革命是近代中国比较完全意义上的资产阶级民主革命","易混：武昌起义过程中革命派既表现革命性和勇敢精神，又暴露软弱性和妥协态度，如对“革命是否会招致帝国主义干涉”不敢正面回答，只希望“有秩序的革命”"],"m":"","c":["sg"],"id":"1911a"},{"y":1912.0,"d":"1912年1月1日","t":"中华民国成立","ch":["史纲·第三章"],"p":"南京","s":"资产阶级共和国性质的革命政权","b":"孙中山在南京就任临时大总统，南京临时政府成立。","k":["南京临时政府是资产阶级共和国性质的革命政权","颁布了一系列除旧布新的政策法令","1912年2月12日清帝退位；随后孙中山辞职，袁世凯窃取了革命果实","南京临时政府的局限性：《告友邦书》试图用承认清政府与列强所订的一切不平等条约和所欠的一切外债换取列强承认中华民国；没有提出满足农民土地要求的政策措施，反而以保护私有财产为借口维护封建土地制度以及官僚、地主占有的土地和财产","毛泽东指出：“中国反帝反封建的资产阶级民主革命，正规地说起来，是从孙中山先生开始的”"],"q":["易混：清帝退位标志清王朝统治结束；袁世凯在北京就任临时大总统后，北洋军阀统治开始"],"m":"","c":["sg"],"id":"1912a"},{"y":1912.19,"d":"1912年3月11日","t":"《中华民国临时约法》","ch":["史纲·第三章"],"p":"南京","s":"第一部具有资产阶级共和国宪法性质的法典","b":"南京临时政府公布《中华民国临时约法》。","k":["规定中华民国主权属于国民全体，实行三权分立","规定国民一律平等，享有人身、居住、言论、集会、结社、宗教信仰等自由","改总统制为责任内阁制，意在限制袁世凯的权力","《临时约法》以根本大法的形式废除了两千多年来的封建君主专制制度，确认了资产阶级共和国的政治制度"],"q":["考法：《临时约法》是中国历史上第一部具有资产阶级共和国宪法性质的法典"],"m":"","c":["sg"],"id":"1912b"},{"y":1913.53,"d":"1913年7月12日—1918年","t":"二次革命·护国运动·护法运动","ch":["史纲·第三章"],"p":"南方各省","s":"旧民主主义革命走向失败","b":"袁世凯建立北洋军阀统治。1913年宋教仁遇刺，孙中山发动“二次革命”失败；1915年袁世凯复辟帝制，蔡锷等发起护国战争；1917年孙中山发起护法运动。","k":["1916年袁世凯在一片反对声中死去，北洋军阀分裂为直、皖、奉等派系","辛亥革命失败的根本原因：在帝国主义时代的半殖民地半封建中国，资本主义的建国方案行不通","主观原因：没有提出彻底的反帝反封建纲领，不能充分发动和依靠人民群众，不能建立坚强的革命政党","袁世凯窃夺辛亥革命果实后，建立了代表大地主和买办资产阶级利益的北洋军阀反动政权","1919年10月，孙中山将中华革命党改组为中国国民党","护法运动失败：1918年1月西南军阀与直系军阀勾结擅自停战、排挤孙中山、改组军政府，1918年5月21日孙中山愤然离开广州去上海；护法运动的失败标志着整个民族资产阶级领导的旧民主主义革命的终结"],"q":["考法：辛亥革命的失败表明，资产阶级共和国的方案没有能够救中国","考法：辛亥革命失败的客观根本原因是资本主义的建国方案行不通，主观根本原因是资产阶级的软弱性和妥协性（阶级局限性）"],"m":"","c":["sg"],"id":"1913a"},{"y":1915.62,"d":"1915年8月—1916年6月","t":"《帝国主义论》·“一国胜利论”","ch":["马原·导论","马原·第五章"],"p":"瑞士","s":"揭示帝国主义本质，提出社会主义可能在一国首先胜利","b":"第一次世界大战期间，列宁流亡瑞士，深入研究帝国主义问题。","k":["《帝国主义是资本主义的最高阶段》指出帝国主义是垄断的、寄生或腐朽的、过渡的或垂死的资本主义","五个基本特征：垄断组织在经济生活中起决定作用；金融资本和金融寡头的统治；资本输出有了特别重要的意义；瓜分世界的资本家国际垄断同盟已经形成；最大资本主义大国已把世界领土瓜分完毕","1915年《论欧洲联邦口号》、1916年《无产阶级革命的军事纲领》提出：社会主义可能首先在少数甚至单独一个资本主义国家内获得胜利"],"q":["考法：“一国胜利论”的依据是经济和政治发展的不平衡是资本主义的绝对规律"],"m":"","c":["my"],"id":"1915a"},{"y":1915.71,"d":"1915年9月15日","t":"新文化运动兴起","ch":["史纲·第四章"],"p":"上海→北京","s":"一场空前的思想解放运动","b":"陈独秀在上海创办《青年杂志》（次年改名《新青年》），新文化运动兴起；1917年后以北京大学和《新青年》为主要阵地。","k":["基本口号是民主和科学","提倡新道德、反对旧道德，提倡新文学、反对旧文学","十月革命后，新文化运动后期发展为宣传马克思主义的思想运动","新文化运动为马克思主义的广泛传播准备了思想和文化的条件","新文化运动的倡导者批判孔学是为了给中国发展资本主义扫清障碍，对孔学的批判充满理性，但未否定全部传统文化","新文化运动的局限：把改造国民性置于优先地位，但离开改造产生封建思想的社会环境的革命实践，仅靠少数人呐喊和有限宣传手段，不可能根本改造国民性；许多领导人物还没有马克思主义的批判精神，使用的方法一般还是资产阶级的方法"],"q":["易混：前期新文化运动属于资产阶级民主主义性质；局限是对东西方文化存在绝对肯定或绝对否定的形式主义偏向","考法：新民主主义革命与旧民主主义革命的根本区别在于领导权掌握在资产阶级还是无产阶级手中"],"m":"","c":["sg"],"id":"1915b"},{"y":1917.85,"d":"1917年11月7日","t":"十月革命","ch":["马原·导论","马原·第六章"],"p":"俄国彼得格勒","s":"社会主义从理论变为现实","b":"二月革命推翻沙皇统治后，俄国出现两个政权并存的局面。列宁领导布尔什维克党发动武装起义（俄历10月25日）。","k":["建立了世界上第一个社会主义国家政权，开辟了人类历史的新纪元","革命前夕列宁写成《国家与革命》，系统阐述了马克思主义国家学说","1921年苏俄由战时共产主义政策转向新经济政策，探索经济文化落后国家建设社会主义的道路","十月革命推动中国先进分子把目光从西方转向东方，从资产阶级民主主义转向社会主义"],"q":["考法：社会主义从空想到科学（马克思、恩格斯）、从理想到现实（十月革命）、从一国到多国（二战后）"],"m":"","c":["my"],"id":"1917a"},{"y":1917.86,"d":"1917年11月7日","t":"十月革命·马克思主义在中国初步传播","ch":["史纲·第四章"],"p":"俄国彼得格勒→北京","s":"中国先进分子找到了马克思主义","b":"俄国十月革命胜利，给中国送来了马克思列宁主义。李大钊在北京率先宣传十月革命和马克思主义。","k":["十月革命使中国先进分子看到了解决中国问题的新希望，开始用无产阶级的宇宙观观察国家命运","李大钊是中国最早的马克思主义者，1918年发表《法俄革命之比较观》《庶民的胜利》《Bolshevism的胜利》等文章","1919年李大钊发表《我的马克思主义观》，标志着马克思主义在中国进入比较系统的传播阶段","十月革命对中国先进分子有特殊吸引力：发生在国情与中国相同（封建压迫严重）或近似（经济文化落后）的俄国；社会主义俄国号召反对帝国主义，以新的平等态度对待中国；俄国工人、农民和士兵群众广泛发动并赢得胜利，给予新的革命方法启示","1919年苏维埃俄国第一次对华宣言声明放弃沙俄在中国攫取的一切特权，引起人们很大震动","李大钊1919年9月、11月发表《我的马克思主义观》，比较系统地介绍了马克思主义理论，在思想界产生重大影响"],"q":["考法：毛泽东语——“十月革命一声炮响，给我们送来了马克思列宁主义”"],"m":"","c":["sg"],"id":"1917b"},{"y":1919.17,"d":"1919年3月2日","t":"共产国际成立","ch":["马原·导论"],"p":"俄国莫斯科","s":"第三国际成立","b":"第二国际破产后，列宁领导创建新的国际无产阶级组织。","k":["帮助各国建立共产党，推动马克思列宁主义在世界范围传播","1920年起派代表来华，帮助建立中国共产党；中共二大决定加入共产国际，成为它的一个支部","1943年宣布解散"],"q":["考法：三个国际——第一国际（马克思）、第二国际（恩格斯指导前期）、第三国际（列宁）"],"m":"一马二恩三列宁","c":["my"],"id":"1919a"},{"y":1919.34,"d":"1919年5月4日","t":"五四运动","ch":["史纲·第四章"],"p":"北京→上海","s":"中国新民主主义革命的开端","b":"巴黎和会上中国外交失败，5月4日北京学生举行示威游行；6月3日后上海工人罢工，运动中心转到上海。","k":["是一场彻底地不妥协地反帝反封建的爱国运动","中国工人阶级开始以独立的姿态登上政治舞台","促进了马克思主义在中国的传播及其同中国工人运动的结合，为中国共产党成立作了思想上和干部上的准备","中国早期信仰马克思主义的人物主要有三种类型：五四以前新文化运动的精神领袖（李大钊、陈独秀，先驱者和擎旗人）；五四爱国运动的左翼骨干（毛泽东、周恩来等，主体部分）；部分原中国同盟会会员、辛亥革命时期活动家（董必武、林伯渠、吴玉章等）","民族意识：普遍觉醒——甲午战争；全面觉醒——五四运动","五四运动是中国人民对帝国主义的认识进入理性认识阶段的标志"],"q":["易混：运动主力由学生转为工人，中心由北京转到上海；直接导火索是巴黎和会外交失败","考法：五四运动表现了反帝反封建的彻底性，但未改变中国半殖民地半封建的社会性质；五四运动是一次真正的群众运动"],"m":"五四：新民主主义革命的起点","c":["sg"],"id":"1919b"},{"y":1921.56,"d":"1921年7月23日","t":"中共一大·中国共产党成立","ch":["史纲·第四章","毛中特·导论"],"p":"上海→浙江嘉兴南湖","s":"开天辟地的大事变，是近现代中国历史发展的必然产物，是中国人民在救亡图存斗争中顽强求索的必然产物，是实现中华民族伟大复兴的必然产物","b":"1920年起，上海、北京、武汉、长沙、济南、广州等地以及旅日、旅法的先进分子相继建立共产党早期组织。1921年7月23日中共一大在上海开幕，最后一天的会议转移到嘉兴南湖的一艘游船上举行。","k":["确定党的名称为“中国共产党”，通过党的第一个纲领和第一个决议","纲领规定党的奋斗目标是推翻资产阶级政权、建立无产阶级专政、消灭私有制","确定党成立后的中心任务是组织工人阶级、领导工人运动；选举陈独秀为中央局书记","中国共产党是马克思列宁主义同中国工人运动相结合的产物","一大1921年7月23日在上海法租界望志路106号（今兴业路76号）开幕，代表全国50多名党员；陈独秀、李大钊因事务繁忙未出席，共产国际代表马林、尼克尔斯基出席了会议","会场受到暗探注意和法租界巡捕房搜查，最后一天会议转移到嘉兴南湖游船上举行，这条游船后来被称为“红船”","一大通过第一个纲领时没有区分民主革命和社会主义革命","中国共产党一开始就是以马克思列宁主义理论为基础的党，是区别于第二国际旧式社会改良党的新型工人阶级革命政党，是在马克思主义同中国工人运动相结合的基础上产生的","伟大建党精神：坚持真理、坚守理想、践行初心、担当使命、不怕牺牲、英勇斗争、对党忠诚、不负人民，是中国共产党的精神之源"],"q":["易混：一大只提出了最高纲领，还没有提出反帝反封建的民主革命纲领——这一步由二大完成","考法：7月1日是1941年由党中央正式确定的纪念日，一大实际开幕日是7月23日","易混：中国共产党是在马克思主义同中国工人运动相结合的基础上产生的，不能说农民运动","考法：近代反帝反封建斗争屡遭挫折和失败，最重要的原因是没有先进的坚强的政党作为凝聚力量的领导核心"],"m":"","c":["sg","mz"],"id":"1921a"},{"y":1922.54,"d":"1922年7月16日","t":"中共二大·民主革命纲领","ch":["史纲·第四章"],"p":"上海","s":"第一次明确提出彻底的反帝反封建民主革命纲领，也是中国近代史上第一个彻底的反帝反封建的民主革命纲领","b":"建党一年后，党在领导工人运动的实践中，并借助列宁关于民族和殖民地问题的理论，认识到中国首先要进行民主革命。","k":["最高纲领：实现共产主义；最低纲领：打倒军阀，推翻国际帝国主义的压迫，统一中国为真正的民主共和国","第一次明确提出彻底的反帝反封建的民主革命纲领，为中国人民的革命斗争指明了方向","通过党的第一部党章，提出党要成为“大的群众党”；决定加入共产国际","二大1922年7月16日至23日在上海举行，出席大会的代表12人，代表全国195名党员","二大提出要“到群众中去”，组成一个大的“群众党”，必须采取群众路线这一新革命方法","二大第一次公开发表《中国共产党宣言》，制定了第一部《中国共产党章程》，第一次明文提出“中国共产党万岁”的口号","二大决定加入共产国际，作为共产国际的一个支部，直接受共产国际的领导"],"q":["易混：一大＝党名、第一个纲领（最高纲领）；二大＝民主革命纲领（最低纲领）、第一部党章；三大＝国共合作方针","易混：二大提出组成“民主主义的联合战线”，是第一次提出统一战线政策，但此时还不是与孙中山领导的国民党建立统一战线","考法：共产国际及其在中国的代表对大革命起了积极作用，但并不真正了解中国情况，也出了一些错误主意，幼年的党难以摆脱其错误指导"],"m":"一大建党，二大定纲，三大合作","c":["sg"],"id":"1922a"},{"y":1923.45,"d":"1923年6月12日","t":"中共三大·确定国共合作方针","ch":["史纲·第四章"],"p":"广州","s":"确定以“党内合作”形式建立革命统一战线","b":"1923年2月京汉铁路工人大罢工遭到军阀吴佩孚血腥镇压（二七惨案），党认识到工人阶级孤军奋斗难以战胜强大的敌人，必须争取一切可能的同盟者。","k":["决定共产党员以个人身份加入国民党，同时在政治上、组织上保持党的独立性","实行国共合作，建立各民主阶级的革命统一战线","为第一次国共合作的正式形成作了党内准备","三大正确估计了孙中山的革命立场和国民党进行改革的可能性","三大第一次明确提出了同国民党建立统一战线的问题"],"q":["考法：合作形式是“党内合作”——共产党员以个人名义加入国民党，而不是两党平行合作","考法：共产党员加入国民党时，党必须在政治上、思想上、组织上保持自己的独立性"],"m":"","c":["sg"],"id":"1923a"},{"y":1924.05,"d":"1924年1月20日","t":"国民党一大·第一次国共合作","ch":["史纲·第四章"],"p":"广州","s":"标志第一次国共合作正式形成","b":"孙中山在中国共产党和共产国际帮助下改组国民党，在广州召开国民党第一次全国代表大会，李大钊等共产党员参加大会并进入国民党中央领导机构。","k":["大会宣言对三民主义作了新的解释，形成以联俄、联共、扶助农工三大政策为基础的新三民主义","新三民主义的政纲同中国共产党民主革命阶段的纲领基本一致，成为国共合作的政治基础","1924年5月创办黄埔军校，为国民革命培养军事和政治骨干","国民党一大选举出中国国民党中央执行委员会","新三民主义的政纲同中国共产党在民主革命阶段的纲领基本一致，因而有了国共合作的政治基础；但由于领导阶级是资产阶级，此时新三民主义不具备新民主主义性质"],"q":["易混：旧三民主义（1905同盟会）→ 新三民主义（1924国民党一大）：民族主义突出反帝，民权主义强调“为一般平民所共有”，民生主义增加“节制资本”","考法：国共合作的政治基础是新三民主义，合作形式是党内合作","易混：新三民主义与中共民主革命纲领基本一致而非完全相同","考法：民生主义概括为“平均地权”和“节制资本”两大原则，后来孙中山又提出“耕者有其田”的主张"],"m":"","c":["sg"],"id":"1924a"},{"y":1925.03,"d":"1925年1月11日","t":"中共四大·领导权与工农联盟","ch":["史纲·第四章","毛中特·第二章"],"p":"上海","s":"第一次提出无产阶级领导权和工农联盟问题","b":"国共合作后，统一战线内部谁来领导、依靠谁的问题逐渐突出，党需要从理论上作出回答。","k":["明确提出无产阶级在民主革命中的领导权问题","提出工农联盟问题，指出农民是工人阶级天然的同盟者","对民主革命的内容作了更加完整的规定"],"q":["易混：四大提出了领导权问题，但大革命后期以陈独秀为代表的右倾机会主义恰恰放弃了领导权"],"m":"","c":["sg","mz"],"id":"1925a"},{"y":1925.41,"d":"1925年5月30日","t":"五卅运动","ch":["史纲·第四章"],"p":"上海","s":"大革命高潮的起点","b":"上海日本纱厂资本家枪杀工人顾正红，5月30日英国巡捕在南京路向抗议群众开枪，制造了五卅惨案。","k":["中国共产党领导上海工人罢工、学生罢课、商人罢市，反帝怒潮迅速席卷全国","6月爆发省港大罢工，坚持16个月，有力支援了广东革命政府","五卅运动后，以广东为中心的革命统一战线进一步巩固，为北伐准备了条件"],"q":["易混：五卅运动是大革命高潮的起点，北伐战争把大革命推向高潮"],"m":"","c":["sg"],"id":"1925b"},{"y":1925.92,"d":"1925年12月1日、1927年3月","t":"《中国社会各阶级的分析》《湖南农民运动考察报告》","ch":["毛中特·第一章","毛中特·第二章"],"p":"广州·湖南","s":"毛泽东思想开始萌芽","b":"当时党内存在两种倾向：以陈独秀为代表的右倾只注意同国民党合作而忘记了农民，以张国焘为代表的“左”倾只注意工人运动，同样忘记了农民。毛泽东通过调查研究作出回答。","k":["开篇指出：“谁是我们的敌人？谁是我们的朋友？这个问题是革命的首要问题。”","指出工业无产阶级是革命的领导力量，半无产阶级和小资产阶级是最接近的朋友，中产阶级（民族资产阶级）具有动摇性","《湖南农民运动考察报告》肯定农民运动“好得很”，强调建立农民政权和农民武装的重要性","这些著作提出了新民主主义革命的基本思想","《中国社会各阶级的分析》论述了社会各阶级在革命中的地位和作用，阐明了中国革命的对象、动力和领导权问题，强调无产阶级领导农民斗争的极端重要性","《中国社会各阶级的分析》解决了无产阶级领导权的中心问题，即如何领导农民斗争的问题","《湖南农民运动考察报告》总结了辛亥革命失败的原因，提出国民革命需要一个大的农村变动"],"q":["易混：毛泽东思想 萌芽（国民革命时期）→ 形成（土地革命战争时期）→ 成熟（遵义会议后至抗战时期）→ 继续发展（解放战争时期和新中国成立后）"],"m":"","c":["mz"],"id":"1925c"},{"y":1926.52,"d":"1926年7月9日","t":"北伐战争","ch":["史纲·第四章"],"p":"广州出师→长江流域","s":"把大革命推向高潮","b":"国民革命军从广州出师北伐，口号是“打倒列强，除军阀”，主要打击吴佩孚、孙传芳、张作霖三支北洋军阀力量。","k":["共产党员和共青团员在北伐军中发挥了先锋模范作用，叶挺独立团被誉为“铁军”","不到半年就从珠江流域打到长江流域，基本消灭了吴佩孚、孙传芳的主力","北伐推动了工农运动的高涨，1927年3月上海工人第三次武装起义取得胜利"],"q":["考法：北伐的胜利进军是国共合作的成果，但高潮中也潜伏着统一战线破裂的危机"],"m":"","c":["sg"],"id":"1926a"},{"y":1927.28,"d":"1927年4月12日、7月15日","t":"四一二·七一五政变·大革命失败","ch":["史纲·第四章"],"p":"上海·武汉","s":"第一次国共合作破裂，大革命失败","b":"1927年4月12日蒋介石在上海发动反革命政变，大肆屠杀共产党员和革命群众；7月15日汪精卫集团在武汉公开“分共”。","k":["客观原因：反革命力量强大，大大超过革命力量；资产阶级严重动摇，统一战线内部发生剧烈分化","主观原因：党的领导机关在大革命后期犯了以陈独秀为代表的右倾机会主义错误，放弃了对农民、对政权特别是对武装力量的领导权","党还处于幼年时期，缺乏应对复杂局面的经验","大革命（1924—1927年）比以往任何一次革命群众动员程度更为广泛、斗争规模更加宏伟、革命的社会内涵更为深刻，因此被称作大革命","大革命失败的国际因素：大革命后期受到共产国际的错误指导","大革命失败后，国民党不再是工人、农民、城市小资产阶级和民族资产阶级的革命联盟，而是变成由代表地主阶级、买办性大资产阶级利益的反动集团控制的政党；其建立的南京国民政府同北洋军阀统治没有本质区别，国民党统治下中国社会的半殖民地半封建性质没有改变"],"q":["考法：大革命失败最深刻的教训是党必须掌握革命的领导权，特别是对武装力量的领导权","易混：1935年遵义会议之前党失败的原因共同点是不善于把理论与实践相结合、共产国际瞎指挥"],"m":"","c":["sg"],"id":"1927a"},{"y":1927.58,"d":"1927年8月1日","t":"南昌起义","ch":["史纲·第五章"],"p":"江西南昌","s":"打响武装反抗国民党反动派的第一枪","b":"大革命失败后，周恩来、贺龙、叶挺、朱德、刘伯承等领导党所掌握和影响的军队两万余人在南昌举行起义。","k":["标志着中国共产党独立领导革命战争、创建人民军队和武装夺取政权的开端","起义军南下广东途中受挫，朱德、陈毅率余部转战湘南，1928年4月上井冈山与毛泽东部会师","8月1日后来被定为中国人民解放军建军节","南昌起义是1927年7月中旬中共中央政治局临时常委会决定的三件大事之一，另两件是组织湘、鄂、赣、粤四省农民发动秋收起义和召集中央紧急会议（八七会议）"],"q":["易混：南昌起义是“第一枪”“开端”；第一次公开打出“工农革命军”旗帜的是秋收起义"],"m":"","c":["sg"],"id":"1927b"},{"y":1927.6,"d":"1927年8月7日","t":"八七会议","ch":["史纲·第五章"],"p":"湖北汉口","s":"由大革命失败到土地革命战争兴起的历史性转折","b":"大革命失败后全国陷入白色恐怖，共产党被宣布为“非法”，党的组织不断遭到破坏，活动被迫转入地下；1927年3月到1928年上半年，被杀害的共产党员和革命群众达31万多人，全党党员由五大时的57967人锐减到1万余人。党中央在汉口秘密召开紧急会议，总结大革命失败的教训，纠正以陈独秀为代表的右倾机会主义错误。","k":["确定了实行土地革命和武装反抗国民党反动派的总方针","毛泽东提出“须知政权是由枪杆子中取得的”","会后派干部到各地发动武装起义；但会议在反对右倾错误时，也为“左”倾错误的发展开了先河","八七会议明确提出土地革命是中国资产阶级民主革命的中心问题","八七会议选出了以瞿秋白为首的中央临时政治局","八七会议清算了以陈独秀为代表的右倾机会主义错误，提出了“整顿改编自己的队伍，纠正过去严重的错误，而找到新的道路”的任务"],"q":["考法：“枪杆子里面出政权”的思想最早在八七会议上提出","易混：中国革命的首要问题是分清敌友，中心问题是领导权问题，基本问题是农民问题，中国资产阶级民主革命的中心问题是土地革命"],"m":"","c":["sg"],"id":"1927c"},{"y":1927.69,"d":"1927年9月9日起","t":"秋收起义·井冈山革命根据地","ch":["史纲·第五章","毛中特·第二章"],"p":"湘赣边界→江西井冈山","s":"由进攻城市转向农村进军的伟大开端","b":"毛泽东领导湘赣边界秋收起义，攻打长沙受挫后，果断放弃进攻大城市，率部转向敌人统治薄弱的农村山区。","k":["起义第一次公开打出“工农革命军”的旗帜","9月底三湾改编，把党的支部建在连上，从组织上确立了党对军队的领导","10月到达井冈山，创建第一个农村革命根据地；1928年4月朱德、陈毅部到达井冈山，两军会师组成工农革命军第四军","1928年毛泽东写下《中国的红色政权为什么能够存在？》《井冈山的斗争》，提出“工农武装割据”思想","三湾改编（1927年9月29日，江西永新县三湾村）：秋收起义受挫后部队士气低落、组织涣散，存在军阀主义残余，急需整顿以保存革命力量；改编从政治、组织上确立了党对军队的领导，创造性地确立了“支部建在连上”“官兵平等”等崭新治军方略","党对军队的绝对领导：发端于南昌起义、奠基于三湾改编（支部建在连上）、定型于古田会议","井冈山根据地的建立开辟了“农村包围城市、武装夺取政权”的正确道路，从进攻大城市转到向农村进军，是中国人民革命史上具有决定意义的新起点"],"q":["考法：工农武装割据＝以武装斗争为主要形式、以土地革命为基本内容、以农村革命根据地为战略阵地，三者紧密结合","考法：三湾改编是建设无产阶级领导的新型人民军队的重要开端，标志着毛泽东建设人民军队思想开始形成，也是中国共产党建设新型人民军队最早的一次成功探索和实践"],"m":"秋收转兵上井冈，支部建在连上","c":["sg","mz"],"id":"1927d"},{"y":1927.33,"d":"1927年4—5月","t":"中共五大","ch":["史纲·第四章"],"p":"湖北武汉","s":"首次明确民主集中制为党的根本组织原则","b":"1927年4—5月，中国共产党第五次全国代表大会在武汉举行，通过《中国共产党第三次修正章程决案》。","k":["首次明确规定党组织的“指导原则为民主集中制”","民主集中制是我们党的根本组织原则和领导制度","五大时全党党员57967人"],"q":["易混：民主集中制首次明确于中共五大（1927年《中国共产党第三次修正章程决案》）"],"m":"","c":["sg"],"id":"1927e"},{"y":1928.47,"d":"1928年6月18日—7月11日","t":"中共六大","ch":["史纲·第五章"],"p":"苏联莫斯科","s":"唯一一次在国外召开的全国代表大会；确定以争取群众为首要任务，是党的工作方针的一次重要转变","b":"大革命失败后，党内对中国社会性质和革命性质认识不一，“左”倾盲动错误又给革命造成了损失。会议在继续把城市工作的复兴视为革命高潮到来的决定条件的同时，肯定了农村根据地和红军是决定革命新高潮的更大发展基础和重要力量。","k":["肯定中国仍是半殖民地半封建社会，现阶段的革命仍是资产阶级民主革命","指出当时处在两个革命高潮之间，党的总任务是争取群众，而不是进攻和暴动","不足：对中间阶级的作用和反动势力内部的矛盾缺乏正确估计，对农村根据地的重要性和民主革命的长期性认识不足","确定以争取群众作为党的首要任务，把“左”倾作为主要危险来反对","肯定农村根据地和红军是决定革命新高潮的更大发展基础和重要力量"],"q":["易混：土地革命时期三次“左”倾错误——瞿秋白盲动主义（1927—1928）、李立三冒险主义（1930）、王明教条主义（1931—1935），危害最大的是王明“左”倾错误"],"m":"","c":["sg"],"id":"1928a"},{"y":1929.99,"d":"1929年12月28日","t":"古田会议","ch":["史纲·第五章","毛中特·第一章"],"p":"福建上杭古田","s":"确立思想建党、政治建军的原则","b":"红军长期处于农村游击环境，成分复杂（农民和其他小资产阶级占多数），存在单纯军事观点、极端民主化、非组织观点等非无产阶级思想，影响军队建设和党的领导。1929年12月，红四军第九次党的代表大会在福建上杭古田召开，通过了毛泽东起草的决议（即古田会议决议）。","k":["规定红军是一个执行革命的政治任务的武装集团，必须绝对服从党的领导","批判了单纯军事观点、极端民主化、非组织观点等错误思想","古田会议决议是党和人民军队建设的纲领性文献","大会根据中央九月来信精神，通过毛泽东起草的古田会议决议，决议的中心思想是用无产阶级思想进行军队和党的建设","把思想建设放在党的建设首位，用无产阶级思想克服非无产阶级思想","红军必须担负打仗、筹款和做群众工作的任务，必须加强政治工作","古田会议创造性地解决了在农村环境中、党组织和军队以农民为主要成分的条件下，如何保持党的无产阶级先锋队性质和建设党领导的新型人民军队的重大问题"],"q":["易混：三湾改编从“组织上”确立党对军队的领导；古田会议从“思想上、政治上”确立建党建军原则","易混：党对军队的绝对领导——发端于南昌起义、奠基于三湾改编（支部建在连上）、定型于古田会议"],"m":"","c":["sg","mz"],"id":"1929a"},{"y":1930.01,"d":"1930年1月5日、5月","t":"《星星之火，可以燎原》《反对本本主义》","ch":["毛中特·第一章","毛中特·第二章"],"p":"闽西·赣南寻乌","s":"农村包围城市道路理论和党的思想路线初步形成","b":"1930年井冈山斗争后，党内不少人产生悲观情绪，发出“红旗到底打得多久”的疑问，甚至觉得农村根据地难以长久，想要重回城市搞暴动；同时存在照搬书本、照搬外国经验的倾向。毛泽东写下这两篇文章，答复质疑、统一思想。","k":["《星星之火，可以燎原》论证了红色政权的发展是促进全国革命高潮的最重要因素，阐明了以农村为中心的思想","《反对本本主义》提出“没有调查，没有发言权”，强调“中国革命斗争的胜利要靠中国同志了解中国情况”","土地革命战争时期，以农村包围城市、武装夺取政权为核心的革命道路理论形成，标志毛泽东思想初步形成","《星星之火，可以燎原》明确革命重心必须放在农村，否定重回城市的错误思路；红军、游击队和红色区域的建立和发展，是半殖民地中国在无产阶级领导之下的农民斗争的最高形式","《反对本本主义》阐明坚持辩证唯物主义的思想路线、即坚持理论与实际相结合的原则的极端重要性，表现了毛泽东开辟新道路、创造新理论的革命首创精神"],"q":["易混：《反对本本主义》＝思想路线初步形成；《改造我们的学习》与延安整风＝实事求是思想路线确立"],"m":"","c":["mz"],"id":"1930a"},{"y":1931.71,"d":"1931年9月18日","t":"九一八事变","ch":["史纲·第六章"],"p":"辽宁沈阳","s":"中国人民抗日战争的起点","b":"日本关东军炸毁沈阳北郊柳条湖附近的南满铁路，反诬中国军队所为，当夜炮轰东北军驻地北大营，接着向沈阳城等地发动进攻。国民党政府奉行“攘外必先安内”方针，实行不抵抗政策，东北三省很快沦陷。","k":["揭开了中国人民抗日战争的序幕，也揭开了世界反法西斯战争的序幕","1932年日本扶植成立伪“满洲国”；东北抗日义勇军和后来的东北抗日联军坚持抗战","中国共产党号召武装抗日，领导和推动了东北的抗日斗争","至1932年2月，中国东北全境沦陷","国际联盟和英、美等国对日本采取姑息、纵容政策，使日本对中国的侵略计划步步得逞"],"q":["易混：九一八事变＝局部抗战开始（14年抗战的起点）；七七事变＝全民族抗战开始"],"m":"","c":["sg"],"id":"1931a"},{"y":1931.87,"d":"1931年11月","t":"中华苏维埃第一次全国代表大会","ch":["史纲·第五章"],"p":"江西瑞金","s":"成立中华苏维埃共和国，中国历史上第一个全国性的工农民主政权","b":"1931年11月，中华苏维埃第一次全国代表大会在江西瑞金召开，成立了中华苏维埃共和国临时中央政府。大会的召开扩大了党和红色政权的影响，一定程度上加强了对处于被分割状态的各根据地的中枢指挥作用，推动了各根据地的政权、经济、文化教育和党的自身建设，开创了土地革命战争新局面。","k":["通过《中华苏维埃共和国宪法大纲》以及土地法令、劳动法等","选举产生中央执行委员会，毛泽东当选为临时中央政府主席","中华苏维埃共和国是中国历史上第一个全国性的工农民主政权，是中国共产党在局部地区执政的重要尝试","实行工农兵代表大会制度，各级苏维埃政府广泛吸收工农群众代表参加政权管理","中华苏维埃共和国的成立扩大了党和红色政权的影响，加强了对被分割的各根据地的中枢指挥作用，开创了土地革命战争新局面"],"q":["易混：土地革命时期政权性质——工农民主政权；抗日战争时期——一切赞成抗日又赞成民主的人们政权；解放战争时期——各个革命阶级的联合专政；新中国——人民民主专政"],"m":"","c":["sg"],"id":"1931b"},{"y":1934.78,"d":"1934年10月10日—1936年10月","t":"红军长征","ch":["史纲·第五章"],"p":"江西瑞金→陕北→甘肃会宁","s":"中国革命转危为安的伟大战略转移","b":"由于王明“左”倾教条主义错误的领导，中央革命根据地第五次反“围剿”失败，中央红军被迫进行战略转移。","k":["1935年10月中央红军到达陕北吴起镇；1936年10月红一、二、四方面军在甘肃会宁、宁夏将台堡会师，长征胜利结束","长征是宣言书，是宣传队，是播种机；宣告了国民党反动派围追堵截的破产","长征的胜利，是党和中国革命事业从挫折走向胜利的伟大转折点，形成了伟大的长征精神","1936年10月9日红四方面军指挥部到达甘肃会宁，22日红二方面军指挥部到达甘肃隆德将台堡（今属宁夏），三大主力红军的长征胜利结束","长征的胜利极大地促进了党在政治上和思想上的成熟，只有把马克思主义基本原理同中国革命具体实际结合起来、独立自主解决中国革命的重大问题，才能把革命事业引向胜利","长征的胜利是中国革命转危为安的关键，宣告了国民党反动派消灭中国共产党和红军的图谋彻底失败"],"q":["考法：长征胜利结束的标志是1936年10月三大主力会师；长征途中最重要的会议是遵义会议"],"m":"","c":["sg"],"id":"1934a"},{"y":1935.04,"d":"1935年1月15日","t":"遵义会议","ch":["史纲·第五章","毛中特·第一章"],"p":"贵州遵义","s":"党的历史上一个生死攸关的转折点","b":"长征初期红军损失惨重，湘江战役后由出发时的8.6万余人锐减到3万余人。博古、李德等人的“左”倾错误军事指挥是第五次反“围剿”失败的主要原因，党和红军面临生死存亡的危机，迫切需要纠正错误、确立正确领导。1935年1月中央政治局在遵义召开扩大会议。","k":["集中解决了当时具有决定意义的军事问题和组织问题，结束了王明“左”倾教条主义在党中央的统治","实际上确立了毛泽东在党中央和红军的领导地位","是党第一次独立自主地运用马克思主义基本原理解决自己的路线、方针、政策问题，标志着党在政治上开始走向成熟","开始确立了以毛泽东为主要代表的马克思主义正确路线在党中央的领导地位，开始形成以毛泽东为核心的党的第一代中央领导集体","中央政治局常委决定由张闻天代替博古负总的责任，毛泽东为周恩来在军事指挥上的帮助者，后成立由毛泽东、周恩来、王稼祥组成的三人小组，负责全军的军事行动","会议的重大决策是在中国共产党同共产国际的联系中断的情况下独立自主地作出的","在极其危急的情况下挽救了中国共产党、挽救了中国工农红军、挽救了中国革命"],"q":["易混：遵义会议没有全面讨论政治路线问题，而是集中解决军事和组织问题——这是紧急情况下的正确选择","易混：遵义会议确立毛泽东的领导地位；正式确立毛泽东思想为指导思想是1945年七大","易错：遵义会议之前党失败的原因共同点——党还年幼、不善于理论与实践相结合，共产国际瞎指挥"],"m":"生死攸关的转折点","c":["sg","mz"],"id":"1935a"},{"y":1935.94,"d":"1935年12月9日","t":"一二·九运动·瓦窑堡会议","ch":["史纲·第六章"],"p":"北平·陕北瓦窑堡","s":"抗日救亡新高潮与抗日民族统一战线策略方针的确定","b":"1935年日本策动“华北事变”，企图使华北五省脱离中国政府管辖，民族危机空前严重。","k":["12月9日北平学生举行抗日救国示威游行，标志着中国人民抗日救亡运动新高潮的到来","12月中共中央在瓦窑堡召开政治局会议，确定了建立抗日民族统一战线的策略方针","毛泽东作《论反对日本帝国主义的策略》报告，批判了党内的“左”倾关门主义","12月16日北平学生和市民1万多人召开市民大会，会后举行更大规模的示威游行，一二·九运动迅速波及全国，促进了中华民族觉醒","瓦窑堡会议批评了“左”倾冒险主义和关门主义错误，强调共产党在抗日民族统一战线中的领导作用","瓦窑堡会议决定将“工农共和国”口号改变为“人民共和国”","瓦窑堡会议开始解决党的政治路线问题、实现了政治路线的转变，标志着党的抗日民族统一战线策略正式形成"],"q":["易混：1935年8月的《八一宣言》呼吁停止内战、一致抗日；瓦窑堡会议才正式确定抗日民族统一战线的策略方针"],"m":"","c":["sg"],"id":"1935b"},{"y":1936.95,"d":"1936年12月12日","t":"西安事变","ch":["史纲·第六章"],"p":"陕西西安","s":"西安事变的和平解决成为时局转换的枢纽，十年内战局面基本结束、国内和平初步实现","b":"蒋介石“攘外必先安内”的方针并没有根本改变，1936年12月初他到达西安，逼张学良、杨虎城“剿共”。张学良、杨虎城多次劝谏蒋介石停止内战、联共抗日无效后，在西安扣押蒋介石，实行“兵谏”。","k":["中国共产党从民族大义出发，主张和平解决，派周恩来等赴西安谈判","蒋介石被迫接受“停止内战，联共抗日”的主张","西安事变的和平解决使十年内战的局面基本结束，国内和平初步实现","张、杨通电全国，提出停止内战、一致抗日等八项主张","党中央派周恩来于12月17日到达西安谈判，迫使蒋介石做出“停止剿共，联合抗日”的承诺"],"q":["考法：西安事变和平解决 ≠ 抗日民族统一战线正式形成（正式形成在1937年9月）"],"m":"","c":["sg"],"id":"1936a"},{"y":1937.52,"d":"1937年7月7日","t":"七七事变·全民族抗战","ch":["史纲·第六章"],"p":"北平卢沟桥","s":"全民族抗战的开始","b":"日军借口一名士兵“失踪”，向北平西南卢沟桥一带的中国守军发动进攻，中国守军奋起抵抗。","k":["7月8日中共中央通电全国：“平津危急！华北危急！中华民族危急！只有全民族实行抗战，才是我们的出路！”","8月洛川会议提出全面抗战路线（人民战争路线），制定《抗日救国十大纲领》；红军主力改编为八路军，10月南方红军游击队改编为新四军","9月22日国民党中央通讯社发表中共中央提交的国共合作宣言，23日蒋介石发表谈话承认共产党的合法地位，标志着以国共第二次合作为基础的抗日民族统一战线正式形成","1937年2月中共中央致电国民党五届三中全会，提出停止内战、一致对外等五项要求，并表示愿实行四项保证：停止武力推翻国民党政府的方针；苏维埃政府改名为中华民国特区政府、红军改名为国民革命军；特区实行彻底的民主制度；停止没收地主土地的政策"],"q":["易混：共产党的全面抗战路线（依靠广大人民群众）vs 国民党的片面抗战路线（单纯依靠政府和军队）"],"m":"","c":["sg"],"id":"1937a"},{"y":1937.52,"d":"1937年7月7日—1938年10月","t":"正面战场·战略防御","ch":["史纲·第六章"],"p":"淞沪·太原·徐州·武汉","s":"国民党军队担负正面战场作战","b":"战略防御阶段，国民党政府的抗战态度比较积极，组织了一系列大规模会战。","k":["先后组织淞沪、太原、徐州、武汉等会战，粉碎了日本“三个月灭亡中国”的狂妄计划","1938年春台儿庄战役，是抗战以来正面战场取得的最大胜利","1937年12月日军攻陷南京，制造了屠杀中国军民30万人以上的南京大屠杀；12月13日现为南京大屠杀死难者国家公祭日","1938年10月广州、武汉失守后，抗日战争进入战略相持阶段"],"q":["考法：进入相持阶段后，日本对国民党改以政治诱降为主、军事打击为辅，国民党政策重心逐渐转向消极抗日、积极反共"],"m":"","c":["sg"],"id":"1937b"},{"y":1937.71,"d":"1937年9月—1945年8月","t":"敌后战场与抗日根据地建设","ch":["史纲·第六章"],"p":"华北·华中敌后","s":"中国共产党成为全民族抗战的中流砥柱","b":"全民族抗战开始后，八路军、新四军深入敌后，发动群众开展游击战争，开辟敌后战场，建立抗日根据地。为克服根据地面临的严重困难局面，毛泽东提出“发展经济，保障供给”的经济工作和财政工作总方针，发出“自己动手，丰衣足食”的号召，领导根据地军民开展大生产运动。","k":["1937年9月平型关大捷，是全国抗战以来中国军队的第一个大胜仗","1940年8—12月百团大战，是抗战期间八路军在华北发动的规模最大、持续时间最长的战役","抗日民主政权实行“三三制”：共产党员、非党的左派进步分子、不左不右的中间派各占三分之一；农村实行减租减息","面对国民党顽固派的三次反共高潮（第二次以1941年1月皖南事变为顶点），党坚持“发展进步势力，争取中间势力，孤立顽固势力”的方针","抗日民主政权普遍采取民主集中制，各级机构领导人都经过人民选举产生，努力发扬政治民主、保障人民民主自由权利；实行各民族平等团结、共同抗日的基本政策，在少数民族聚居地区试行民族区域自治","巩固抗日民族统一战线的策略总方针是“发展进步势力，争取中间势力，孤立顽固势力”，对顽固派贯彻又联合又斗争的政策，斗争时坚持有理、有利、有节的原则","抗战时期停止实行没收地主土地的政策，普遍实行减租减息：地主减租减息、农民交租交息，既调动农民抗日积极性，又争取地主资产阶级的大多数站在抗日民族统一战线一边"],"q":["易混：减租减息（抗战时期，地主减租减息、农民交租交息）≠ 没收地主土地（解放战争时期）","易混：“三三制”中共产党员代表工人和农民，党外进步人士代表小资产阶级，中间派代表民族资产阶级和开明绅士（注意没有地方实力派）","易混：进步势力指工人、农民和城市小资产阶级，是统一战线的基础和抗日战争的主要依靠力量；中间势力指民族资产阶级、开明绅士和地方实力派"],"m":"","c":["sg"],"id":"1937c"},{"y":1937.62,"d":"1937年8月","t":"洛川会议","ch":["史纲·第六章"],"p":"陕西洛川","s":"制定全面抗战路线和《抗日救国十大纲领》","b":"1937年“七七事变”后全面抗日战争爆发，面对日军全面进攻，党需要明确抗战的路线、方针和策略，解决“如何抗战、依靠谁抗战”的关键问题。1937年8月，中共中央在陕北洛川召开政治局扩大会议。","k":["制定了中国共产党的全面抗战路线，制定《抗日救国十大纲领》","打倒日本帝国主义，关键在于使已经发动的抗战成为全面的全民族的抗战","实行全国军事的总动员、全国人民的总动员","坚持抗日战争中的无产阶级领导权，在敌人后方放手发动独立自主的山地游击战争","提出必须改革政治机构，并适当改善工农大众的生活","提出必须坚持抗日战争中的无产阶级领导权，农民是人民群众的主体；在国民党统治区放手发动抗日的群众运动"],"q":["易混：瓦窑堡会议（1935.12）侧重“建立统一战线”；洛川会议（1937.8）侧重“如何抗战”、制定全面抗战路线"],"m":"","c":["sg"],"id":"1937d"},{"y":1937.5,"d":"1937年","t":"《实践论》《矛盾论》","ch":["马原·第二章","毛中特·第一章"],"p":"陕北延安","s":"马克思主义认识论和辩证法的经典著作，阐明党的思想路线","b":"毛泽东从马克思主义认识论的高度总结党的历史经验，揭露和批评党内的主观主义尤其是教条主义错误。","k":["《实践论》系统阐释社会实践在人类认识过程中的重要地位和决定性作用，实践是“主观见之于客观的东西”","《矛盾论》指出马克思主义的最本质的东西、马克思主义的活的灵魂，就在于具体地分析具体的情况","深入论证马克思列宁主义基本原理同中国具体实际相结合的原则，科学阐明党的马克思主义思想路线"],"q":["易混：《实践论》讲认识论（实践决定认识）；《矛盾论》讲辩证法（具体问题具体分析是马克思主义活的灵魂）"],"m":"","c":["my","mz"],"id":"1937e"},{"y":1938.4,"d":"1938年5月26日","t":"《论持久战》","ch":["史纲·第六章","毛中特·第一章"],"p":"陕北延安","s":"科学预见了抗日战争的发展进程","b":"抗战初期，国内流行“亡国论”和“速胜论”两种错误观点。毛泽东在延安抗日战争研究会上发表长篇讲演。","k":["驳斥了“亡国论”和“速胜论”，指出抗日战争是持久战，最后胜利属于中国","预见抗日战争将经过战略防御、战略相持、战略反攻三个阶段，战略相持阶段是最重要、是转变的枢纽","强调“战争的伟力之最深厚的根源，存在于民众之中”，指出游击战争的战略地位和作用，兵民是胜利之本"],"q":["考法：持久战的依据是中日双方的基本特点——敌强我弱、敌退步我进步、敌小我大、敌寡助我多助"],"m":"","c":["sg","mz"],"id":"1938a"},{"y":1938.75,"d":"1938年9月29日—11月6日","t":"六届六中全会·提出“马克思主义中国化”","ch":["毛中特·导论","史纲·第六章"],"p":"陕北延安","s":"第一次明确提出“马克思主义中国化”的命题","b":"王明从苏联回国后提出“一切经过统一战线”的右倾主张，党内思想亟须统一。1938年8月中共驻共产国际代表王稼祥回国，传达共产国际指示：中共中央的政治路线是正确的，中共中央要以毛泽东为首来解决统一领导的问题。","k":["毛泽东指出：要“使马克思主义在中国具体化，使之在其每一表现中带着必须有的中国的特性”","强调在统一战线中坚持独立自主原则，批判了“一切经过统一战线”的错误主张","全会基本上纠正了王明的右倾错误，统一了全党的思想和步调","毛泽东在会上作《论新阶段》政治报告，第一次提出“马克思主义中国化”的科学命题，它源于对中国革命进程中正反两个方面实践经验的科学总结","毛泽东向全党提出三项任务：普遍地、深入地学习马克思列宁主义的理论，学习我们的历史遗产并给以批判的总结，调查研究当前运动的特点及其规律性","毛泽东后来指出“六中全会是决定中国之命运的”；全会进一步巩固了毛泽东在全党的领导地位"],"q":["易混：1938年提出“马克思主义中国化”；十九届六中全会决议、二十大报告进一步使用“马克思主义中国化时代化”的表述"],"m":"","c":["mz","sg"],"id":"1938b"},{"y":1939.76,"d":"1939年10月4日、12月","t":"《〈共产党人〉发刊词》《中国革命和中国共产党》","ch":["毛中特·第二章"],"p":"陕北延安","s":"提出“三大法宝”，阐明中国革命的基本问题","b":"总结建党十八年来的经验，毛泽东为党内刊物《共产党人》撰写发刊词；同年冬与其他同志合作写成《中国革命和中国共产党》。","k":["发刊词指出：统一战线、武装斗争、党的建设是中国共产党在中国革命中战胜敌人的三个法宝","统一战线和武装斗争是战胜敌人的两个基本武器，党的组织是掌握这两个武器以实行对敌冲锋陷阵的英勇战士","《中国革命和中国共产党》分析了中国社会的性质，阐明了中国革命的对象、任务、动力、性质和前途，提出“新民主主义革命”的概念","发刊词第一次明确提出中国共产党自身建设的目标，即把党建设成为全范围的、广大群众思想上政治上组织上全巩固的马克思主义政党，毛泽东把建设这样的党称之为“伟大的工程”","《中国革命和中国共产党》第一次全面系统论述中国两半社会性质问题，强调认清中国国情乃是认清一切革命问题的基本的依据"],"q":["考法：三大法宝中，党的建设是掌握统一战线和武装斗争的根本保证"],"m":"","c":["mz"],"id":"1939a"},{"y":1940.02,"d":"1940年1月9日","t":"《新民主主义论》","ch":["毛中特·第二章","史纲·第六章"],"p":"陕北延安","s":"系统阐述新民主主义理论","b":"抗战进入相持阶段后，“中国向何处去”成为各界关注的问题。毛泽东在陕甘宁边区文化协会第一次代表大会上发表讲演，后以《新民主主义论》为题发表。","k":["中国革命分两步走：第一步是新民主主义革命，第二步是社会主义革命，好比文章的上篇和下篇","系统阐述了新民主主义的政治、经济、文化纲领","新民主主义文化是民族的、科学的、大众的文化","同期著作一起系统阐述了新民主主义革命理论，标志着毛泽东思想走向成熟","《新民主主义论》论述了新民主主义共和国的国体、政体","1945年毛泽东在七大所作《论联合政府》报告中，进一步把新民主主义的政治、经济、文化与党的基本纲领联系起来进行了具体阐述，形成了新民主主义的基本纲领"],"q":["易混：民主主义革命是社会主义革命的必要准备，社会主义革命是民主主义革命的必然趋势"],"m":"","c":["mz","sg"],"id":"1940a"},{"y":1942.09,"d":"1942年2月1日—1945年4月","t":"延安整风运动","ch":["史纲·第六章","毛中特·第一章"],"p":"陕北延安","s":"一次全党范围的马克思主义思想教育运动","b":"遵义会议以来党的路线已走上马克思主义的正确轨道，但对曾经给党的事业造成严重危害的主观主义、教条主义还没有来得及从思想上进行认真清理。为清除“左”倾和右倾错误、特别是教条主义的影响，党在全党范围内开展整风。1941年5月毛泽东作《改造我们的学习》报告，1942年2月作《整顿党的作风》《反对党八股》讲演。","k":["主要内容：反对主观主义以整顿学风，反对宗派主义以整顿党风，反对党八股以整顿文风","反对主观主义是整风运动最主要的任务，重点是反对教条主义","毛泽东对“实事求是”作了马克思主义的解释，党的实事求是思想路线得以确立","1945年4月六届七中全会通过《关于若干历史问题的决议》，即党的第一个历史决议","主观主义是中国共产党内反复出现左、右倾错误的思想认识根源；主观主义的实质是理论脱离实际，是实际工作中的唯心主义，主要表现形式是教条主义和经验主义，尤其教条主义是整风运动的重点","整风运动是一次深刻的马克思主义思想教育运动，也是一场思想解放运动，坚持马克思主义同中国实际相结合的正确方向","1944年5月21日至1945年4月20日中共扩大的六届七中全会在延安召开，原则通过《关于若干历史问题的决议》，对建党以后特别是六届四中全会至遵义会议前一段党的历史及其经验教训进行了总结，对党的若干重大历史问题作出结论，增强了全党团结，为党的七大胜利召开创造了充分条件"],"q":["易混：三个历史决议——1945年六届七中全会、1981年十一届六中全会、2021年十九届六中全会","易混：遵义会议解决军事和组织问题，瓦窑堡会议解决政治路线问题，延安整风解决思想问题（实事求是思想路线在全党确立）"],"m":"","c":["sg","mz"],"id":"1942a"},{"y":1945.31,"d":"1945年4月23日—6月11日","t":"中共七大·确立毛泽东思想为指导思想","ch":["毛中特·第一章","史纲·第六章"],"p":"陕北延安","s":"把毛泽东思想确立为党的指导思想并写入党章","b":"抗战胜利前夕，党的第七次全国代表大会在延安召开。七大召开前，延安整风使全党团结在毛泽东的旗帜下，实现了党的空前统一和团结。","k":["毛泽东作《论联合政府》政治报告，提出党的政治路线：放手发动群众，壮大人民力量，在党的领导下打败日本侵略者，解放全国人民，建立一个新民主主义的中国","刘少奇作《关于修改党章的报告》，对毛泽东思想作了系统论述","总结了党的三大优良作风：理论和实践相结合、和人民群众紧密地联系在一起、自我批评","制定了新民主主义国家在政治、经济、文化方面的纲领，提出实现中国工业化的宏伟任务，并在中国共产党的文件上首次明确提出衡量一切政党政策的标准是是否有助生产力的发展","毛泽东在会上作《论联合政府》书面报告和《愚公移山》闭幕词","中共七大以“团结的大会，胜利的大会”载入党的史册，标志着我们党在政治上、思想上、组织上走向了成熟"],"q":["易混：“毛泽东思想”一词由王稼祥在1943年7月首先提出；1945年七大正式确立为党的指导思想","考法：毛泽东思想是马克思主义中国化的第一个重大理论成果"],"m":"","c":["mz","sg"],"id":"1945a"},{"y":1945.62,"d":"1945年8月15日","t":"抗日战争胜利","ch":["史纲·第六章"],"p":"全国","s":"近代以来中国人民反抗外敌入侵第一次取得完全胜利的民族解放战争","b":"1945年8月苏联对日宣战，中国军民发起大反攻；8月15日日本宣布无条件投降，9月2日在投降书上签字。","k":["9月3日被确定为中国人民抗日战争胜利纪念日；10月25日台湾光复","胜利原因：中国共产党的中流砥柱作用；全民族团结抗战；世界上一切爱好和平和正义的国家和人民的支持","意义：彻底粉碎了日本军国主义殖民奴役中国的图谋，洗刷了近代以来抗击外来侵略屡战屡败的民族耻辱，重新确立了中国在世界上的大国地位，开辟了中华民族伟大复兴的光明前景","中国战场是世界反法西斯战争的东方主战场","胜利原因还包括：以爱国主义为核心的民族精神是中国人民抗日战争胜利的决定因素","根据《波茨坦公告》，被日本占领50年之久的台湾以及澎湖列岛重归中国主权管辖，这是抗日战争取得完全胜利的重要标志；《开罗宣言》从法律上明确了日本侵占台湾的非法性，确认了台湾是中国领土","抗日战争的伟大胜利是中华民族从近代以来陷入深重危机走向伟大复兴的历史转折点"],"q":["易混：14年抗战（1931—1945）vs 8年全民族抗战（1937—1945）"],"m":"","c":["sg"],"id":"1945b"},{"y":1945.66,"d":"1945年8月28日—10月10日","t":"重庆谈判·《双十协定》","ch":["史纲·第七章"],"p":"重庆","s":"国民党被迫承认和平建国的基本方针","b":"抗战胜利后，中国面临两种命运、两个前途的抉择。蒋介石三次电邀毛泽东赴重庆谈判，其目的是一以此敷衍国内外舆论、掩盖其正在进行的内战准备，二是诱使中共交出人民军队和解放区政权以期不战而控制全中国，三是如果谈判不成即放手发动内战并把战争责任转嫁给中国共产党。","k":["毛泽东、周恩来、王若飞赴重庆谈判，10月10日签订《政府与中共代表会谈纪要》（即《双十协定》）","国民党承认和平建国的基本方针，同意召开政治协商会议，但军队和解放区政权问题未能解决","1946年1月政治协商会议在重庆召开，通过有利于和平建国的五项协议，不久即被国民党撕毁","1945年8月25日中共中央发表《对目前时局的宣言》，明确提出和平、民主、团结的口号","《双十协定》确认和平建国的基本方针，同意“长期合作，坚决避免内战”","1946年1月10日国共双方下达停战令，同一天政治协商会议在重庆开幕，代表共38人，达成政府组织、国民大会、和平建国纲领、宪法草案、军事问题五项协议，贯彻和平民主原则、确认和平建国方针，确定国会制、内阁制和省自治的政治制度","政协协议较多地吸收了中间人士的意见，虽然还不是新民主主义性质的，但有利于冲破蒋介石的独裁统治和实行民主政治、有利于和平建国；在一个时期内，是否忠实履行政协协议成了人们衡量政治是非的重要尺度"],"q":["考法：中国共产党提出“和平、民主、团结”三大口号，争取和平民主建国","考法：毛泽东早在1945年5月七大时就提出，对蒋介石拟采取“洗脸”政策而不是“杀头”政策"],"m":"","c":["sg"],"id":"1945c"},{"y":1946.48,"d":"1946年6月26日","t":"全面内战爆发","ch":["史纲·第七章"],"p":"中原解放区","s":"解放战争全面开始","b":"国民党依仗军事优势和美国援助，以围攻中原解放区为起点，向各解放区发动全面进攻。","k":["战略防御阶段（1946年6月—1947年6月），以歼灭敌人有生力量为主要目标，不以保守或夺取地方为主要目标","1947年3月起国民党转为对陕北和山东解放区的重点进攻；5月孟良崮战役全歼整编第七十四师","1946年5月4日中共中央发出《关于清算减租及土地问题的指示》（《五四指示》），将减租减息政策改为实现“耕者有其田”","毛泽东指出，在军事上必须采取集中优势兵力、各个歼灭敌人的作战原则；在政治上必须在党的领导下建立最广泛的人民民主统一战线","1947年10月10日中国人民解放军总部发表宣言，提出“打倒蒋介石，解放全中国”的口号","《五四指示》规定解决土地问题的方式一般不是无偿没收，而是通过清算和购买实现有偿转移；不可侵犯中农土地，一般不变动富农土地","《五四指示》表明解放区在农民土地问题上开始由抗日战争时期的削弱封建剥削，向变革封建土地关系、废除封建剥削制度过渡，是中国共产党土地政策的重要改变"],"q":["考法：1946年8月毛泽东同斯特朗谈话，提出“一切反动派都是纸老虎”","易混：解放战争三阶段是战略防御、战略进攻、战略决战；抗日战争三阶段是战略防御、战略相持（最重要）、战略反攻"],"m":"","c":["sg"],"id":"1946a"},{"y":1947.38,"d":"1947年5月20日","t":"五二〇运动·第二条战线","ch":["史纲·第七章"],"p":"南京·上海·天津等地","s":"国民党统治区人民民主运动形成第二条战线","b":"国统区物价飞涨、民不聊生，各地学生举行“反饥饿、反内战、反迫害”示威游行，遭到军警镇压。","k":["毛泽东指出：中国境内已有了两条战线，学生运动与国民党反动政府之间的尖锐斗争是第二条战线","学生运动带动工人、农民和各阶层人民的斗争，与人民解放战争相配合","国民党政府陷入全民的包围之中"],"q":["考法：第二条战线指国统区以学生运动为先导的人民民主运动"],"m":"","c":["sg"],"id":"1947a"},{"y":1947.49,"d":"1947年6月30日","t":"刘邓大军挺进大别山","ch":["史纲·第七章"],"p":"鲁西南→大别山","s":"揭开战略进攻的序幕","b":"经过一年作战，国民党军的全面进攻和重点进攻相继被粉碎，战争形势开始发生根本变化。","k":["刘伯承、邓小平率晋冀鲁豫野战军主力强渡黄河，千里跃进大别山","陈赓、谢富治兵团挺进豫西，陈毅、粟裕率华东野战军主力进入豫皖苏，三路大军在中原形成“品”字形阵势","人民解放战争由战略防御转入战略进攻","1947年6月底刘伯承、邓小平率领大军强渡黄河，8月底千里跃进大别山；8月下旬陈赓、谢富治率领大军挺进豫西，9月陈毅、粟裕率领大军挺进苏鲁豫皖地区","三路大军打到外线，迫使国民党军由战略进攻转变为“全面防御”，人民军队结束了长期以来在国内革命战争中所处的战略防御地位"],"q":["易混：挺进大别山＝战略进攻开始（1947年下半年）；三大战役＝战略决战（1948年秋—1949年初）"],"m":"","c":["sg"],"id":"1947b"},{"y":1947.77,"d":"1947年10月10日","t":"《中国土地法大纲》","ch":["史纲·第七章","毛中特·第二章"],"p":"河北平山西柏坡","s":"规定实行耕者有其田的土地制度","b":"1947年下半年，解放区2/3的地方已基本实现“耕者有其田”，但还有1/3的地方没有进行土地制度改革，已进行土改的地方有的也不够彻底。1947年7—9月中共中央工作委员会在西柏坡召开全国土地会议，制定《中国土地法大纲》，10月由中共中央公布。","k":["废除封建性及半封建性剥削的土地制度，实行耕者有其田","按乡村人口平分土地，土地归农民所有","解放区土改使广大农民踊跃参军支前，为解放战争胜利奠定了雄厚的群众基础","《中国土地法大纲》明确规定征收富农多余土地；乡村中一切地主的土地及公地，由乡村农会接收、分配给无地或少地的农民","经过土改运动，到1948年秋，1亿人口的解放区消灭了封建生产关系","土地制度改革使占中国人口绝大多数的农民进一步认识到中国共产党是他们自身利益的坚决维护者，因而自觉地在党的周围团结起来，为打败蒋介石、建立新中国奠定了深厚的群众基础"],"q":["易混：减租减息（抗战）→《五四指示》（1946）→《中国土地法大纲》（1947）→《土地改革法》（1950）"],"m":"","c":["sg","mz"],"id":"1947c"},{"y":1947.98,"d":"1947年12月25日","t":"十二月会议·新民主主义三大经济纲领","ch":["毛中特·第二章","史纲·第七章"],"p":"陕北米脂杨家沟","s":"完整提出新民主主义三大经济纲领","b":"中共中央在陕北米脂县杨家沟召开扩大会议，毛泽东作《目前形势和我们的任务》报告。","k":["没收封建阶级的土地归农民所有","没收以蒋介石、宋子文、孔祥熙、陈立夫为首的垄断资本归新民主主义的国家所有","保护民族工商业","指出这是蒋介石二十年反革命统治由发展到消灭的转折点，是一百多年来帝国主义在中国的统治由发展到消灭的转折点","毛泽东指出中国人民的革命战争已经达到了一个转折点，解放军已经打退了蒋介石的数百万反动军队的进攻并使自己转入了进攻"],"q":["考法：没收官僚资本具有民主革命和社会主义革命的双重性质","考法：十二月会议所说的“转折点”是指人民解放军转入了全国规模的战略进攻，不是人民解放军占领南京，也不是战略决战时机成熟"],"m":"分地、收官、保民族","c":["mz","sg"],"id":"1947d"},{"y":1948.25,"d":"1948年4月1日","t":"《在晋绥干部会议上的讲话》","ch":["毛中特·第二章"],"p":"山西兴县","s":"完整表述新民主主义革命总路线","b":"中共中央由陕北东渡黄河前往华北途中，毛泽东在晋绥干部会议上讲话。","k":["“无产阶级领导的，人民大众的，反对帝国主义、封建主义和官僚资本主义的革命，这就是中国的新民主主义的革命。”","对象：帝国主义、封建主义、官僚资本主义，帝国主义是首要对象","动力：无产阶级是最基本的动力，农民是主力军，城市小资产阶级是可靠的同盟者，民族资产阶级也是动力之一","领导力量：无产阶级（通过中国共产党实现领导）——这是新旧民主主义革命的根本区别","土地改革的总路线是：依靠贫农，团结中农，有步骤地、有分别地消灭封建剥削制度，发展农业生产","第一次把官僚资本主义、官僚资产阶级列为中国革命的对象和敌人，第一次有了“三大对象、三座大山、三大敌人”的说法"],"q":["易混：官僚资本主义是在解放战争时期被明确列为革命对象的"],"m":"","c":["mz"],"id":"1948a"},{"y":1948.7,"d":"1948年9月12日—1949年1月31日","t":"辽沈·淮海·平津三大战役","ch":["史纲·第七章"],"p":"东北·华东·华北","s":"战略决战，奠定了全国胜利的基础","b":"1948年秋人民解放军发展到280万人，解放区连成一片，中共中央决定同国民党军进行战略决战。","k":["辽沈战役（1948年9—11月）解放东北全境","淮海战役（1948年11月—1949年1月）以60万对80万，基本解放长江以北的华东、中原地区","平津战役（1948年11月—1949年1月）北平和平解放，创造了“北平方式”","三大战役共歼灭和改编国民党军154万余人，国民党赖以维持其统治的主要军事力量基本被消灭","1948年秋敌我力量对比已发生根本变化，人民解放战争进入夺取全国胜利的战略决战阶段，人民解放军同国民党军队进行战略决战的时机已经成熟"],"q":["考法：解决国民党残余军队的三种方式——天津方式（战斗解决）、北平方式（和平改编）、绥远方式（暂维原状，以后改编）"],"m":"辽沈先打，淮海居中，平津收官","c":["sg"],"id":"1948b"},{"y":1949.2,"d":"1949年3月5—13日","t":"七届二中全会","ch":["史纲·第七章","毛中特·第三章"],"p":"河北平山西柏坡","s":"为新中国的建立作了政治上、思想上的准备","b":"在全国胜利前夕，党在西柏坡召开七届二中全会，规划胜利后的建国方针。","k":["党的工作重心由乡村移到城市，开始由城市到乡村并由城市领导乡村的时期","提出使中国稳步地由农业国转变为工业国、由新民主主义国家转变为社会主义国家的发展方向","指出全国胜利后，国内的基本矛盾是工人阶级和资产阶级的矛盾，国外的基本矛盾是中国和帝国主义国家的矛盾","提出“两个务必”：务必使同志们继续地保持谦虚、谨慎、不骄、不躁的作风，务必使同志们继续地保持艰苦奋斗的作风","全会提出解决国民党剩余军队的三种方式是天津式、北平式、绥远式","1949年3月25日毛泽东等中央领导人与中央机关、人民解放军总部进驻北平香山，标志着中国革命重心从农村转向城市","全会规定了党在全国胜利后在政治、经济、外交方面应当采取的基本政策，提出“另起炉灶”的方针，同时正式确立“打扫干净屋子再请客”的外交方针","毛泽东告诫全党，夺取全国胜利，这只是万里长征走完了第一步，中国革命以后的道路更长，工作更伟大，更艰苦"],"q":["考法：1949年3月23日党中央离开西柏坡前往北平，毛泽东称之为“进京赶考”","考法：“两个务必”思想意义深远，包含对我国几千年历史治乱规律的深刻借鉴和对胜利了的政党永葆先进性纯洁性的深刻忧思"],"m":"","c":["sg","mz"],"id":"1949a"},{"y":1949.31,"d":"1949年4月21—23日","t":"渡江战役·南京解放","ch":["史纲·第七章"],"p":"长江中下游·南京","s":"宣告国民党反动统治的覆灭","b":"国民党政府拒绝在《国内和平协定》上签字，国共和谈破裂。","k":["4月21日毛泽东、朱德发布《向全国进军的命令》，人民解放军在千里战线上强渡长江","4月23日南京解放，延续22年的国民党反动统治宣告覆灭","此后人民解放军向中南、西南、西北进军，1951年西藏和平解放"],"q":["考法：毛泽东《七律·人民解放军占领南京》——“宜将剩勇追穷寇，不可沽名学霸王”"],"m":"","c":["sg"],"id":"1949b"},{"y":1949.73,"d":"1949年9月21—30日","t":"新政协·《共同纲领》","ch":["史纲·第七章"],"p":"北平","s":"完成了建立新中国的各项准备","b":"1948年中共中央发布“五一口号”，号召召开新的政治协商会议，各民主党派和无党派民主人士热烈响应，走上与共产党合作的道路。1949年6月毛泽东发表《论人民民主专政》。","k":["中国人民政治协商会议第一届全体会议代行全国人民代表大会的职权","通过《中国人民政治协商会议共同纲领》，起临时宪法的作用，规定新中国实行人民民主专政","选举毛泽东为中央人民政府主席；定都北平并改名北京，以五星红旗为国旗，以《义勇军进行曲》为代国歌，采用公元纪年","1949年9月21日第一届全体会议在北平开幕，代表总数662人，出席635人","会议通过《中国人民政治协商会议组织法》《中华人民共和国中央人民政府组织法》和《中国人民政治协商会议共同纲领》，被认为是新中国奠基的3个历史性文件","会议确立经济建设方针“四面八方”：以公私兼顾、劳资两利，城乡互助、内外交流的政策，达到发展生产、繁荣经济之目的","1948年4月30日中共中央“五一口号”提出迅速召开政治协商会议、成立民主联合政府，揭开了中国共产党同各党派、各团体、各族各界人士协商建国的序幕，奠定了中国共产党领导的多党合作和政治协商制度的基础"],"q":["易混：1949年新政协代行人大职权、通过《共同纲领》；1954年第一届全国人大才通过第一部《中华人民共和国宪法》","易混：“占人类总数四分之一的中国人从此站起来了”出自政协第一届全体会议开幕词（9月21日），不是开国大典","易混：人民政协是中国共产党领导的以工农联盟为基础的人民民主统一战线的组织形式（不是国家机关）","易混：新政协的召开标志着中国共产党领导的多党合作和政治协商制度正式确立，标志着爱国统一战线和全国人民大团结在组织上完全形成"],"m":"","c":["sg"],"id":"1949c"},{"y":1949.75,"d":"1949年10月1日","t":"中华人民共和国成立","ch":["史纲·第八章","毛中特·第三章"],"p":"北京天安门","s":"新民主主义革命取得伟大胜利","b":"10月1日下午，开国大典在北京天安门广场隆重举行，毛泽东宣告中华人民共和国中央人民政府成立。","k":["结束了一百多年来中国被侵略被奴役的屈辱历史，真正实现了民族独立","中国人民从此站起来了，成为国家、社会和自己命运的主人","实现了从几千年封建专制政治向人民民主的伟大飞跃","为实现中华民族伟大复兴创造了根本社会条件","新中国的创建为实现由新民主主义到社会主义的转变和建立社会主义制度、进行社会主义现代化建设，扫清了主要障碍，创造了政治前提"],"q":["考法：新中国成立标志着半殖民地半封建社会的结束和新民主主义社会的建立，中国进入从新民主主义向社会主义过渡的时期"],"m":"","c":["sg","mz"],"id":"1949d"},{"y":1949.5,"d":"1949年","t":"《论人民民主专政》","ch":["毛中特·第二章","史纲·第七章"],"p":"北平","s":"系统论述人民民主专政理论，为新中国奠定理论基础","b":"新中国成立前夕，毛泽东发表《论人民民主专政》，总结新民主主义革命的基本经验，阐明新中国的国家性质。","k":["提出人民民主专政的概念：工人阶级（经过共产党）领导的、以工农联盟为基础的人民民主专政","总结新民主主义革命的基本经验，指出这就是我们的主要纲领","提出团结民族资产阶级，利用一切于国计民生有利的城乡资本主义因素","提出建国后“一边倒”的外交方针","毛泽东指出，严重的问题是教育农民"],"q":["易混：《将革命进行到底》（1948）第一次公开使用人民民主专政概念；《论人民民主专政》（1949）系统论述人民民主专政理论"],"m":"","c":["mz","sg"],"id":"1949e"},{"y":1950.49,"d":"1950年6月28日","t":"《中华人民共和国土地改革法》","ch":["史纲·第八章"],"p":"新解放区","s":"在新解放区彻底废除封建土地制度；这次土改是我国历史上规模最大、历次土改运动中进行得最好的一次","b":"新中国成立时，占全国人口多数的新解放区还没有进行土地改革。1950年6月中央人民政府公布《土地改革法》，规定这次土改的目的是废除地主阶级封建剥削的土地所有制，实行农民的土地所有制，解放农村生产力，发展农业生产，为新中国的工业化开辟道路。","k":["废除地主阶级封建剥削的土地所有制，实行农民的土地所有制","由征收富农多余土地改为保存富农经济，以孤立地主、保护中农","到1952年底，除部分少数民族地区外，全国基本完成土改，延续两千多年的封建土地制度被彻底摧毁","这次土改是我国历史上规模最大、历次土改运动中进行得最好的一次"],"q":["易混：《中国土地法大纲》（1947）征收富农多余土地财产；《土地改革法》（1950）保存富农经济"],"m":"","c":["sg"],"id":"1950a"},{"y":1950.8,"d":"1950年10月19日","t":"抗美援朝战争","ch":["史纲·第八章"],"p":"朝鲜半岛","s":"打出了国威军威，赢得了和平建设的环境","b":"1950年6月朝鲜内战爆发，美国出兵干涉并派第七舰队侵入台湾海峡；美军越过三八线，战火烧到鸭绿江边。应朝鲜请求，党中央作出抗美援朝、保家卫国的决策。","k":["10月19日中国人民志愿军跨过鸭绿江，10月25日打响第一仗，后定为抗美援朝纪念日","1953年7月27日朝鲜停战协定签字","国内同时开展镇压反革命运动和“三反”（反贪污、反浪费、反官僚主义）、“五反”运动"],"q":["考法：抗美援朝战争伟大胜利，是中国人民站起来后屹立于世界东方的宣言书"],"m":"","c":["sg"],"id":"1950b"},{"y":1953.45,"d":"1953年6月15日","t":"过渡时期总路线·“一五”计划","ch":["毛中特·第三章","史纲·第八章"],"p":"全国","s":"“一化三改”：社会主义建设与社会主义改造同时并举","b":"1952年底国民经济恢复任务基本完成。1953年6月毛泽东在中央政治局会议上提出过渡时期总路线，同年底正式向全党全国公布。","k":["在一个相当长的时期内，逐步实现国家的社会主义工业化，并逐步实现对农业、手工业和资本主义工商业的社会主义改造","主体是社会主义工业化，两翼是三大改造，体现了发展生产力与变革生产关系的有机统一","总路线的实质是使生产资料的社会主义所有制成为我国国家和社会的唯一的经济基础","1953年开始实施第一个五年计划，以156个建设项目为中心进行工业建设，1957年超额完成"],"q":["易混：1953年过渡时期总路线（一化三改）vs 1958年社会主义建设总路线（鼓足干劲、力争上游、多快好省）"],"m":"一化三改，一体两翼","c":["mz","sg"],"id":"1953a"},{"y":1954.71,"d":"1954年9月15日","t":"第一届全国人大·“五四宪法”","ch":["史纲·第八章","毛中特·第三章"],"p":"北京","s":"人民代表大会制度在全国范围内建立","b":"第一届全国人民代表大会第一次会议在北京召开。","k":["通过《中华人民共和国宪法》，这是我国第一部社会主义类型的宪法","以根本大法的形式把过渡时期总路线确定为国家在过渡时期的总任务","人民代表大会制度成为我国的根本政治制度"],"q":["易混：根本政治制度＝人民代表大会制度；基本政治制度＝中国共产党领导的多党合作和政治协商制度、民族区域自治制度、基层群众自治制度"],"m":"","c":["sg","mz"],"id":"1954a"},{"y":1956.32,"d":"1956年4月25日","t":"《论十大关系》","ch":["毛中特·第四章","史纲·第八章"],"p":"北京","s":"以毛泽东为主要代表的中国共产党人开始探索中国自己的社会主义建设道路的标志，是党探索中国社会主义建设道路的良好开端","b":"苏共二十大暴露了苏联模式的问题。毛泽东用一个多月时间听取国务院34个部门的汇报后，在中央政治局扩大会议上作报告。","k":["提出“以苏为鉴”，强调把马克思列宁主义基本原理同中国具体实际进行“第二次结合”","基本方针：调动一切积极因素为社会主义事业服务","论述了重工业和轻工业、农业，沿海工业和内地工业，中央和地方，汉族和少数民族，中国和外国等十个方面的关系","同年提出“百花齐放、百家争鸣”和“长期共存、互相监督”的方针","提出以农业为基础、以工业为主导，以农轻重为序发展国民经济的总方针","提出一整套“两条腿走路”的方针：重工业和轻工业、中央工业和地方工业、沿海工业和内地工业、大型企业和小型企业同时并举","十大关系的具体内容：重工业和轻工业、农业的关系，沿海工业和内地工业的关系，经济建设和国防建设的关系，国家、生产单位和生产者个人的关系，中央和地方的关系，汉族和少数民族的关系，党和非党的关系，革命和反革命的关系，是非关系，中国和外国的关系"],"q":["易混：“双百”方针针对科学文化工作；“长期共存、互相监督”针对共产党与民主党派的关系","易混：把马克思列宁主义基本原理同中国具体实际进行“第二次结合”是1956年4月《论十大关系》提出的，不是中共八大提出的；《论十大关系》为同年9月中共八大的召开作了理论准备"],"m":"","c":["mz","sg"],"id":"1956a"},{"y":1956.71,"d":"1956年9月15日","t":"中共八大","ch":["毛中特·第四章","史纲·第八章"],"p":"北京","s":"为全面建设社会主义指明了方向","b":"社会主义改造即将基本完成，党在执政条件下召开第一次全国代表大会。","k":["国内主要矛盾已经是人民对于建立先进的工业国的要求同落后的农业国的现实之间的矛盾，是人民对于经济文化迅速发展的需要同当前经济文化不能满足人民需要的状况之间的矛盾","党和人民的主要任务是集中力量发展社会生产力，尽快把我国从落后的农业国变为先进的工业国","经济建设方针：既反保守又反冒进，在综合平衡中稳步前进","陈云提出“三个主体、三个补充”的设想","大会宣布社会主义制度在我国已经基本上建立起来；还有阶级斗争，还要加强人民民主专政，但根本任务已经是在新的生产关系下面保护和发展生产力","在政治建设上提出扩大社会主义民主、健全社会主义法制，使党和政府的活动做到“有法可依”和“有法必依”；在执政党建设上提出加强执政党建设的问题"],"q":["易混：主要矛盾表述——八大（1956）；1981年历史决议“人民日益增长的物质文化需要同落后的社会生产之间的矛盾”；十九大（2017）“人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾”","易混：“第二次结合”是《论十大关系》（1956年4月）提出的，不是八大提出的；1958年社会主义建设总路线是八大二次会议通过的，不是八大"],"m":"","c":["mz","sg"],"id":"1956b"},{"y":1956.96,"d":"1956年底","t":"三大改造基本完成·社会主义基本制度确立","ch":["毛中特·第三章","史纲·第八章"],"p":"全国","s":"我国进入社会主义初级阶段","b":"1955年下半年起农业合作化迅速推进，带动手工业和资本主义工商业改造形成高潮；1956年初出现全行业公私合营高潮。","k":["农业：互助组（社会主义萌芽）→ 初级社（半社会主义）→ 高级社（完全社会主义），坚持自愿互利、典型示范、国家帮助","资本主义工商业：和平赎买，经过国家资本主义由初级形式（加工订货、统购包销、经销代销）到高级形式（公私合营），全行业公私合营后实行“定息”","社会主义基本制度的确立，是中国历史上最深刻最伟大的社会变革，为当代中国一切发展进步奠定了根本政治前提和制度基础","不足：1955年夏季以后要求过急，工作过粗，改变过快，形式过于简单划一","农业的社会主义改造是三大改造中首先进行的，采取互助合作化的方式","对农民不能采取剥夺的办法，只能引导、说服和教育，使其自愿地走合作化道路"],"q":["易混：个别企业公私合营时利润按“四马分肥”分配（国家所得税、企业公积金、工人福利费、资方红利）；全行业公私合营后改为“定息”"],"m":"","c":["mz","sg"],"id":"1956c"},{"y":1957.16,"d":"1957年2月27日","t":"《关于正确处理人民内部矛盾的问题》","ch":["毛中特·第四章","史纲·第八章"],"p":"北京","s":"把正确处理人民内部矛盾作为国家政治生活的主题","b":"1956年国际上发生波匈事件，国内也出现少数人闹事的情况。毛泽东在最高国务会议上讲话，6月经整理后公开发表。","k":["社会主义社会的基本矛盾仍然是生产关系和生产力、上层建筑和经济基础之间的矛盾，它们既相适应又相矛盾，可以通过社会主义制度本身不断得到解决","严格区分敌我矛盾和人民内部矛盾两类不同性质的矛盾：前者用专政的方法，后者用民主的方法（团结—批评—团结）","同年整风运动中开展的反右派斗争被严重扩大化，造成了不幸的后果","社会主义社会的基本矛盾是非对抗性的矛盾，具有“又相适应、又相矛盾”的特点，可以经过社会主义制度本身不断得到解决","解决人民内部矛盾的各领域方针：科学文化领域实行“百花齐放、百家争鸣”，民族之间实行民族平等、团结互助，共产党和民主党派之间实行“长期共存、互相监督”","这一论断的根本着眼点在于调动一切积极因素，团结一切可以团结的力量，把全党的注意力转到社会主义建设上来"],"q":["考法：处理人民内部矛盾的方法——政治思想领域“团结—批评—团结”，物质利益分配“统筹兼顾、适当安排”","易混：“长期共存、互相监督、肝胆相照、荣辱与共”十六字方针是十二大增加的，不是毛泽东提出的；毛泽东提出的是“长期共存、互相监督”八字方针"],"m":"","c":["mz","sg"],"id":"1957a"},{"y":1958.34,"d":"1958年5月5日","t":"社会主义建设总路线·“大跃进”·人民公社化运动","ch":["史纲·第八章","毛中特·第四章"],"p":"全国","s":"急于求成的严重失误","b":"八大二次会议正式通过“鼓足干劲、力争上游、多快好省地建设社会主义”的总路线，随后全国掀起“大跃进”和人民公社化运动。","k":["总路线反映了人民群众迫切要求改变经济文化落后状况的普遍愿望，但忽视了客观经济规律","以高指标、瞎指挥、浮夸风和“共产风”为主要标志的“左”倾错误严重泛滥","人民公社“一大二公”，搞平均主义和无偿调拨","1959年庐山会议后期错误地开展“反右倾”斗争，加上自然灾害和苏联背信弃义撕毁合同，国民经济在1959—1961年发生严重困难"],"q":["考法：教训——社会主义建设必须从实际出发，尊重客观经济规律，不能急于求成"],"m":"","c":["sg","mz"],"id":"1958a"},{"y":1962.03,"d":"1962年1月11日—2月7日","t":"七千人大会·国民经济调整","ch":["史纲·第八章","毛中特·第四章"],"p":"北京","s":"初步总结“大跃进”以来的经验教训","b":"1961年1月八届九中全会正式通过对国民经济实行“调整、巩固、充实、提高”的八字方针。","k":["1962年初扩大的中央工作会议（七千人大会）开展批评与自我批评，发扬党内民主","到1965年国民经济调整任务全面完成","探索中形成的理论成果：社会主义可分为不发达和比较发达两个阶段；以农业为基础、以工业为主导，按农轻重次序安排国民经济"],"q":["易混：八字方针是“调整、巩固、充实、提高”，不要与1979年的“调整、改革、整顿、提高”混淆"],"m":"","c":["sg","mz"],"id":"1962a"},{"y":1964.79,"d":"1964年10月16日、12月21日","t":"第一颗原子弹爆炸·明确“四个现代化”","ch":["史纲·第八章","毛中特·第四章"],"p":"新疆罗布泊·北京","s":"社会主义建设取得重大成就，明确现代化目标","b":"1964年10月16日我国第一颗原子弹爆炸成功；12月三届全国人大一次会议召开。","k":["周恩来在政府工作报告中提出，在不太长的历史时期内，把我国建设成为具有现代农业、现代工业、现代国防和现代科学技术的社会主义强国","提出“两步走”设想：先建立一个独立的比较完整的工业体系和国民经济体系，再全面实现四个现代化","1967年第一颗氢弹、1970年第一颗人造地球卫星“东方红一号”相继成功"],"q":["易混：1954年一届全国人大提出工业、农业、交通运输业和国防现代化；1964年三届全国人大一次会议明确农业、工业、国防和科学技术现代化目标"],"m":"","c":["sg","mz"],"id":"1964a"},{"y":1966.37,"d":"1966年5月16日—1976年10月","t":"“文化大革命”","ch":["史纲·第八章","毛中特·第一章"],"p":"全国","s":"一场给党、国家和各族人民带来严重灾难的内乱","b":"1966年5月中央政治局扩大会议通过《五一六通知》，8月八届十一中全会通过《关于无产阶级文化大革命的决定》，“文化大革命”全面发动。","k":["1981年历史决议指出：“文化大革命”是一场由领导者错误发动，被反革命集团利用，给党、国家和各族人民带来严重灾难的内乱","党、人民和人民军队进行了各种形式的抵制和斗争；1975年邓小平主持中央日常工作，进行全面整顿","1976年10月中央政治局执行党和人民的意志，一举粉碎“四人帮”，结束了“文化大革命”"],"q":["易混：“文化大革命”不是也不可能是任何意义上的革命或社会进步；要把毛泽东晚年的错误同经过长期历史检验形成为科学理论的毛泽东思想区别开来"],"m":"","c":["sg","mz"],"id":"1966a"},{"y":1971.82,"d":"1971年10月25日","t":"恢复联合国合法席位·外交新局面","ch":["史纲·第八章"],"p":"美国纽约·北京","s":"外交工作打开新局面","b":"中国国际地位不断提高，许多亚非拉国家支持恢复新中国在联合国的合法权利。","k":["1971年10月第26届联合国大会通过第2758号决议，恢复中华人民共和国在联合国的一切合法权利","1972年2月美国总统尼克松访华，中美发表《联合公报》（上海公报）；1979年1月1日中美正式建交","1972年9月中日两国建交；1974年毛泽东提出划分“三个世界”的战略思想"],"q":["考法：第2758号决议从政治上、法律上、程序上彻底解决了包括台湾在内全中国在联合国的代表权问题"],"m":"","c":["sg"],"id":"1971a"},{"y":1978.36,"d":"1978年5月11日","t":"真理标准问题大讨论","ch":["史纲·第九章","毛中特·第六章"],"p":"北京","s":"一场马克思主义的思想解放运动","b":"粉碎“四人帮”后，“两个凡是”（凡是毛主席作出的决策都坚决维护，凡是毛主席的指示都始终不渝地遵循）的方针严重束缚人们的思想。","k":["《光明日报》发表特约评论员文章《实践是检验真理的唯一标准》，引发全国范围的大讨论","冲破了“两个凡是”的严重束缚，为十一届三中全会的召开作了思想准备","为重新确立解放思想、实事求是的思想路线奠定了基础","这场深刻而广泛的马克思主义思想解放运动，成为正本清源、拨乱反正和改革开放的思想先导，使党内外开始出现酝酿对外开放和对各方面体制进行改革的新局面"],"q":["考法：真理标准问题讨论是马克思主义认识论（实践是检验真理的唯一标准）在中国现实中的运用"],"m":"","c":["sg","mz"],"id":"1978a"},{"y":1978.97,"d":"1978年12月18—22日","t":"十一届三中全会","ch":["史纲·第九章","毛中特·第五章"],"p":"北京","s":"新中国成立以来党的历史上具有深远意义的伟大转折","b":"全会前召开的中央工作会议上，邓小平作《解放思想，实事求是，团结一致向前看》讲话，实际上成为全会的主题报告。","k":["重新确立了解放思想、实事求是的思想路线","停止使用“以阶级斗争为纲”的错误口号，作出把党和国家工作中心转移到经济建设上来、实行改革开放的历史性决策","开启了改革开放和社会主义现代化建设新时期，实际上形成了以邓小平为核心的党的第二代中央领导集体","重新确立了马克思主义的思想路线、政治路线和组织路线，开始了在思想、政治、组织等领域的全面拨乱反正","恢复了党的民主集中制的优良传统，审查解决了历史上遗留的一批重大问题和一些重要领导人的功过是非问题","提出实现民主制度化、法律化的任务，决定健全党的民主集中制，健全党规党法，严肃党纪；增选中央领导机构成员，成立中央纪律检查委员会","结束了粉碎“四人帮”后党和国家工作在徘徊中前进的局面，将党领导的社会主义事业引向健康发展道路"],"q":["考法：十一届三中全会是中国特色社会主义理论体系形成发展的起点","易混：科学评价毛泽东并概括毛泽东思想的科学体系和活的灵魂，是1981年十一届六中全会《关于建国以来党的若干历史问题的决议》，不是十一届三中全会"],"m":"伟大转折：思想路线、工作中心、改革开放","c":["sg","mz"],"id":"1978b"},{"y":1978.9,"d":"1978年11月24日起","t":"农村改革·家庭联产承包责任制","ch":["史纲·第九章","毛中特·第六章"],"p":"安徽凤阳小岗村等","s":"经济体制改革首先在农村取得突破","b":"1978年11月，安徽省凤阳县小岗村开创了家庭联产承包责任制的先河，农民自发实行包产到户、包干到户。","k":["1982年1月1日，党历史上第一个关于农村工作的一号文件正式出台，明确指出包产到户、包干到户都是社会主义集体经济的生产责任制","家庭联产承包责任制的实质是打破人民公社体制下土地集体所有、集体经营的旧的农业耕作模式，实现土地集体所有权和经营权的分离，确立土地集体所有制基础上以户为单位的家庭承包经营的新型农业耕作模式","家庭联产承包责任制在全国普遍推行，人民公社体制随之废除","乡镇企业异军突起"],"q":["考法：改革从农村开始，1984年十二届三中全会后改革重点转向城市"],"m":"","c":["sg","mz"],"id":"1978c"},{"y":1979.24,"d":"1979年3月30日","t":"坚持四项基本原则","ch":["毛中特·第六章","史纲·第九章"],"p":"北京","s":"立国之本","b":"改革开放初期，社会上出现怀疑和否定社会主义道路、党的领导等错误思潮。邓小平在党的理论工作务虚会上作《坚持四项基本原则》讲话。","k":["必须坚持社会主义道路，坚持无产阶级专政（人民民主专政），坚持共产党的领导，坚持马列主义、毛泽东思想","四项基本原则是立国之本，改革开放是强国之路","二者统一于以经济建设为中心的伟大实践","邓小平首次提出“四项基本原则”的概念，指出坚持四项基本原则“是实现四个现代化的根本前提”"],"q":["易混：“一个中心、两个基本点”到1987年十三大才被完整概括为党在社会主义初级阶段的基本路线"],"m":"","c":["mz","sg"],"id":"1979a"},{"y":1980.65,"d":"1980年8月26日","t":"设立经济特区","ch":["毛中特·第六章","史纲·第九章"],"p":"深圳·珠海·汕头·厦门","s":"对外开放迈出重要步伐","b":"1979年7月中央决定对广东、福建两省实行特殊政策和灵活措施；1980年决定在深圳、珠海、汕头、厦门试办经济特区，8月26日深圳经济特区正式成立。","k":["1984年开放大连、上海等14个沿海港口城市；1988年设立海南省并建立经济特区；1990年开发开放上海浦东","逐步形成经济特区—沿海开放城市—沿海经济开放区—沿江和内陆开放城市—沿边开放城市的全方位对外开放格局","邓小平称经济特区是技术、管理、知识和对外政策的“窗口”"],"q":["考法：对外开放是我国的基本国策"],"m":"","c":["mz","sg"],"id":"1980a"},{"y":1981.49,"d":"1981年6月27日","t":"第二个历史决议","ch":["毛中特·第一章","史纲·第九章"],"p":"北京","s":"党在指导思想上完成了拨乱反正","b":"十一届六中全会通过《关于建国以来党的若干历史问题的决议》。","k":["彻底否定“文化大革命”的理论和实践","实事求是地评价毛泽东的历史地位：他的功绩是主要的，错误是次要的","科学论述了毛泽东思想，概括了贯穿其中的立场、观点和方法——毛泽东思想活的灵魂：实事求是、群众路线、独立自主","对我国社会主义主要矛盾作了规范表述：人民日益增长的物质文化需要同落后的社会生产之间的矛盾","第一次提出我国社会主义制度还处于初级的阶段","提出“计划经济为主、市场调节为辅”的方针","对十一届三中全会以来逐步确立的适合中国情况的建设社会主义现代化强国的道路，从10个方面作了概括，实质上初步提出了在中国建设什么样的社会主义和怎样建设社会主义的问题"],"q":["易混：三个历史决议——1945年《关于若干历史问题的决议》、1981年《关于建国以来党的若干历史问题的决议》、2021年《中共中央关于党的百年奋斗重大成就和历史经验的决议》","考法：《决议》解决了两个相互联系的重大历史课题：一是科学评价毛泽东的历史地位和毛泽东思想的科学体系，二是根据新的实际和发展要求实行改革开放、确立中国社会主义现代化建设正确道路"],"m":"活的灵魂：实事求是、群众路线、独立自主","c":["mz","sg"],"id":"1981a"},{"y":1982.67,"d":"1982年9月1日","t":"中共十二大","ch":["毛中特·第五章","史纲·第九章"],"p":"北京","s":"第一次明确提出“建设有中国特色的社会主义”","b":"邓小平在大会开幕词中总结历史经验。","k":["提出“把马克思主义的普遍真理同我国的具体实际结合起来，走自己的道路，建设有中国特色的社会主义”","提出到20世纪末力争使全国工农业年总产值翻两番的目标","同年12月五届全国人大五次会议通过现行宪法（“八二宪法”）","自十二大起，党的全国代表大会每五年召开一次，实现了制度化"],"q":["考法：“走自己的道路”是对新中国成立以来历史经验的基本总结","易混：邓小平理论主题形成于十二大，轮廓形成于十三大，走向成熟于南方谈话，“邓小平理论”正式提出于十五大并写入党章"],"m":"","c":["mz","sg"],"id":"1982a"},{"y":1984.81,"d":"1984年10月20日","t":"十二届三中全会·经济体制改革决定","ch":["毛中特·第六章","史纲·第九章"],"p":"北京","s":"改革重点由农村转向城市","b":"全会通过《中共中央关于经济体制改革的决定》。","k":["提出社会主义经济是公有制基础上的有计划的商品经济，突破了把计划经济同商品经济对立起来的传统观念","邓小平称赞决定“写出了一个政治经济学的初稿”","同年12月中英两国政府签署关于香港问题的联合声明"],"q":["易混：改革目标的演进——计划经济为主、市场调节为辅（十二大）→ 有计划的商品经济（1984）→ 社会主义市场经济体制（1992年十四大）"],"m":"","c":["mz","sg"],"id":"1984a"},{"y":1987.82,"d":"1987年10月25日","t":"中共十三大","ch":["毛中特·第六章","史纲·第九章"],"p":"北京","s":"系统阐述社会主义初级阶段理论","b":"大会召开时，改革开放已经进行了将近十年。","k":["我国正处在并将长期处在社会主义初级阶段：一是我国已经是社会主义社会，二是我国的社会主义社会还处在初级阶段","概括党在社会主义初级阶段的基本路线：以经济建设为中心，坚持四项基本原则，坚持改革开放（“一个中心、两个基本点”）","提出“三步走”发展战略：第一步从1981年到1990年，国民生产总值翻一番，解决人民的温饱问题；第二步从1991年到20世纪末，国民生产总值再翻一番，人民生活达到小康水平；第三步到21世纪中叶，国民生产总值再翻两番，人民生活比较富裕，基本实现现代化","第一次对中国特色社会主义理论进行系统的概括，标志着邓小平理论轮廓的形成","制定了经济体制改革和政治体制改革的基本任务和奋斗目标"],"q":["易混：社会主义初级阶段特指我国从1956年生产资料私有制的社会主义改造基本完成到社会主义现代化基本实现的整个历史阶段","易混：基本路线奋斗目标——富强、民主、文明（十三大）→ 富强民主文明和谐（十七大）→ 富强民主文明和谐美丽（十九大）"],"m":"一个中心、两个基本点；三步走","c":["mz","sg"],"id":"1987a"},{"y":1992.05,"d":"1992年1月18日—2月21日","t":"邓小平南方谈话","ch":["毛中特·第六章","史纲·第九章"],"p":"武昌·深圳·珠海·上海","s":"又一个解放思想、实事求是的宣言书","b":"东欧剧变、苏联解体前后，一些人对改革开放产生了姓“资”姓“社”的疑问。邓小平视察南方并发表重要谈话。","k":["计划多一点还是市场多一点，不是社会主义与资本主义的本质区别，计划和市场都是经济手段","社会主义的本质：解放生产力，发展生产力，消灭剥削，消除两极分化，最终达到共同富裕","判断标准：是否有利于发展社会主义社会的生产力，是否有利于增强社会主义国家的综合国力，是否有利于提高人民的生活水平（“三个有利于”）","“发展才是硬道理”","计划经济不等于社会主义，资本主义也有计划；市场经济不等于资本主义，社会主义也有市场；市场经济作为资源配置的一种方式本身不具有制度属性，可以和不同的社会制度结合","指出社会主义初级阶段的长期性和前途，阐述社会主义初级阶段长期性和社会主义必将代替资本主义；强调加强党的建设"],"q":["考法：南方谈话和十四大标志着邓小平理论走向成熟"],"m":"三个有利于，发展是硬道理","c":["mz","sg"],"id":"1992a"},{"y":1992.78,"d":"1992年10月12日","t":"中共十四大","ch":["毛中特·第六章","史纲·第九章"],"p":"北京","s":"确立社会主义市场经济体制的改革目标","b":"在南方谈话精神推动下，改革开放和现代化建设进入新的阶段。","k":["明确我国经济体制改革的目标是建立社会主义市场经济体制","确立邓小平建设有中国特色社会主义理论在全党的指导地位","对这一理论的主要内容作了系统概括","抓住机遇，加快发展，集中精力把经济建设搞上去","提出用邓小平建设有中国特色社会主义的理论武装全党"],"q":["易混：十四大称“邓小平建设有中国特色社会主义理论”；十五大正式使用“邓小平理论”并确立为党的指导思想","考法：以邓小平南方谈话和党的十四大为标志，改革开放和现代化建设事业进入从计划经济体制向社会主义市场经济体制转变的新阶段"],"m":"","c":["mz","sg"],"id":"1992b"},{"y":1997.5,"d":"1997年7月1日、1999年12月20日","t":"香港、澳门回归祖国","ch":["毛中特·第六章","史纲·第九章"],"p":"香港·澳门","s":"“一国两制”的成功实践","b":"“一国两制”构想最初为解决台湾问题提出，首先运用于解决香港、澳门问题。1984年中英、1987年中葡分别签署关于香港、澳门问题的联合声明。","k":["1997年7月1日中国政府恢复对香港行使主权，1999年12月20日恢复对澳门行使主权","实行“港人治港”“澳人治澳”、高度自治","洗雪了百年国耻，是实现祖国完全统一的重要一步"],"q":["考法：“一国两制”的前提是一个中国；台湾问题是中国的内政"],"m":"","c":["mz","sg"],"id":"1997a"},{"y":1997.7,"d":"1997年9月12日","t":"中共十五大","ch":["毛中特·第六章","史纲·第九章"],"p":"北京","s":"把邓小平理论确立为党的指导思想","b":"邓小平于1997年2月逝世，党的十五大高举邓小平理论伟大旗帜。","k":["正式使用“邓小平理论”的科学称谓，确立为党的指导思想并写入党章","明确公有制为主体、多种所有制经济共同发展是社会主义初级阶段的基本经济制度","提出依法治国、建设社会主义法治国家的基本方略","系统阐述党在社会主义初级阶段的基本纲领：建设有中国特色社会主义的经济、政治、文化的基本目标和基本政策，三者有机统一、不可分割","非公有制经济是我国社会主义市场经济的重要组成部分"],"q":["考法：邓小平理论的首要基本理论问题是“什么是社会主义、怎样建设社会主义”，精髓是解放思想、实事求是"],"m":"","c":["mz","sg"],"id":"1997b"},{"y":2000.15,"d":"2000年2月25日","t":"提出“三个代表”重要思想","ch":["毛中特·第七章","史纲·第九章"],"p":"广东","s":"回答“建设什么样的党、怎样建设党”","b":"江泽民在广东考察时首次全面提出；2001年“七一”讲话作了系统阐述。","k":["中国共产党始终代表中国先进生产力的发展要求，始终代表中国先进文化的前进方向，始终代表中国最广大人民的根本利益","核心观点是“三个始终代表”","本质在坚持执政为民"],"q":["易混：邓小平理论——什么是社会主义、怎样建设社会主义；“三个代表”——建设什么样的党、怎样建设党；科学发展观——实现什么样的发展、怎样发展 };
const LS='sizheng-timeline-v1';
let saved={},storageOK=true;
try{const probe=LS+'-check';localStorage.setItem(probe,'1');localStorage.removeItem(probe);saved=JSON.parse(localStorage.getItem(LS)||'{}')||{};}catch(_){saved={};storageOK=false;}
const S={course:CO[saved.course]?saved.course:'sg',cur:Object.assign({},saved.cur),quiz:!!saved.quiz,star:Object.assign({},saved.star),done:Object.assign({},saved.done),f:'all',ch:'',q:'',revealed:false,playing:false};
function save(){try{localStorage.setItem(LS,JSON.stringify({course:S.course,cur:S.cur,quiz:S.quiz,star:S.star,done:S.done}));}catch(_){storageOK=false;const el=$('.storage-note');if(el)el.textContent='当前环境无法保存进度；重点与掌握记录仅在本次打开期间有效。';}}

const yr=e=>Math.floor(e.y);
function eraOf(e,k){const set=ER[CO[k||S.course].set];for(const r of set){if(e.y>=r.from&&e.y<r.to)return r;}return set[set.length-1];}
function chParts(c){const i=c.indexOf('·'),cn=c.slice(0,i),chap=c.slice(i+1);return {c:c,cn:cn,chap:chap,name:(CH[cn]||{})[chap]||'',k:P2K[cn]};}
function myChaps(e){return e.ch.map(chParts).filter(x=>x.k===S.course);}
function curId(){const id=S.cur[S.course];if(id&&BY[id]&&BY[id].c.indexOf(S.course)>=0)return id;return LISTS[S.course][0].id;}
function cur(){return BY[curId()];}
function shortDate(e){const p=yr(e)+'年';return e.d.indexOf(p)===0?e.d.slice(p.length):e.d;}
function terms(){return S.q.trim().toLowerCase().split(/\s+/).filter(Boolean);}
function hay(e){if(!e._h){e._h=[e.t,e.d,e.p,e.s,e.b,e.m].concat(e.k,e.q,e.ch.map(c=>{const x=chParts(c);return x.cn+x.chap+x.name;})).join('\n').toLowerCase();}return e._h;}
function filtered(){return S.f!=='all'||!!S.ch||terms().length>0;}
let VIS=[];
function computeVis(){const T=terms();VIS=LISTS[S.course].filter(e=>{if(S.f==='star'&&!S.star[e.id])return false;if(S.f==='todo'&&S.done[e.id])return false;if(S.ch&&e.ch.indexOf(S.ch)<0)return false;if(T.length){const h=hay(e);for(const t of T){if(h.indexOf(t)<0)return false;}}return true;});return VIS;}
function hl(text){const T=terms();const s=esc(text);if(!T.length)return s;const re=new RegExp(T.map(t=>esc(t).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),'gi');return s.replace(re,m=>'<mark>'+m+'</mark>');}
function navList(){const id=curId();if(filtered()&&VIS.some(e=>e.id===id))return VIS;return LISTS[S.course];}
function neighbor(d){const L=navList(),i=L.findIndex(e=>e.id===curId());const j=i+d;return (i>=0&&j>=0&&j<L.length)?L[j]:null;}

function updateCap(){const n=LISTS[S.course].length;$('#cap').textContent=filtered()?('筛选出 '+VIS.length+' / '+n+' 个节点'):(CO[S.course].name+' · '+n+' 个节点');}
