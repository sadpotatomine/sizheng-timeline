function ensureVisible(el,center){
  const list=$('#list');if(!el||!list)return;
  const lr=list.getBoundingClientRect(),r=el.getBoundingClientRect();
  const top=r.top-lr.top+list.scrollTop,head=70;
  if(center){list.scrollTop=Math.max(0,top-list.clientHeight/2+r.height/2);return;}
  if(r.top<lr.top+head)list.scrollTop=top-head-4;else if(r.bottom>lr.bottom)list.scrollTop=top+r.height-list.clientHeight+4;
}
function markList(scroll){
  const id=curId();
  $$('#list .item[aria-current]').forEach(x=>x.removeAttribute('aria-current'));

  if(el){el.setAttribute('aria-current','true');if(scroll)ensureVisible(el,false);}
}
function refreshFlags(id){const el=$('#list .item[data-id="'+id+'"] .it-f');if(el)el.innerHTML=flagsHTML(BY[id]);}

/* ---------- 详情 ---------- */
function tipHTML(x){const m=/^(易混|考法)：/.exec(x);return m?'<li><span class="k">'+m[1]+'</span>'+esc(x.slice(m[0].length))+'</li>':'<li>'+esc(x)+'</li>';}
function pnBtn(x,dir){

function actsHTML(e){

}
function renderDetail(){

  h+=hide?'<div class="sig masked"><span class="lab">意义</span><span class="mask" aria-hidden="true"></span><span class="vh">已隐藏，点“显示答案”查看</span></div>':'<p class="sig"><span class="lab">意义</span>'+esc(e.s)+'</p>';
  if(hide){
    h+='<div class="quiz"><p class="qq">先自己回想：这件事的<b>意义</b>是什么？有哪 <b>'+e.k.length+'</b> 条考点、哪些易混点？</p><div class="qa"><button class="btn primary" type="button" data-act="reveal">'+IC.eye+'<span>显示答案</span></button><button class="btn" type="button" data-act="random">'+IC.shuffle+'<span>换一题</span></button></div></div>';

  if(!hide){

    if(e.q.length)h+='<section class="blk"><h3 class="lab">易混 · 考法</h3><ul class="tips">'+e.q.map(tipHTML).join('')+'</ul></section>';
    if(e.m)h+='<section class="blk"><h3 class="lab">口诀</h3><p class="mn">'+esc(e.m)+'</p></section>';

  const d=$('#detail'),same=d.dataset.id===e.id,st=d.scrollTop;

/* ---------- 时间带 ---------- */
let POS=[];
function layoutRibbon(){
  const L=LISTS[S.course],N=L.length,tr=$('#track');
  const y0=Math.floor(L[0].y)-0.5,y1=Math.floor(L[N-1].y)+1.5,W=0.4;
  const lin=y=>(y-y0)/(y1-y0),pad=12/(tr.clientWidth||800),inset=p=>pad+(1-2*pad)*p;
  POS=L.map((e,i)=>inset(W*lin(e.y)+(1-W)*(i+0.5)/N));
  const P=Y=>{let n=0;while(n<N&&L[n].y<Y)n++;return inset(W*lin(Y)+(1-W)*n/N);};
  const set=ER[CO[S.course].set];
  let h='<div class="ribbon-meta"><span class="era-current"></span><span class="ribbon-count"></span></div><div class="rail"></div>';
  set.forEach(r=>{
    if(!L.some(e=>e.y>=r.from&&e.y<r.to))return;
    const a=r.from<=y0?0:P(r.from),b=r.to>=y1?1:P(r.to);
    h+='<div class="band" data-era="'+r.k+'" style="left:'+(a*100).toFixed(3)+'%;width:'+((b-a)*100).toFixed(3)+'%"><span class="bl">'+esc(r.short)+'</span><span class="bb"></span></div>';
  });
  const tk=[{y:yr(L[0]),p:POS[0]}];
  set.forEach(r=>{if(r.tick&&r.from>L[0].y&&r.from<L[N-1].y)tk.push({y:r.tick,p:P(r.from)});});
  tk.push({y:yr(L[N-1]),p:POS[N-1]});
  const w=tr.clientWidth||800,kept=[];
  tk.forEach((t,i)=>{if(kept.length&&(t.p-kept[kept.length-1].p)*w<50){if(i===tk.length-1)kept.pop();else return;}kept.push(t);});
  h+=kept.map(t=>'<span class="tick'+(t.p*w<24?' first':(1-t.p)*w<24?' last':'')+'" data-p="'+t.p+'" style="left:'+(t.p*100).toFixed(3)+'%">'+t.y+'</span>').join('');
  h+=L.map((e,i)=>'<span class="dot-e" data-i="'+i+'" data-era="'+eraOf(e).k+'" style="left:'+(POS[i]*100).toFixed(3)+'%"></span>').join('');
  h+='<span class="cur-line"></span><span class="cur-dot"></span><span class="cur-lab"></span>';
  tr.innerHTML=h;
  tr.setAttribute('aria-valuemin','1');tr.setAttribute('aria-valuemax',String(N));
  paintDots();updateCursor();
}
function paintDots(){
  const L=LISTS[S.course],vis=filtered()?new Set(VIS.map(e=>e.id)):null;
  $$('#track .dot-e').forEach(d=>{const e=L[+d.dataset.i];d.classList.toggle('done',!!S.done[e.id]);d.classList.toggle('dim',!!vis&&!vis.has(e.id));});
}
function updateCursor(){
  const L=LISTS[S.course],id=curId(),i=L.findIndex(e=>e.id===id);if(i<0||!POS.length)return;
  const tr=$('#track'),p=POS[i],e=L[i],r=eraOf(e),pc=(p*100).toFixed(3)+'%';
  ['.cur-line','.cur-dot','.cur-lab'].forEach(s=>{const el=$(s,tr);if(el){el.style.left=pc;el.setAttribute('data-era',r.k);}});
  const lab=$('.cur-lab',tr);if(lab){lab.textContent=yr(e);lab.classList.toggle('first',p*tr.clientWidth<24);lab.classList.toggle('last',(1-p)*tr.clientWidth<24);}
  const w=tr.clientWidth;$$('.tick',tr).forEach(t=>t.classList.toggle('hide',Math.abs(+t.dataset.p-p)*w<48));
  $('.era-current',tr).textContent=r.short;$('.era-current',tr).setAttribute('data-era',r.k);$('.ribbon-count',tr).textContent=(i+1)+' / '+L.length;
  tr.setAttribute('aria-valuenow',String(i+1));tr.setAttribute('aria-valuetext',e.d+' '+e.t);
}
function bindTrack(){
  const tr=$('#track');let drag=false,px=null,raf=0;
  const pick=()=>{raf=0;if(px==null)return;const rc=tr.getBoundingClientRect(),t=(px-rc.left)/rc.width,L=LISTS[S.course];
    const vis=filtered()&&VIS.length?new Set(VIS.map(e=>e.id)):null;let bi=-1,bd=9;
    POS.forEach((p,i)=>{if(vis&&!vis.has(L[i].id))return;const d=Math.abs(p-t);if(d<bd){bd=d;bi=i;}});
    if(bi>=0&&L[bi].id!==curId())select(L[bi].id,{from:'ribbon'});};
  const queue=x=>{px=x;if(!raf)raf=requestAnimationFrame(pick);};
  tr.addEventListener('pointerdown',ev=>{if(ev.button>0)return;drag=true;try{tr.setPointerCapture(ev.pointerId);}catch(_){}queue(ev.clientX);});
  tr.addEventListener('pointermove',ev=>{if(drag)queue(ev.clientX);});
  const end=()=>{drag=false;};
  tr.addEventListener('pointerup',end);tr.addEventListener('pointercancel',end);tr.addEventListener('lostpointercapture',end);
  tr.addEventListener('keydown',ev=>{const L=navList();
    if(ev.key==='Home'){ev.preventDefault();select(L[0].id);}
    else if(ev.key==='End'){ev.preventDefault();select(L[L.length-1].id);}
    else if(ev.key==='ArrowUp'){ev.preventDefault();step(1);}
    else if(ev.key==='ArrowDown'){ev.preventDefault();step(-1);}});
}

/* ---------- 交互 ---------- */
function updateProg(){const L=LISTS[S.course],n=L.filter(e=>S.done[e.id]).length;$('#prog .txt').textContent=(isNarrow()?'':'已掌握 ')+n+'/'+L.length;$('#prog').setAttribute('aria-label','已掌握 '+n+' 个，共 '+L.length+' 个节点');$('#prog .bar i').style.width=(n/L.length*100).toFixed(1)+'%';$('#prog').title=CO[S.course].full+'：已掌握 '+n+' 个，共 '+L.length+' 个节点';}
function setHash(){const h='#'+S.course+'/'+curId();if(location.hash!==h){try{history.replaceState(null,'',h);}catch(_){}}}
function fromHash(){const m=/^#(sg|mz|my)(?:\/(\d{4}[a-h]))?$/.exec(location.hash||'');if(!m)return false;S.course=m[1];if(m[2]&&BY[m[2]]&&BY[m[2]].c.indexOf(m[1])>=0)S.cur[m[1]]=m[2];return true;}
function select(id,o){
  o=o||{};const e=BY[id];if(!e||e.c.indexOf(S.course)<0)return;
  if(!o.auto)stopPlay();
  S.cur[S.course]=id;S.revealed=false;save();
  renderDetail();markList(o.from!=='list');updateCursor();setHash();
  if(o.from==='list'&&isNarrow())closeSide();
}
function step(d){const x=neighbor(d);if(x){select(x.id,{auto:step.auto});return true;}return false;}
function renderAll(){
  $$('.seg button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.course===S.course)));
  renderChSel();renderList();renderDetail();layoutRibbon();updateProg();setHash();
  ensureVisible($('#list .item[aria-current]'),true);
}
function setCourse(k){if(!CO[k]||k===S.course)return;stopPlay();S.course=k;S.ch='';S.revealed=false;save();renderAll();}
function afterFilter(){renderList();paintDots();renderDetail();ensureVisible($('#list .item[aria-current]'),false);}
function setFilter(f){S.f=f;$$('.chip').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.f===f)));afterFilter();}
function setQ(v){S.q=v;const q=$('#q');if(q.value!==v)q.value=v;$('#clearQ').hidden=!v;$('#kbd').style.display=v?'none':'';afterFilter();}
function setCh(c){S.ch=c;renderChSel();afterFilter();}
function toggle(kind){
  const e=cur(),m=kind==='star'?S.star:S.done;
  if(m[e.id])delete m[e.id];else m[e.id]=1;save();
  refreshFlags(e.id);paintDots();updateProg();
  const a=$('#acts');if(a)a.innerHTML=actsHTML(e);
  if((kind==='star'&&S.f==='star')||(kind==='done'&&S.f==='todo')){renderList();paintDots();}
}
function grade(ok){
  const e=cur();const nx=neighbor(1);
  if(ok)S.done[e.id]=1;else delete S.done[e.id];save();
  refreshFlags(e.id);updateProg();
  if(S.f==='todo'){renderList();}
  paintDots();
  if(nx)select(nx.id);else{renderDetail();}
}
function randomPick(){
  const L=navList(),id=curId();let pool=L.filter(e=>e.id!==id&&!S.done[e.id]);if(!pool.length)pool=L.filter(e=>e.id!==id);
  if(pool.length)select(pool[Math.floor(Math.random()*pool.length)].id);
}
function tagClick(c){
  const x=chParts(c),e=cur();if(!x.k)return;
  stopPlay();
  if(x.k!==S.course){S.course=x.k;S.cur[x.k]=e.id;}
  S.ch=c;S.revealed=false;save();renderAll();
  if(isNarrow())openSide();
}
let timer=null;
function setPlay(on){
  S.playing=on;const b=$('#playBtn');b.setAttribute('aria-pressed',String(on));b.setAttribute('aria-label',on?'暂停自动播放':'自动播放（每6秒切换）');b.innerHTML=on?IC.pause:IC.play;
  clearInterval(timer);timer=null;
  if(on)timer=setInterval(()=>{step.auto=true;const ok=step(1);step.auto=false;if(!ok)setPlay(false);},6000);
}
function stopPlay(){if(S.playing)setPlay(false);}
function updateQuizBtn(){const b=$('#quizBtn');b.setAttribute('aria-pressed',String(S.quiz));b.querySelector('span').textContent=S.quiz?'自测中':'自测';}
let drawerReturn=null;
function syncInert(){
  const s=$('#side'),narrow=isNarrow(),opened=narrow&&s.classList.contains('open'),hide=narrow&&!opened;
  s.inert=hide;s.setAttribute('aria-hidden',String(hide));
  if(opened){s.setAttribute('role','dialog');s.setAttribute('aria-modal','true');}else{s.removeAttribute('role');s.removeAttribute('aria-modal');}
  ['.top','#detail','.ribbon'].forEach(sel=>{$(sel).inert=opened;});
}
function openSide(){drawerReturn=document.activeElement;$('#side').classList.add('open');$('#scrim').classList.add('show');$('#menuBtn').setAttribute('aria-expanded','true');syncInert();ensureVisible($('#list .item[aria-current]'),true);if(isNarrow())$('#closeSide').focus({preventScroll:true});}
function closeSide(){const was=$('#side').classList.contains('open');$('#side').classList.remove('open');$('#scrim').classList.remove('show');$('#menuBtn').setAttribute('aria-expanded','false');syncInert();if(was&&isNarrow())(drawerReturn&&drawerReturn.isConnected?drawerReturn:$('#menuBtn')).focus({preventScroll:true});}
const sideOpen=()=>$('#side').classList.contains('open');

$$('.seg button').forEach(b=>b.addEventListener('click',()=>setCourse(b.dataset.course)));
$$('.chip').forEach(b=>b.addEventListener('click',()=>setFilter(b.dataset.f)));
$('#q').addEventListener('input',ev=>setQ(ev.target.value));
$('#q').addEventListener('keydown',ev=>{if(ev.key==='Enter'){const f=VIS[0];if(f)select(f.id,{from:'list'});ev.target.blur();}});
$('#clearQ').addEventListener('click',()=>{setQ('');$('#q').focus();});
$('#chSel').addEventListener('change',ev=>setCh(ev.target.value));
$('#list').addEventListener('click',ev=>{
  const it=ev.target.closest('.item');if(it){select(it.dataset.id,{from:'list'});return;}
  const b=ev.target.closest('button[data-act]');if(!b)return;
  if(b.dataset.act==='clearq')setQ('');else if(b.dataset.act==='all')setFilter('all');else if(b.dataset.act==='allch')setCh('');
});
$('#detail').addEventListener('click',ev=>{
  const b=ev.target.closest('button');if(!b||b.disabled)return;
  if(b.dataset.go){select(b.dataset.go);return;}
  if(b.dataset.ch){tagClick(b.dataset.ch);return;}
  const a=b.dataset.act;
  if(a==='star'||a==='done')toggle(a);
  else if(a==='reveal'){S.revealed=true;renderDetail();}
  else if(a==='random')randomPick();
  else if(a==='got')grade(true);
  else if(a==='again')grade(false);
});
$('#quizBtn').addEventListener('click',()=>{S.quiz=!S.quiz;S.revealed=false;save();updateQuizBtn();renderDetail();});
$('#playBtn').addEventListener('click',()=>{if(!S.playing){const L=navList();if(L.length&&L[L.length-1].id===curId())select(L[0].id);}setPlay(!S.playing);});
$('#menuBtn').addEventListener('click',()=>sideOpen()?closeSide():openSide());
$('#closeSide').addEventListener('click',closeSide);
$('#scrim').addEventListener('click',closeSide);
document.addEventListener('keydown',ev=>{
  if(ev.key==='Tab'&&isNarrow()&&sideOpen()){
    const focusable=$$('button:not(:disabled),input,select,[tabindex="0"]',$('#side')).filter(e=>e.getClientRects().length),first=focusable[0],last=focusable[focusable.length-1];
    if(ev.shiftKey&&document.activeElement===first){ev.preventDefault();last.focus();}
    else if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first.focus();}
  }
  const t=ev.target,typing=/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)||t.isContentEditable;
  if(ev.key==='Escape'){
    if(sideOpen()){closeSide();ev.preventDefault();return;}
    if(t.id==='q'){if(S.q)setQ('');else t.blur();ev.preventDefault();}
    return;
  }
  if(typing||ev.metaKey||ev.ctrlKey||ev.altKey)return;
  if(ev.key==='/'){ev.preventDefault();if(isNarrow())openSide();$('#q').focus();}
  else if(ev.key==='ArrowLeft'){ev.preventDefault();step(-1);}
  else if(ev.key==='ArrowRight'){ev.preventDefault();step(1);}
});
window.addEventListener('hashchange',()=>{const c=S.course,i=S.cur[c];if(fromHash()&&(S.course!==c||S.cur[S.course]!==i)){S.ch='';renderAll();}});
let rz=0;
window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{layoutRibbon();syncInert();updateProg();if(!isNarrow())closeSide();},120);});

fromHash();
updateQuizBtn();setPlay(false);syncInert();renderAll();bindTrack();
})();
</script>
</body>
</html>
