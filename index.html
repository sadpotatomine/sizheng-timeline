/* ---------- 时间带 ---------- */
let POS=[],trackW=800,curEls=null;
function cacheCurEls(){const tr=$('#track');curEls={line:$('.cur-line',tr),dot:$('.cur-dot',tr),lab:$('.cur-lab',tr),fill:$('.rail-fill',tr),ticks:$$('.tick',tr)};}
/* 小球定位：只写 transform（translateX / 进度条 scaleX），走合成层，不读布局、不触发重排。
   轨道宽度在 layoutRibbon / 尺寸变化时缓存到 trackW，每帧直接用缓存值算像素偏移。 */
/* 直线轨道：中心线恒在 y=27，轨道 SVG、小球、节点圆点共用这条直线，视觉上严丝合缝。 */
function railPath(){
  return 'M0 27L'+Math.max(1,Math.round(trackW))+' 27';
}
function paintBall(p){
  if(!curEls)cacheCurEls();if(!curEls)return;
  const x=p*trackW,tx='translateX('+x.toFixed(2)+'px)';
  if(curEls.line)curEls.line.style.transform=tx;
  if(curEls.dot)curEls.dot.style.transform=tx;
  if(curEls.fill)curEls.fill.style.strokeDasharray=(p*100).toFixed(2)+' 100';
  const lab=curEls.lab;
  if(lab){const f=x<24,l=!f&&(trackW-x)<24;
    if(lab.classList.contains('first')!==f)lab.classList.toggle('first',f);
    if(lab.classList.contains('last')!==l)lab.classList.toggle('last',l);
    lab.style.transform=tx+(f?'':l?' translateX(-100%)':' translateX(-50%)');}
  if(curEls.ticks)curEls.ticks.forEach(t=>{const hide=Math.abs(+t.dataset.p-p)*trackW<48;if(t.classList.contains('hide')!==hide)t.classList.toggle('hide',hide);});
}
function layoutRibbon(){
  const L=LIST,N=L.length,tr=$('#track');
  trackW=tr.clientWidth||trackW;
  const pad=12/trackW,inset=p=>pad+(1-2*pad)*p;
  /* 节点等距：位置只由序号决定，与真实年份间隔无关，游标每步移动距离相同 */
  POS=L.map((e,i)=>inset((i+0.5)/N));
  const set=ERASET;
  const wd=railPath();
  let h='<div class="ribbon-meta"><span class="era-current"></span><span class="ribbon-count"></span></div><svg class="rail-svg" viewBox="0 0 '+Math.max(1,Math.round(trackW))+' 72" preserveAspectRatio="none" aria-hidden="true"><path class="rail-w" d="'+wd+'"/><path class="rail-fill" pathLength="100" stroke-dasharray="0 100" d="'+wd+'"/></svg>';
  set.forEach(r=>{
    let a=-1,b=-1;L.forEach((e,i)=>{if(e.y>=r.from&&e.y<r.to){if(a<0)a=i;b=i;}});
    if(a<0)return;
    const x0=inset(a/N),x1=inset((b+1)/N);
    h+='<div class="band" data-era="'+r.k+'" style="left:'+(x0*100).toFixed(3)+'%;width:'+((x1-x0)*100).toFixed(3)+'%"><span class="bl">'+esc(r.short)+'</span><span class="bb"></span></div>';
  });
  const tk=[{y:yr(L[0]),p:POS[0]}];
  set.forEach(r=>{if(r.tick&&r.from>L[0].y&&r.from<L[N-1].y){let n=0;while(n<N&&L[n].y<r.from)n++;tk.push({y:r.tick,p:inset(n/N)});}});
  tk.push({y:yr(L[N-1]),p:POS[N-1]});
  const w=trackW,kept=[];
  tk.forEach((t,i)=>{if(kept.length&&(t.p-kept[kept.length-1].p)*w<50){if(i===tk.length-1)kept.pop();else return;}kept.push(t);});
  h+=kept.map(t=>'<span class="tick'+(t.p*w<24?' first':(1-t.p)*w<24?' last':'')+'" data-p="'+t.p+'" style="left:'+(t.p*100).toFixed(3)+'%">'+t.y+'</span>').join('');
  h+=L.map((e,i)=>'<span class="dot-e" data-i="'+i+'" data-era="'+eraOf(e).k+'" style="left:'+(POS[i]*100).toFixed(3)+'%;top:27px"></span>').join('');
  h+='<span class="cur-line"></span><span class="cur-dot"></span><span class="cur-lab"></span>';
  tr.innerHTML=h;cacheCurEls();
  tr.setAttribute('aria-valuemin','1');tr.setAttribute('aria-valuemax',String(N));
  paintDots();updateCursor();
}
function paintDots(){
  const L=LIST,vis=filtered()?new Set(VIS.map(e=>e.id)):null;
  $$('#track .dot-e').forEach(d=>{const e=L[+d.dataset.i];d.classList.toggle('done',!!S.done[e.id]);d.classList.toggle('dim',!!vis&&!vis.has(e.id));});
}
function updateCursor(){
  const L=LIST,id=curId(),i=L.findIndex(e=>e.id===id);if(i<0||!POS.length)return;
  const tr=$('#track'),p=POS[i],e=L[i],r=eraOf(e);
  if(!curEls)cacheCurEls();
  if(curEls)[curEls.line,curEls.dot,curEls.lab].forEach(el=>{if(el)el.setAttribute('data-era',r.k);});
  if(!S.playing)setBall(p);
  $$('.dot-e',tr).forEach(d=>d.classList.toggle('now',+d.dataset.i===i));
  const pcEl=$('#playCount');if(pcEl)swapText(pcEl,(i+1)+' / '+L.length);
  const lab=curEls&&curEls.lab;if(lab)lab.textContent=yr(e);
  $('.era-current',tr).textContent=r.short;$('.era-current',tr).setAttribute('data-era',r.k);$('.ribbon-count',tr).textContent=(i+1)+' / '+L.length;
  tr.setAttribute('aria-valuenow',String(i+1));tr.setAttribute('aria-valuetext',e.d+' '+e.t);
}
function bindTrack(){
  const tr=$('#track');let drag=false,px=null,raf=0;
  const pick=()=>{raf=0;if(px==null)return;const rc=tr.getBoundingClientRect(),t=(px-rc.left)/rc.width,L=LIST;
    const vis=filtered()&&VIS.length?new Set(VIS.map(e=>e.id)):null;let bi=-1,bd=9;
    POS.forEach((p,i)=>{if(vis&&!vis.has(L[i].id))return;const d=Math.abs(p-t);if(d<bd){bd=d;bi=i;}});
    if(bi>=0&&L[bi].id!==curId())select(L[bi].id,{from:'ribbon'});};
  const queue=x=>{px=x;if(!raf)raf=requestAnimationFrame(pick);};
  tr.addEventListener('pointerdown',ev=>{if(ev.button>0)return;drag=true;try{tr.setPointerCapture(ev.pointerId);}catch(_){}queue(ev.clientX);});
  tr.addEventListener('pointermove',ev=>{if(drag)queue(ev.clientX);});
  const end=()=>{drag=false;};
  tr.addEventListener('pointerup',end);tr.addEventListener('pointercancel',end);tr.addEventListener('lostpointercapture',end);
  tr.addEventListener('keydown',ev=>{const L=navList();
    if(ev.key==='Home'){ev.preventDefault();select(L[0].id);}
    else if(ev.key==='End'){ev.preventDefault();select(L[L.length-1].id);}
    else if(ev.key==='ArrowUp'){ev.preventDefault();step(1);}
    else if(ev.key==='ArrowDown'){ev.preventDefault();step(-1);}});
}

function setSwap(id,name){const w=document.getElementById(id);if(!w)return;$$('.ic',w).forEach(ic=>ic.classList.toggle('on',ic.dataset.icon===name));}
function starBurst(starEl){
  if(reducedMotion())return;
  $$('.star-burst-particle',starEl).forEach(p=>p.remove());
  const N=8;
  for(let i=0;i<N;i++){
    const p=document.createElement('span');p.className='star-burst-particle';
    p.innerHTML='<svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7-6.2-3.7-6.2 3.7 1.6-7L2 9.2l7.1-.6z"/></svg>';
    const angle=(i/N)*Math.PI*2+Math.random()*0.6,dist=26+Math.random()*18;
    const dx=Math.cos(angle)*dist,dy=Math.sin(angle)*dist;
    p.style.transitionDuration='500ms';p.style.transitionTimingFunction='cubic-bezier(0.22, 1, 0.36, 1)';
    starEl.appendChild(p);
    requestAnimationFrame(()=>{p.style.transform='translate('+dx.toFixed(1)+'px, '+dy.toFixed(1)+'px) scale('+(0.6+Math.random()*0.6).toFixed(2)+') rotate('+((Math.random()*120-60)|0)+'deg)';p.style.opacity='0';});
    p.addEventListener('transitionend',()=>p.remove(),{once:true});
    setTimeout(()=>{if(p.parentNode)p.remove();},700);
  }
}

function swapText(el,txt){
  if(!el)return;
  if(!el.textContent||el.textContent===txt){el.textContent=txt;return;}
  if(reducedMotion()||!el.animate||el._swp){el.textContent=txt;return;}
  el._swp=true;
  const out=el.animate([{opacity:1,filter:'blur(0px)',transform:'translateY(0)'},{opacity:0,filter:'blur(2px)',transform:'translateY(-4px)'}],{duration:120,easing:'cubic-bezier(0.22, 1, 0.36, 1)',fill:'forwards'});

/* 播放：小球匀速连续滑动。位置按导航序号线性推进（每个节点一份相同时长，1× = 6 秒，
   与真实年份间隔无关），逐帧用 requestAnimationFrame 只更新 transform：
   小球 translateX、进度条 scaleX，均已 will-change 提升到合成层，不写 left/width、不触发重排；
   不用 CSS 过渡、不用缓动、不分段跳跃；球到达某节点时才激活该节点。
   速度只改变每份时长的长短，逐帧按当前 dwell() 推进，调速时位置保持连续。 */
const BASE_DWELL=6000,SPEEDS=[0.5,1,2,3];
let playRaf=0,playLast=0,playPos=-1,playIdxs=[];
function dwell(){return BASE_DWELL/S.speed;}
function paintPlayPos(p){setBall(p);}
/* Wobble 弹簧跟随：小球改弹簧追目标（stiffness 170 / damping 19，带一点 overshoot 再落稳），
   替代原匀速线性。只做标量弹簧（轨道进度 p），onUpdate 里写 transform，不碰 scrollTop。
   播放时逐帧 updateConfig 改 toValue 连续跟随；切节点时同一弹簧直接改目标，不重建、不跳变。 */
let ballSpring=null,ballPrimed=false;
function setBall(p){
  if(!ballPrimed){
    ballPrimed=true;paintBall(p);
    if(ballSpring)ballSpring.updateConfig({fromValue:p,toValue:p});
    return;
  }
  if(!ballSpring||reducedMotion()){paintBall(p);return;}
  const tr=$('#track');if(tr)tr.classList.add('springy');
  ballSpring.updateConfig({toValue:p});
  ballSpring.start();
}
function initBallSpring(){
  if(!window.Wobble||!Wobble.Spring||reducedMotion())return;
  try{
    ballSpring=new Wobble.Spring({fromValue:0,toValue:0,stiffness:170,damping:19,mass:1,restDisplacementThreshold:0.0004,restVelocityThreshold:0.0004});
    ballSpring.onUpdate(s=>{paintBall(s.currentValue);});
    ballSpring.onStop(()=>{const tr=$('#track');if(tr)tr.classList.remove('springy');});
  }catch(_){ballSpring=null;}
}
function playFrame(ts){
  playRaf=0;if(!S.playing)return;
  if(!playLast)playLast=ts;
  const dt=Math.min(250,ts-playLast);playLast=ts;
  const L=navList(),N=L.length;
  if(!N||!POS.length){setPlay(false);return;}
  const full=LIST;
  playIdxs=L.map(e=>full.indexOf(e));
  playPos+=dt/dwell();
  if(playPos>=N-1){
    playPos=N-1;paintPlayPos(POS[playIdxs[N-1]]);
    if(curId()!==L[N-1].id)select(L[N-1].id,{auto:true});
    setPlay(false);return;
  }
  const k=Math.floor(playPos);
  if(L[k]&&curId()!==L[k].id)select(L[k].id,{auto:true});
  const a=POS[playIdxs[k]],b=POS[playIdxs[k+1]];
  paintPlayPos(a+(b-a)*(playPos-k));
  if(S.playing)playRaf=requestAnimationFrame(playFrame);
}
function startPlay(){
  const L=navList();if(!L.length||!POS.length)return;
  const full=LIST;
  playIdxs=L.map(e=>full.indexOf(e));
  let k=L.findIndex(e=>e.id===curId());if(k<0)k=0;
  /* 暂停后继续：若球还停在当前节点的这一段里，从原位置接着滑，不跳回节点 */
  if(playPos<k||playPos>=k+1)playPos=k;
  playLast=0;
  paintPlayPos(playPos>=L.length-1?POS[playIdxs[L.length-1]]:POS[playIdxs[k]]+(POS[playIdxs[Math.min(k+1,L.length-1)]]-POS[playIdxs[k]])*(playPos-k));
  playRaf=requestAnimationFrame(playFrame);

  dragDist = Math.max(dragDist, Math.abs(e.clientX - dragStartX));
  t = clamp01(dragStartT + dx / TRAVEL);
  samples.push({ time: performance.now(), t: t });
  if (samples.length > 12) samples.shift();
  requestRender();
});
function endDrag(e){
  if (!dragging || !e || e.pointerId !== activePointerId) return;
  dragging = false;
  activePointerId = null;
  var v = 0;
  if (samples.length >= 2){
    var nowMs = performance.now();
    var last = samples[samples.length - 1];
    /* 只认新鲜样本（110ms 窗口）；按住不动再松手速度为零。 */
    if (nowMs - last.time <= 80){
      var first = null;
      for (var i2 = 0; i2 < samples.length; i2++){
        if (nowMs - samples[i2].time <= 110) { first = samples[i2]; break; }
      }
      if (first && last.time > first.time){
        var dt = (last.time - first.time) / 1000;
        if (dt > 0.01) v = (last.t - first.t) / dt;
      }
    }
  }
  samples = [];
  if (dragDist < 4){
    suppressClick = true;
    toggle();
  } else {
    commit(t + v * 0.06 >= 0.5);
  }
  requestRender();
}
function cancelDrag(e){
  /* pointercancel / lostpointercapture：清理后弹回已确认状态的端点
     （画面与 aria-checked 重新一致）。静默——不改主题、不发新的 change 事件。 */
  if (activePointerId === null) return;
  if (e && e.pointerId !== activePointerId) return;
  dragging = false;
  activePointerId = null;
  samples = [];
  dragDist = 0;
  vel = 0;
  commit(checked, true);
  requestRender();
}
sw.addEventListener('pointerup', endDrag);
sw.addEventListener('pointercancel', cancelDrag);
sw.addEventListener('lostpointercapture', cancelDrag);
sw.addEventListener('click', function(e){
  if (suppressClick){ suppressClick = false; return; }
  if (e.detail === 0 && !dragging) toggle();
});
sw.addEventListener('keydown', function(e){
  if (e.key === 'ArrowRight'){ e.preventDefault(); if (!checked || target !== 1) commit(true); }
  else if (e.key === 'ArrowLeft'){ e.preventDefault(); if (checked || target !== 0) commit(false); }
});
draw(performance.now());
requestRender();
})();
if(window.matchMedia){const mqT=window.matchMedia('(prefers-color-scheme: dark)');if(mqT.addEventListener)mqT.addEventListener('change',e=>{if(!S.theme)applyTheme(e.matches?'dark':'light');});}
$('#ribbonBtn').addEventListener('click',()=>{S.ribbonHide=!S.ribbonHide;save();updateRibbonBtn();if(!S.ribbonHide)requestAnimationFrame(()=>{layoutRibbon();updateCursor();});});

/* 覆盖层内的交互与正文一致：上/下一页走 select（自动同步两处），章节标签先退出沉浸再筛选，

$('#immDetail').addEventListener('click',ev=>{

document.addEventListener('keydown',ev=>{
  if(ev.key==='Tab'&&isNarrow()&&sideOpen()){
    const focusable=$$('button:not(:disabled),input,select,[tabindex="0"]',$('#side')).filter(e=>e.getClientRects().length),first=focusable[0],last=focusable[focusable.length-1];
    if(ev.shiftKey&&document.activeElement===first){ev.preventDefault();last.focus();}
    else if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first.focus();}
  }
  const t=ev.target,typing=/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)||t.isContentEditable;
  if(ev.key==='Escape'){
    if(immersiveOn){exitImmersive();ev.preventDefault();return;}
    if(sideOpen()){closeSide();ev.preventDefault();return;}
    if(t.id==='q'){if(S.q)setQ('');else t.blur();ev.preventDefault();}
    return;
  }
  if(typing||ev.metaKey||ev.ctrlKey||ev.altKey)return;
  if(ev.key==='/'){ev.preventDefault();if(isNarrow())openSide();$('#q').focus();}
  else if(ev.key==='ArrowLeft'){ev.preventDefault();step(-1);}
  else if(ev.key==='ArrowRight'){ev.preventDefault();step(1);}
});

/* ripplet.js (luncheon/ripplet.js) inline declarative port: pointerdown on [data-ripplet],
   ripple spreads from the touch point (350ms, ease-soft), clears on pointerup/leave (600ms fade).
   The ripple lives in its own overflow:hidden wrap so host overflow stays visible (star particles). */
document.addEventListener('pointerdown',ev=>{
  if(reducedMotion())return;
  const host=ev.target&&ev.target.closest?ev.target.closest('[data-ripplet]'):null;
  if(!host||host.disabled)return;
  let wrap=$('.ripplet-wrap',host);
  if(!wrap){wrap=document.createElement('span');wrap.className='ripplet-wrap';wrap.setAttribute('aria-hidden','true');host.appendChild(wrap);}
  $$('.ripplet-ripple',wrap).forEach(r=>r.remove());
  const rc=host.getBoundingClientRect(),d=Math.max(rc.width,rc.height)*2.2;
  const r=document.createElement('span');r.className='ripplet-ripple';
  r.style.width=r.style.height=d+'px';
  r.style.left=(ev.clientX-rc.left-d/2)+'px';r.style.top=(ev.clientY-rc.top-d/2)+'px';
  wrap.appendChild(r);
  r.animate([{transform:'scale(0)',opacity:.16},{transform:'scale(1)',opacity:.16}],{duration:350,easing:'cubic-bezier(0.22, 1, 0.36, 1)',fill:'forwards'});
  let cleared=false;
  const clear=()=>{if(cleared)return;cleared=true;const f=r.animate([{opacity:.16},{opacity:0}],{duration:600,easing:'cubic-bezier(0.22, 1, 0.36, 1)',fill:'forwards'});f.onfinish=()=>r.remove();};
  host.addEventListener('pointerup',clear,{once:true});
  host.addEventListener('pointerleave',clear,{once:true});
  setTimeout(clear,1200);
},{passive:true});
document.addEventListener('touchstart',function(){},{passive:true});

/* Lenis 桌面滚轮惯性：只接细指针（桌面端）+ 非 reduced-motion，触屏（iPad）原生动量不接。
   本页窗口不滚动，滚动都在 .detail / .list 容器内，故每个容器一个 wrapper 模式实例；
   用 autoRaf 自驱动，不与播放 rAF 叠加；不叠加 CSS scroll-behavior:smooth（本页也没有）。
   内容高度变化后由 renderList / renderDetail 调 resize() 同步 limit。 */
let lenisList=null,lenisDetail=null;
function initLenis(){
  if(!window.Lenis||reducedMotion())return;
  if(!window.matchMedia||!window.matchMedia('(pointer: fine)').matches)return;
  try{
    lenisDetail=new Lenis({wrapper:$('#detail'),content:$('#detail'),autoRaf:true,lerp:0.11,syncTouch:false});
    lenisList=new Lenis({wrapper:$('#list'),content:$('#list'),autoRaf:true,lerp:0.11,syncTouch:false});
  }catch(_){lenisDetail=null;lenisList=null;}
}

fromHash();
updateThemeBtn();updateRibbonBtn();updateSpeedUI();setPlay(false);syncInert();initBallSpring();renderAll();bindTrack();initLenis();
})();
</script>
<script>
/* 液态玻璃驱动（复刻 liquid-glass-react 的运行时行为，仅 Chromium 启用）：
   - 门控：Chromium 内核（桌面/安卓 Chrome、Edge、Opera 等）才加 .lg-on；Safari、iOS 全部浏览器
     （WebKit 不呈现 SVG 滤镜折射）与 Firefox 不加类，胶囊保持 4 号超透薄玻璃；
     prefers-reduced-transparency 时同样不启用。
   - 尺寸：原库按组件实测尺寸设置滤镜 SVG 的宽高（glassSize），这里用 ResizeObserver 同步两颗胶囊。
   - 弹性：原库 elasticity=0.15 的鼠标跟随（200px 激活区、边缘距离淡入、方向拉伸 + 弹性平移）
     改走独立的 translate / scale 属性，不碰两颗胶囊既有的 transform 动画（收起 / 沉浸）；
     平移量按原库公式计算后钳制在 ±6px（胶囊比原库示例宽得多，全量平移会露边）；
     触屏与 prefers-reduced-motion 不启用。 */
(function(){
  var ua=navigator.userAgent||"";
  var isIOS=/iP(hone|ad|od)/.test(ua)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  var isFirefox=/Firefox\//.test(ua);
  var isChromium=/Chrome\/|Chromium\/|Edg\/|OPR\/|SamsungBrowser\//.test(ua);
  if(!isChromium||isFirefox||isIOS)return;
  if(window.matchMedia&&matchMedia("(prefers-reduced-transparency: reduce)").matches)return;
  var top=document.querySelector(".top"),ribbon=document.querySelector(".ribbon");
  if(!top||!ribbon)return;
  document.documentElement.classList.add("lg-on");

  function syncSize(el){
    var svg=el.querySelector(".lg-svg");
    if(!svg)return;
    var w=Math.round(el.clientWidth),h=Math.round(el.clientHeight);
    if(w>0&&h>0){svg.setAttribute("width",w);svg.setAttribute("height",h);}
  }
  syncSize(top);syncSize(ribbon);
  if(window.ResizeObserver){
    var ro=new ResizeObserver(function(entries){
      for(var i=0;i<entries.length;i++)syncSize(entries[i].target);
    });
    ro.observe(top);ro.observe(ribbon);
  }else{
    window.addEventListener("resize",function(){syncSize(top);syncSize(ribbon);},{passive:true});
  }

  var finePointer=window.matchMedia&&matchMedia("(hover: hover) and (pointer: fine)").matches;
  var reducedMotion=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(!finePointer||reducedMotion)return;
  var ELASTICITY=0.15,ACTIVATION=200;
  var mouse=null;
  window.addEventListener("pointermove",function(e){
    if(e.pointerType&&e.pointerType!=="mouse")return;
    mouse={x:e.clientX,y:e.clientY};
    kick();
  },{passive:true});
  document.addEventListener("mouseleave",function(){mouse=null;kick();});
  var states=[];
  function attach(el){
    var st={el:el,x:0,y:0,sx:1,sy:1,gx:0,gy:0,gsx:1,gsy:1,raf:0};
    states.push(st);
    return st;
  }
  var sTop=attach(top),sRibbon=attach(ribbon);
  function kick(){for(var i=0;i<states.length;i++)wake(states[i]);}
  function wake(st){if(!st.raf)st.raf=requestAnimationFrame(function(){step(st);});}
  function clampT(v){return Math.max(-6,Math.min(6,v));}
  function targets(st){
    if(!mouse){st.gx=0;st.gy=0;st.gsx=1;st.gsy=1;return;}
    var el=st.el,w=el.offsetWidth,h=el.offsetHeight;
    if(!w||!h){st.gx=0;st.gy=0;st.gsx=1;st.gsy=1;return;}
    var cx=el.offsetLeft+w/2,cy=el.offsetTop+h/2;
    var dx=mouse.x-cx,dy=mouse.y-cy;
    var ex=Math.max(0,Math.abs(dx)-w/2),ey=Math.max(0,Math.abs(dy)-h/2);
    var edge=Math.sqrt(ex*ex+ey*ey);
    if(edge>ACTIVATION){st.gx=0;st.gy=0;st.gsx=1;st.gsy=1;return;}
    var fade=1-edge/ACTIVATION;
    var cd=Math.sqrt(dx*dx+dy*dy);
    if(cd===0){st.gx=0;st.gy=0;st.gsx=1;st.gsy=1;return;}
    var nx=dx/cd,ny=dy/cd;
    var stretch=Math.min(cd/300,1)*ELASTICITY*fade;
    st.gsx=Math.max(0.8,1+Math.abs(nx)*stretch*0.3-Math.abs(ny)*stretch*0.15);
    st.gsy=Math.max(0.8,1+Math.abs(ny)*stretch*0.3-Math.abs(nx)*stretch*0.15);
    st.gx=clampT(dx*ELASTICITY*0.1*fade);
    st.gy=clampT(dy*ELASTICITY*0.1*fade);
  }
  function step(st){
    st.raf=0;
    targets(st);
    st.x+=(st.gx-st.x)*0.2;st.y+=(st.gy-st.y)*0.2;
    st.sx+=(st.gsx-st.sx)*0.2;st.sy+=(st.gsy-st.sy)*0.2;
    var settled=Math.abs(st.gx-st.x)<0.02&&Math.abs(st.gy-st.y)<0.02&&Math.abs(st.gsx-st.sx)<0.0005&&Math.abs(st.gsy-st.sy)<0.0005;
    if(settled){st.x=st.gx;st.y=st.gy;st.sx=st.gsx;st.sy=st.gsy;}
    if(st.x===0&&st.y===0&&st.sx===1&&st.sy===1){
      if(st.el.style.translate||st.el.style.scale){st.el.style.translate="";st.el.style.scale="";}
    }else{
      st.el.style.translate=st.x.toFixed(2)+"px "+st.y.toFixed(2)+"px";
      st.el.style.scale=st.sx.toFixed(4)+" "+st.sy.toFixed(4);
    }
    if(!settled)wake(st);
  }
})();
</script>
