<script type="application/json" id="sz-data">{"courses":{"sg":{"name":"史纲","full":"中国近现代史纲要","set":"cn","prefix":"史纲"}},"chapters":{"史纲":{"第一章":"进入近代后中华民族的磨难与抗争","第二章":"不同社会力量对国家出路的早期探索","第三章":"辛亥革命与君主专制制度的终结","第四章":"中国共产党成立和中国革命新局面","第五章":"中国革命的新道路","第六章":"中华民族的抗日战争","第七章":"为建立新中国而奋斗","第八章":"中华人民共和国的成立与中国社会主义建设道路的探索","第九章":"改革开放与中国特色社会主义的开创和发展","第十章":"中国特色社会主义进入新时代"}},"eras":{"cn":[{"k":"cn1","name":"旧民主主义革命时期","short":"旧民主主义革命","range":"1840—1919","from":1830,"to":1919.33},{"k":"cn2","name":"新民主主义革命时期","short":"新民主主义革命","range":"1919—1949","from":1919.33,"to":1949.74,"tick":1919},{"k":"cn3","name":"社会主义革命和建设时期","short":"社会主义革命和建设","range":"1949—1978","from":1949.74,"to":1978.9,"tick":1949},{"k":"cn4","name":"改革开放和社会主义现代化建设新时期","short":"改革开放新时期","range":"1978—2012","from":1978.9,"to":2012.8,"tick":1978},{"k":"cn5","name":"中国特色社会主义新时代","short":"新时代","range":"2012—","from":2012.8,"to":2100,"tick":2012}]},"events":[{"y":1840.49,"d":"1840年6月28日","t":"鸦片战争爆发","ch":["史纲·第一章"],"p":"广东沿海","s":"中国近代史的开端","b":"英国对华贸易长期处于逆差，便向中国大量走私鸦片。1839年林则徐虎门销烟，英国以此为借口，于1840年6月发动侵略战争。","k":["中国开始从一个独立的封建国家**逐步沦为半殖民地半封建国家**","近代中国两对主要矛盾：**帝国主义和中华民族的矛盾、封建主义和人民大众的矛盾，前者是最主要的矛盾**","两大历史任务：**求得民族独立和人民解放；实现国家富强和人民幸福**——前者为后者扫清障碍、创造前提","半殖民地（主权原因）：不平等条约破坏了中国的**领土主权、领海主权、关税主权、司法主权**等，中国丧失了完全独立的地位，但仍维持独立国家和政府的名义","半封建（经济原因）：中国出现了资本主义生产关系，但民族资本主义经济不可能成为社会经济的主要形式，**外国资本及依附于它的官僚资本居于支配地位**","**近代中国诞生的新兴被压迫阶级是工人阶级，它先于中国的资产阶级而产生，是中国沦为两半社会过程最早出现的新社会阶级**","**林则徐是近代中国睁眼看世界的第一人**","**1840年鸦片战争至1949年**中华人民共和国成立前为中国近代史，1949年以后为中国现代史。","英国的鸦片走私造成中国白银大量外流和财政危机，还导致**银贵钱贱**，加重了劳动人民的负担，并且直接毒害了中国人的身体和精神。","1841年5月，广州三元里人民自发集结数万人抗击英军，是中国近代史上中国人民**第一次大规模的反侵略武装斗争**。","魏源编成《海国图志》，提出“**师夷长技以制夷**”。","工人阶级身受帝国主义、封建势力、资产阶级三重压迫，受剥削最深，革命性最强，是近代中国**最革命的阶级**。","农民是近代中国社会人数最多的被剥削阶级，具有强烈的革命要求，是**中国民主革命的主力军**；但农民作为小生产者有经济、政治、思想、组织、时代等方面的局限性，难以独立完成近代中国的人民解放历史任务。","中国民族资本主义从19世纪70年代开始发展；民族资产阶级在政治上表现出**两面性**，与外国资本主义和本国封建主义既有矛盾、斗争的一面，又有依赖、妥协的一面，没有革命的彻底性，不可能引导中国的民主革命走向胜利。","买办资产阶级是勾结帝国主义并为帝国主义侵略政策服务的大资产阶级，与地主阶级势力勾结并掌握政权后就发展成为**官僚资产阶级**；官僚资产阶级勾结帝国主义和地主阶级势力，掌握国家政权，垄断全国经济命脉。","列强在经济上控制中国的主要方式包括夺取中国关税自主权，实行商品倾销和资本输出，操纵中国经济命脉。"],"q":["易混：**1840年是“开始沦为”，1901年《辛丑条约》才是“完全沦为”**半殖民地半封建社会","易混：当资本—帝国主义向中国发动侵略战争时，**民族矛盾特别尖锐，阶级矛盾暂时降到次要和服从的地位**（如鸦片战争、第二次鸦片战争、中法战争、中日甲午战争、义和团反帝运动）；当封建主义统治特别残酷时，阶级矛盾上升为主要矛盾，民族矛盾退居次要地位（如太平天国农民战争和辛亥革命）。"],"m":"一个开端，两对矛盾，两大任务","c":["sg"],"id":"1840a"},{"y":1842.66,"d":"1842年8月29日","t":"《南京条约》签订","ch":["史纲·第一章"],"p":"南京","s":"中国近代第一个不平等条约","b":"清军战败，清政府被迫在南京江面的英国军舰上签约；1843年又订立《五口通商章程》和《虎门条约》作为补充。","k":["主要内容：**割香港岛；赔款2100万银元；开放广州、厦门、福州、宁波、上海五口通商；协定关税**","补充条约使英国攫取了**领事裁判权、片面最惠国待遇**等特权","1844年7月、10月，英国等西方列强先后通过**中美《望厦条约》、中法《黄埔条约》**等一系列不平等条约，在中国攫取了大量侵略特权。"],"q":["易混：领事裁判权、片面最惠国待遇出自1843年的补充条约，不在《南京条约》本身","易混：**香港岛（1842年割让）→ 九龙司地方一区（1860年割让）→ 新界（1898年租借）**"],"m":"割岛、赔款、五口、协定关税","c":["sg"],"id":"1842a"},{"y":1851.03,"d":"1851年1月11日","t":"金田起义","ch":["史纲·第二章"],"p":"广西桂平金田村","s":"太平天国运动爆发","b":"洪秀全以拜上帝会为组织形式，在广西桂平金田村发动起义，建号太平天国。","k":["太平天国运动是**中国旧式农民战争的最高峰**","先后提出**《天朝田亩制度》和《资政新篇》两个纲领性文件**"],"q":["考法：“旧式农民战争的最高峰”指太平天国；**农民阶级不可能提出科学的革命纲领**"],"m":"金田一声起，农民战争到顶峰","c":["sg"],"id":"1851a"},{"y":1853.21,"d":"1853年3月19日","t":"定都天京·《天朝田亩制度》","ch":["史纲·第二章"],"p":"天京（南京）","s":"建立与清王朝对峙的农民政权","b":"太平军攻克南京，定为首都，改称天京；同年颁布《天朝田亩制度》。1859年洪仁玕又提出《资政新篇》。","k":["《天朝田亩制度》**以解决土地问题为中心**，反映了农民废除封建土地所有制的强烈愿望","它带有**绝对平均主义色彩，具有空想性**，在当时无法实现","《资政新篇》是**中国近代第一个比较系统的发展资本主义的方案**，但缺乏实施条件","《天朝田亩制度》**否定了封建土地所有制**，是对以往农民战争中“均贫富”“等贵贱”和“均平”“均田”思想的发展和超越，具有进步意义。"],"q":["易混：《天朝田亩制度》= 平均分配土地（空想）；《资政新篇》= 学习西方、发展资本主义（未能实施）","易混：**《资政新篇》既学技术、又学制度；魏源《海国图志》“师夷长技以制夷”只学技术、不学制度**"],"m":"","c":["sg"],"id":"1853a"},{"y":1856.81,"d":"1856年10月23日","t":"第二次鸦片战争","ch":["史纲·第一章"],"p":"广州","s":"英法联合扩大侵华","b":"英国借口“亚罗号事件”，法国借口“马神甫事件”，联合发动侵华战争，1857年底攻占广州，1858年北上攻陷大沽炮台。","k":["1858年清政府被迫签订《天津条约》：外国公使进驻北京，增开通商口岸，外国人可到内地游历、经商、传教","沙俄趁火打劫，1858年迫签《瑷珲条约》，**割占黑龙江以北、外兴安岭以南60多万平方公里领土**"],"q":["易混：沙俄割地三步——**《瑷珲条约》（1858，黑龙江以北）→《北京条约》（1860，乌苏里江以东）→《勘分西北界约记》（1864，西北）**"],"m":"","c":["sg"],"id":"1856a"},{"y":1860.8,"d":"1860年10月18日","t":"火烧圆明园·《北京条约》","ch":["史纲·第一章"],"p":"北京","s":"第二次鸦片战争结束","b":"英法联军攻入北京，劫掠并焚毁圆明园；清政府分别与英、法、俄签订《北京条约》。","k":["割九龙司地方一区给英国，增开天津为商埠，允许招募华工出国","沙俄以“调停有功”为名，**割占乌苏里江以东约40万平方公里领土**","此后清政府与外国侵略者逐步勾结，“借师助剿”镇压太平天国"],"q":["考法：第二次鸦片战争的主要条约 =《天津条约》（1858）+《北京条约》（1860）"],"m":"","c":["sg"],"id":"1860a"},{"y":1861.05,"d":"1861年1月20日—1894年","t":"洋务运动兴起","ch":["史纲·第二章"],"p":"北京·上海·安庆等地","s":"地主阶级洋务派“自强”“求富”的探索","b":"1861年清政府设立总理各国事务衙门。奕䜣、曾国藩、李鸿章、左宗棠、张之洞等以“中学为体，西学为用”为指导思想，学习西方技术。","k":["**前期以“自强”为旗号兴办军用工业（如江南制造总局），后期以“求富”为旗号兴办民用企业（如轮船招商局）**","创办新式学堂、派遣留学生，筹建北洋、南洋、福建水师","失败原因：**具有封建性，对外国有依赖性，管理具有腐朽性**；1894年甲午战败标志其失败","洋务派民用企业多数采取**官督商办**方式，基本上是资本主义性质的近代企业","洋务派兴办洋务事业，首先是为了购买和制造洋枪洋炮**镇压农民起义**，同时也想借此加强海防、边防，并乘机发展本集团的政治、经济、军事实力。","洋务运动主要是为了维护封建统治，并不是要使中国朝着独立的资本主义方向发展。","洋务派指导思想最先由冯桂芬在《校邠庐抗议》中完整表述：“以中国之伦常名教为原本，辅以诸国富强之术”，后由张之洞在《劝学篇》中概括为“中学为体，西学为用”。","最早创办的军用企业是**1861年安庆军械所**；1865年上海江南制造总局是当时国内最大的兵工厂，1866年福州船政局是当时国内最大的造船厂。"],"q":["易混：洋务运动**客观上促进了中国早期工业化和民族资本主义的产生，但没有使中国走上富强道路**"],"m":"中体西用，先自强后求富","c":["sg"],"id":"1861a"},{"y":1864.55,"d":"1864年7月19日","t":"天京陷落","ch":["史纲·第二章"],"p":"天京（南京）","s":"太平天国运动失败","b":"1856年天京变乱后，太平天国由盛转衰；1864年7月湘军攻破天京。","k":["**失败的根本原因是农民阶级的局限性**：没有先进阶级领导，不能提出科学的革命纲领","证明**单纯的农民战争不能完成反帝反封建的历史任务**","1864年6月洪秀全病故，7月天京被湘军攻破，太平天国起义失败。","太平天国农民起义失败的客观原因是**中外反动势力的联合绞杀**。"],"q":["易混：**天京变乱（1856）是由盛转衰的转折点；天京陷落（1864）标志运动失败**"],"m":"","c":["sg"],"id":"1864a"},{"y":1883.95,"d":"1883年12月14日—1885年","t":"中法战争","ch":["史纲·第一章"],"p":"越南北部·镇南关","s":"“不败而败”的战争","b":"法国侵略越南并以越南为跳板进犯中国，1883年12月进攻驻越清军，战争爆发；1884年马尾海战中福建水师几乎全军覆没。","k":["1885年3月冯子材率军取得镇南关大捷","清政府“乘胜即收”，与法国签订《中法新约》，法国势力深入中国西南"],"q":["考法：近代反侵略战争失败的**根本原因是社会制度的腐败，重要原因是经济技术的落后**"],"m":"","c":["sg"],"id":"1883b"},{"y":1894.56,"d":"1894年7月25日","t":"甲午中日战争","ch":["史纲·第一章"],"p":"黄海·辽东·威海卫","s":"洋务运动失败，民族危机空前严重","b":"日本借朝鲜问题挑起战争：1894年7月25日日军在丰岛海面袭击中国运兵船；9月黄海海战中邓世昌等壮烈殉国；1895年2月北洋舰队在威海卫全军覆没。","k":["**标志着洋务运动的失败**","**民族危机空前加深，促进了中华民族的觉醒**","帝国主义列强未能灭亡和瓜分中国的原因：列强之间的矛盾和互相制约是重要原因，**最根本的原因是中华民族不屈不挠的反侵略斗争**，中国长期是一个统一的大国也是原因之一","帝国主义侵略中国的最终目的，是要**瓜分中国、灭亡中国**。"],"q":["易混：**丰岛海战是开端；黄海海战是规模最大的海战；威海卫之战北洋舰队全军覆没**"],"m":"","c":["sg"],"id":"1894a"},{"y":1894.9,"d":"1894年11月24日","t":"兴中会成立","ch":["史纲·第三章"],"p":"美国檀香山","s":"第一个资产阶级革命团体","b":"孙中山在檀香山创立兴中会，誓词为“驱除鞑虏，恢复中华，创立合众政府”。","k":["**中国第一个资产阶级革命团体**","誓词提出推翻清王朝、建立共和政府的主张","孙中山在《兴中会章程》中**喊出“振兴中华”这个时代的最强音**","1895年孙中山策划在广州举行武装起义，失败后流亡海外，继续从事反清革命活动。"],"q":["易混：**兴中会（1894）是第一个资产阶级革命团体；同盟会（1905）是第一个全国性的资产阶级革命政党**"],"m":"","c":["sg"],"id":"1894b"},{"y":1895.29,"d":"1895年4月17日","t":"《马关条约》签订","ch":["史纲·第一章"],"p":"日本马关（下关）","s":"中国半殖民地化程度大大加深","b":"清政府派李鸿章赴日本马关议和，签订《马关条约》。","k":["**割让辽东半岛、台湾全岛及所有附属各岛屿、澎湖列岛给日本**","**赔偿日本军费白银2亿两；增开沙市、重庆、苏州、杭州为商埠**","**允许日本在中国通商口岸开设工厂**，适应了列强资本输出的需要","《马关条约》使**列强对华经济侵略由商品输出转向资本输出**，掀起瓜分中国的狂潮，中国人民的民族意识开始普遍觉醒","1895年严复写了《救亡决论》一文，响亮地喊出了“救亡”的口号；1898年翻译出版**《天演论》**，用“物竞天择”“适者生存”的社会进化论思想为危机意识和民族意识提供了理论根据。"],"q":["易混：俄、德、法“三国干涉还辽”后，清政府以3000万两白银“赎回”辽东半岛","考法：**台湾被日本割占始于1895年，1945年抗战胜利后回归中国**"],"m":"割辽台澎，赔两亿，开四口，准设厂","c":["sg"],"id":"1895a"},{"y":1898.44,"d":"1898年6月11日","t":"戊戌维新","ch":["史纲·第二章"],"p":"北京","s":"资产阶级维新派的政治改良尝试","b":"1895年康有为等发动“公车上书”，维新运动兴起。1898年6月11日光绪帝颁布“明定国是”诏书，变法开始；9月21日慈禧太后发动政变，变法失败，历时103天。","k":["是一次**爱国救亡运动，一场资产阶级性质的政治改良运动，也是一场思想启蒙运动**","失败原因：**维新派不敢否定封建主义，对帝国主义抱有幻想，脱离并惧怕人民群众**；守旧势力强大","教训：在半殖民地半封建的中国，**自上而下的改良道路走不通**","戊戌维新是中国**民族资产阶级登上政治舞台的第一次表演**","维新派以康有为、梁启超、谭嗣同、严复等为主要代表人物。","维新派在思想上打着孔子的旗号，借古代圣贤之名“**托古改制**”。","维新派与洋务派分歧的实质是**要不要学习西方的政治制度与思想文化**。"],"q":["易混：维新派与守旧派论战三问——**要不要变法；要不要兴民权、设议院，实行君主立宪；要不要废八股、改科举、兴西学**","考法：维新派与守旧派的论战实质上是**资产阶级思想与封建主义思想在中国的第一次正面交锋**"],"m":"公车上书起，百日维新止","c":["sg"],"id":"1898a"},{"y":1900.46,"d":"1900年6月17日","t":"义和团运动·八国联军侵华","ch":["史纲·第一章"],"p":"京津地区","s":"粉碎了列强瓜分中国的图谋","b":"义和团以“扶清灭洋”为口号在山东、直隶兴起。1900年6月，英、法、德、俄、美、日、意、奥组成八国联军侵华，8月攻占北京。","k":["义和团运动**粉碎了列强瓜分中国的图谋**，显示了中国人民巨大的反侵略力量","局限：**带有笼统排外色彩和迷信落后的一面**"],"q":["考法：列强之间的矛盾和互相制约是列强未能瓜分中国的原因之一，但不是根本原因","考法：义和团蒙受封建统治者欺骗，是因为认识不到帝国主义联合中国封建地主阶级压迫中国人民的实质"],"m":"","c":["sg"],"id":"1900a"},{"y":1901.68,"d":"1901年9月7日","t":"《辛丑条约》签订","ch":["史纲·第一章"],"p":"北京","s":"中国完全沦为半殖民地半封建社会","b":"八国联军侵华战争后，清政府被迫与11国签订《辛丑条约》。","k":["**赔款白银4.5亿两，分39年还清，本息合计9.8亿余两**，以海关税、盐税等作担保","**划定北京东交民巷为使馆界，允许各国驻兵保护；拆毁大沽炮台，允许列强在北京至山海关铁路沿线驻兵**","清政府保证严禁人民参加反帝活动，**从此完全成为帝国主义统治中国的工具**","清末新政（1901年4月成立督办政务处）：设立商部、学部、巡警部，裁撤绿营，建立新军，颁布商法商律、奖励工商，鼓励留学、颁布新学制，**1906年起正式废除科举考试**","1906年清政府宣布“预备仿行宪政”，1908年颁布**《钦定宪法大纲》**，制定仿效日本实行君主立宪的方案，规定9年预备立宪期限。"],"q":["易混：裁撤绿营是清末新政的内容，不是洋务运动"],"m":"四亿五千万，三十九年还","c":["sg"],"id":"1901a"},{"y":1905.63,"d":"1905年8月20日","t":"中国同盟会成立","ch":["史纲·第三章"],"p":"日本东京","s":"第一个全国性的资产阶级革命政党","b":"孙中山和黄兴、宋教仁等人以兴中会和华兴会为基础，在日本东京成立中国同盟会，以《民报》为机关报，并确定了革命纲领。","k":["纲领：**“驱除鞑虏，恢复中华，创立民国，平均地权”**","孙中山在《民报》发刊词中将其概括为**民族、民权、民生三大主义（旧三民主义）**","1905—1907年革命派与改良派展开大论战，划清了革命与改良的界限","1903年章炳麟发表**《驳康有为论革命书》**，反对康有为的保皇观点，强调中国人民完全有能力建立民主共和制度；同年18岁的邹容写了《革命军》，号召人民推翻清朝统治，建立“中华共和国”。","“平均地权”在方法步骤上主张“**核定地价、照价征税、涨价归公、按价收买**”。"],"q":["易混：论战三问——**要不要以革命手段推翻清王朝；要不要推翻帝制、实行共和；要不要进行社会革命**","易混：三民主义的民族主义**没有从正面鲜明地提出反对帝国主义的主张**，革命派对帝国主义的本质认识不清，甚至幻想以承认不平等条约“继续有效”为条件来换取列强对自己的支持。","易混：民权主义归根到底是建立资产阶级专政的国家，忽略了广大劳动群众在国家中的地位，因而难以使人民的民主权利得到真正的保证。","易混：孙中山“平均地权”的主张**没有正面触及封建土地所有制**，不能满足广大农民的土地要求，在革命中难以成为发动广大工农群众的理论武器。"],"m":"十六字纲领，三民主义","c":["sg"],"id":"1905a"},{"y":1911.78,"d":"1911年10月10日","t":"武昌起义·辛亥革命","ch":["史纲·第三章"],"p":"湖北武昌","s":"推翻统治中国两千多年的君主专制制度","b":"保路运动推动革命形势高涨，湖北新军中的革命团体文学社、共进会发动武昌起义，各省纷纷响应。","k":["推翻了清王朝，**结束了统治中国两千多年的君主专制制度，建立了中华民国**","使**民主共和观念深入人心**，为中国的进步打开了闸门","但**没有改变中国半殖民地半封建的社会性质**","19世纪末20世纪初中国民族资本主义得到初步发展，民族资产阶级及与它相联系的社会力量明显发展，这是资产阶级革命派形成的阶级基础。","1911年4月27日广州起义（**黄花岗起义**），黄兴率敢死队120余人在广州举行起义，72位烈士的遗骸葬于黄花岗。","1911年5月清政府宣布“**铁路干线收归国有**”，与四国银行团订立粤汉、川汉铁路借款合同，借“国有”名义把铁路利权出卖给帝国主义，激起湖北、湖南、广东、四川四省保路风潮，其中四川最烈。","1911年10月10日晚，驻武昌的新军工程第八营革命党人打响起义第一枪，起义军血战通宵占领武昌，**3天之内光复武汉三镇**，成立湖北军政府；一个月内就有13个省以及上海和许多州县宣布起义，脱离清政府统治。","在武昌起义和各省政权更迭过程中，资产阶级革命派暴露出软弱性和妥协态度，一些地方的政权落到立宪派或旧官僚、旧军官手里。"],"q":["考法：辛亥革命是近代中国**比较完全意义上的资产阶级民主革命**","易混：辛亥革命推翻了清王朝，中国延续两千多年的封建帝制终于覆灭；但是**封建土地制度并没有覆灭**，封建主义的统治一直到新中国成立才结束。"],"m":"","c":["sg"],"id":"1911a"},{"y":1912.0,"d":"1912年1月1日","t":"中华民国成立","ch":["史纲·第三章"],"p":"南京","s":"资产阶级共和国性质的革命政权","b":"孙中山在南京就任临时大总统，南京临时政府成立。","k":["南京临时政府是**资产阶级共和国性质的革命政权**","**1912年2月12日清帝退位；随后孙中山辞职，袁世凯窃取了革命果实**","南京临时政府的局限性：《告友邦书》**试图用承认清政府与列强所订的一切不平等条约和所欠的一切外债换取列强承认中华民国**；没有提出满足农民土地要求的政策措施，反而以保护私有财产为借口维护封建土地制度以及官僚、地主占有的土地和财产"],"q":["易混：清帝退位标志清王朝统治结束；**袁世凯在北京就任临时大总统后，北洋军阀统治开始**"],"m":"","c":["sg"],"id":"1912a"},{"y":1912.19,"d":"1912年3月11日","t":"《中华民国临时约法》","ch":["史纲·第三章"],"p":"南京","s":"第一部具有资产阶级共和国宪法性质的法典","b":"南京临时政府公布《中华民国临时约法》。","k":["规定中华民国**主权属于国民全体，实行三权分立**","规定**国民一律平等**，享有人身、居住、言论、集会、结社、宗教信仰等自由","**改总统制为责任内阁制，意在限制袁世凯的权力**","《临时约法》以根本大法的形式废除了两千多年来的封建君主专制制度，确认了资产阶级共和国的政治制度"],"q":["考法：《临时约法》是**中国历史上第一部具有资产阶级共和国宪法性质的法典**"],"m":"","c":["sg"],"id":"1912b"},{"y":1913.53,"d":"1913年7月12日—1918年","t":"二次革命·护国运动·护法运动","ch":["史纲·第三章"],"p":"南方各省","s":"旧民主主义革命走向失败","b":"袁世凯建立北洋军阀统治。1913年宋教仁遇刺，孙中山发动“二次革命”失败；1915年袁世凯复辟帝制，蔡锷等发起护国战争；1917年孙中山发起护法运动。","k":["辛亥革命失败的根本原因：**在帝国主义时代的半殖民地半封建中国，资本主义的建国方案行不通**","主观原因：**没有提出彻底的反帝反封建纲领**，不能充分发动和依靠人民群众，不能建立坚强的革命政党","护法运动失败：1918年1月西南军阀与直系军阀勾结擅自停战、排挤孙中山、改组军政府，1918年5月21日孙中山愤然离开广州去上海；**护法运动的失败标志着整个民族资产阶级领导的旧民主主义革命的终结**","立宪派由戊戌维新时期的维新派演变而来，是民族资产阶级上层和具有资本主义倾向的地方官绅的政治代表，代表人物是**梁启超、汤化龙**。","1914年1月，袁世凯停止参议院、众议院两院议员的职务，解散议员；同年5月，袁世凯炮制**《中华民国约法》**，用总统制取代内阁制。","北洋军阀是**封建的、买办的反动政治武装集团**，以地主阶级和买办资产阶级为主要社会支柱，以外国帝国主义为主要靠山。","1914年，孙中山在日本组织中华革命党，坚持反袁武装斗争。","1915年12月25日，蔡锷等在云南组织“**护国军**”，宣布“独立”，很快形成席卷半个中国的护国运动；次年3月，袁世凯被迫取消帝制，不久忧惧而死。","1917年9月，孙中山在广州成立以孙中山为大元帅的**护法军政府**，并出师北伐。"],"q":["考法：辛亥革命的失败表明，**资产阶级共和国的方案没有能够救中国**","考法：辛亥革命失败的客观根本原因是资本主义的建国方案行不通，主观根本原因是资产阶级的软弱性和妥协性（阶级局限性）","易混：辛亥革命没有明确提出反帝的口号，甚至幻想以妥协退让来换取帝国主义对中国革命的承认和支持。"],"m":"","c":["sg"],"id":"1913a"},{"y":1915.71,"d":"1915年9月15日","t":"新文化运动兴起","ch":["史纲·第四章"],"p":"上海→北京","s":"一场空前的思想解放运动","b":"陈独秀在上海创办《青年杂志》（次年改名《新青年》），新文化运动兴起；1917年后以北京大学和《新青年》为主要阵地。","k":["**基本口号是民主和科学**","**提倡新道德、反对旧道德，提倡新文学、反对旧文学**","十月革命后，**新文化运动后期发展为宣传马克思主义的思想运动**","新文化运动**为马克思主义的广泛传播准备了思想和文化的条件**","新文化运动的局限：**把改造国民性置于优先地位，但离开改造产生封建思想的社会环境的革命实践，仅靠少数人呐喊和有限宣传手段，不可能根本改造国民性**；许多领导人物还没有马克思主义的批判精神，使用的方法一般还是资产阶级的方法","新文化运动后来分成了两个潮流：一部分人如李大钊继承了它的民主和科学精神，并在马克思主义的基础上加以改造；另一部分人如胡适沿着资产阶级道路继续走了下去。","新文化运动倡导者批判孔学，但未否定全部传统文化。"],"q":["易混：**前期新文化运动属于资产阶级民主主义性质**；局限是对东西方文化存在绝对肯定或绝对否定的形式主义偏向","考法：新民主主义革命与旧民主主义革命的**根本区别在于领导权掌握在资产阶级还是无产阶级手中**","易混：五四以前的新文化运动是资产阶级民主主义的新文化反对封建主义旧文化的斗争；五四以后的新文化运动，马克思主义开始逐步在思想文化领域发挥指导作用，才是**新民主主义的文化运动**。"],"m":"","c":["sg"],"id":"1915b"},{"y":1917.86,"d":"1917年11月7日","t":"十月革命·马克思主义在中国初步传播","ch":["史纲·第四章"],"p":"俄国彼得格勒→北京","s":"中国先进分子找到了马克思主义","b":"俄国十月革命胜利，给中国送来了马克思列宁主义。李大钊在北京率先宣传十月革命和马克思主义。","k":["**李大钊是中国最早的马克思主义者**，1918年发表《法俄革命之比较观》《庶民的胜利》《Bolshevism的胜利》等文章","1919年李大钊发表《我的马克思主义观》，**标志着马克思主义在中国进入比较系统的传播阶段**","1919年苏维埃俄国第一次对华宣言声明**放弃沙俄在中国攫取的一切特权**，引起人们很大震动","十月革命推动中国的先进分子把自己的目光**从西方转向东方**，从资产阶级民主主义转向社会主义。","当时各种社会主义思想中，无政府主义占优势。"],"q":["考法：毛泽东语——**“十月革命一声炮响，给我们送来了马克思列宁主义”**","易混：表明李大钊成为中国第一个马克思主义者的文章是**《我的马克思主义观》**。"],"m":"","c":["sg"],"id":"1917b"},{"y":1919.34,"d":"1919年5月4日","t":"五四运动","ch":["史纲·第四章"],"p":"北京→上海","s":"中国新民主主义革命的开端","b":"巴黎和会上中国外交失败，5月4日北京学生举行示威游行；6月3日后上海工人罢工，运动中心转到上海。","k":["是一场**彻底地不妥协地反帝反封建的爱国运动**","**中国工人阶级开始以独立的姿态登上政治舞台**","**促进了马克思主义在中国的传播及其同中国工人运动的结合**，为中国共产党成立作了思想上和干部上的准备","民族意识：普遍觉醒——甲午战争；**全面觉醒——五四运动**","1919年5月4日，北京十几所学校的三千余名学生在天安门前集会，提出“**外争主权、内除国贼**”“取消二十一条”“还我青岛”等口号。","迫于人民群众的压力，北洋政府不得不释放被捕学生，罢免亲日派官僚曹汝霖、章宗祥、陆宗舆；6月28日，中国政府代表**没有出席巴黎和约签字仪式**，五四运动的直接斗争目标得以实现。","伟大五四精神以**爱国、进步、民主、科学**为主要内容，其核心是爱国主义。"],"q":["易混：**运动主力由学生转为工人，中心由北京转到上海**；直接导火索是巴黎和会外交失败","易混：五四运动使中国人民对帝国主义的认识进入**理性认识阶段**。","易混：五四运动表现了反帝反封建的彻底性，但未改变中国半殖民地半封建社会的性质。","易混：新民主主义革命的性质依然是资产阶级民主主义革命，但领导阶级变了，所以叫“新”。"],"m":"五四：新民主主义革命的起点","c":["sg"],"id":"1919b"},{"y":1921.56,"d":"1921年7月23日","t":"中共一大·中国共产党成立","ch":["史纲·第四章"],"p":"上海→浙江嘉兴南湖","s":"开天辟地的大事变，是近现代中国历史发展的必然产物，是中国人民在救亡图存斗争中顽强求索的必然产物，是实现中华民族伟大复兴的必然产物","b":"1920年起，上海、北京、武汉、长沙、济南、广州等地以及旅日、旅法的先进分子相继建立共产党早期组织。1921年7月23日中共一大在上海开幕，最后一天的会议转移到嘉兴南湖的一艘游船上举行。","k":["**确定党的名称为“中国共产党”，通过党的第一个纲领和第一个决议**","纲领规定党的奋斗目标是**推翻资产阶级政权、建立无产阶级专政、消灭私有制**","确定党成立后的中心任务是**组织工人阶级、领导工人运动**；选举陈独秀为中央局书记","**中国共产党是马克思列宁主义同中国工人运动相结合的产物**","会场受到暗探注意和法租界巡捕房搜查，最后一天会议转移到嘉兴南湖游船上举行，这条游船后来被称为“红船”","伟大建党精神：**坚持真理、坚守理想、践行初心、担当使命、不怕牺牲、英勇斗争、对党忠诚、不负人民**，是中国共产党的精神之源","中国早期马克思主义思想运动重视对马克思主义基本理论的学习，明确地**同第二国际的社会民主主义划清界限**。","最早酝酿在中国建立共产党的是**陈独秀和李大钊**。","1920年8月，中国工人阶级政党**最早的组织在上海建立**，首次会议决定推选陈独秀为书记。","中共一大有**13名代表，代表50多名党员**。","出席中共一大的还有共产国际代表**马林和尼克尔斯基**。","毛泽东思想**开始萌芽**于党的创立和大革命时期，主要代表作是《中国社会各阶级的分析》（1925）和《湖南农民运动考察报告》（1927）。"],"q":["易混：**一大只提出了最高纲领，还没有提出反帝反封建的民主革命纲领**——这一步由二大完成","考法：**7月1日是1941年由党中央正式确定的纪念日，一大实际开幕日是7月23日**","易混：中国共产党是在马克思主义同中国工人运动相结合的基础上产生的，不能说农民运动","易混：一大没有区分民主革命和社会主义革命。"],"m":"","c":["sg"],"id":"1921a"},{"y":1922.54,"d":"1922年7月16日","t":"中共二大·民主革命纲领","ch":["史纲·第四章"],"p":"上海","s":"第一次明确提出彻底的反帝反封建民主革命纲领，也是中国近代史上第一个彻底的反帝反封建的民主革命纲领","b":"建党一年后，党在领导工人运动的实践中，并借助列宁关于民族和殖民地问题的理论，认识到中国首先要进行民主革命。","k":["**最高纲领：实现共产主义；最低纲领：打倒军阀，推翻国际帝国主义的压迫，统一中国为真正的民主共和国**","**第一次明确提出彻底的反帝反封建的民主革命纲领**，为中国人民的革命斗争指明了方向","**通过党的第一部党章，提出党要成为“大的群众党”**；决定加入共产国际","**第一次工人运动高潮**以1922年1月香港海员罢工为起点，以1923年2月京汉铁路工人罢工失败告终。","1922年5月5日至10日，中国社会主义青年团第一次全国代表大会在广州召开，**中国社会主义青年团宣告成立**。","安源路矿工人罢工是中国共产党**第一次独立领导并取得完全胜利**的罢工。","中共二大提出要“**到群众中去**”，开始采取群众路线的革命方法。"],"q":["易混：**一大＝党名、第一个纲领（最高纲领）；二大＝民主革命纲领（最低纲领）、第一部党章；三大＝国共合作方针**","易混：二大提出组成“民主主义的联合战线”，是第一次提出统一战线政策，但此时还不是与孙中山领导的国民党建立统一战线","易混：开滦五矿工人罢工由中国共产党领导，但没有取得完全胜利。","易混：香港海员罢工不是中国共产党领导的，是香港海员工人自发举行的。"],"m":"一大建党，二大定纲，三大合作","c":["sg"],"id":"1922a"},{"y":1923.45,"d":"1923年6月12日","t":"中共三大·确定国共合作方针","ch":["史纲·第四章"],"p":"广州","s":"确定以“党内合作”形式建立革命统一战线","b":"1923年2月京汉铁路工人大罢工遭到军阀吴佩孚血腥镇压（二七惨案），党认识到工人阶级孤军奋斗难以战胜强大的敌人，必须争取一切可能的同盟者。","k":["**决定共产党员以个人身份加入国民党**，同时在政治上、组织上保持党的独立性","**实行国共合作，建立各民主阶级的革命统一战线**"],"q":["考法：合作形式是**“党内合作”——共产党员以个人名义加入国民党，而不是两党平行合作**","考法：共产党员加入国民党时，党必须在政治上、思想上、组织上保持自己的独立性"],"m":"","c":["sg"],"id":"1923a"},{"y":1924.05,"d":"1924年1月20日","t":"国民党一大·第一次国共合作","ch":["史纲·第四章"],"p":"广州","s":"标志第一次国共合作正式形成","b":"孙中山在中国共产党和共产国际帮助下改组国民党，在广州召开国民党第一次全国代表大会，李大钊等共产党员参加大会并进入国民党中央领导机构。","k":["大会宣言对三民主义作了新的解释，形成**以联俄、联共、扶助农工三大政策为基础的新三民主义**","**新三民主义的政纲同中国共产党民主革命阶段的纲领基本一致，成为国共合作的政治基础**","1924年5月创办**黄埔军校**，为国民革命培养军事和政治骨干","新三民主义在民族主义中强调对外实行中华民族的独立，同时主张**国内各民族一律平等**。"],"q":["易混：旧三民主义（1905同盟会）→ 新三民主义（1924国民党一大）：**民族主义突出反帝，民权主义强调“为一般平民所共有”，民生主义增加“节制资本”**","考法：**国共合作的政治基础是新三民主义，合作形式是党内合作**","考法：民生主义概括为“平均地权”和“节制资本”两大原则，后来孙中山又提出“**耕者有其田**”的主张","易混：新三民主义的领导阶级是资产阶级，此时新三民主义不具备新民主主义性质。"],"m":"","c":["sg"],"id":"1924a"},{"y":1925.03,"d":"1925年1月11日","t":"中共四大·领导权与工农联盟","ch":["史纲·第四章"],"p":"上海","s":"第一次提出无产阶级领导权和工农联盟问题","b":"国共合作后，统一战线内部谁来领导、依靠谁的问题逐渐突出，党需要从理论上作出回答。","k":["**明确提出无产阶级在民主革命中的领导权问题**","提出工农联盟问题，指出**农民是工人阶级天然的同盟者**","《中国社会各阶级的分析》提出“谁是我们的敌人？谁是我们的朋友”是革命的首要问题，即**分清敌友是革命的首要问题**；指出中国社会是一个两头小中间大的社会。"],"q":["易混：四大提出了领导权问题，但大革命后期以陈独秀为代表的右倾机会主义恰恰放弃了领导权","中国革命的中心问题是无产阶级领导权问题。"],"m":"","c":["sg"],"id":"1925a"},{"y":1925.41,"d":"1925年5月30日","t":"五卅运动","ch":["史纲·第四章"],"p":"上海","s":"大革命高潮的起点","b":"上海日本纱厂资本家枪杀工人顾正红，5月30日英国巡捕在南京路向抗议群众开枪，制造了五卅惨案。","k":["中国共产党领导上海工人罢工、学生罢课、商人罢市，反帝怒潮迅速席卷全国","**6月爆发省港大罢工，坚持16个月**，有力支援了广东革命政府","五卅运动后，以广东为中心的革命统一战线进一步巩固，为北伐准备了条件"],"q":["易混：**五卅运动是大革命高潮的起点，北伐战争把大革命推向高潮**"],"m":"","c":["sg"],"id":"1925b"},{"y":1926.52,"d":"1926年7月9日","t":"北伐战争","ch":["史纲·第四章"],"p":"广州出师→长江流域","s":"把大革命推向高潮","b":"国民革命军从广州出师北伐，口号是“打倒列强，除军阀”，主要打击吴佩孚、孙传芳、张作霖三支北洋军阀力量。","k":["共产党员和共青团员在北伐军中发挥了先锋模范作用，**叶挺独立团被誉为“铁军”**","不到半年就从珠江流域打到长江流域，**基本消灭了吴佩孚、孙传芳的主力**","北伐推动了工农运动的高涨，1927年3月上海工人第三次武装起义取得胜利","上海工人的起义武装充当了**解放上海的主力**。"],"q":["考法：**北伐的胜利进军是国共合作的成果**，但高潮中也潜伏着统一战线破裂的危机","北伐战争在孙中山逝世之后发生，不由孙中山发动。"],"m":"","c":["sg"],"id":"1926a"},{"y":1927.28,"d":"1927年4月12日、7月15日","t":"四一二·七一五政变·大革命失败","ch":["史纲·第四章"],"p":"上海·武汉","s":"第一次国共合作破裂，大革命失败","b":"1927年4月12日蒋介石在上海发动反革命政变，大肆屠杀共产党员和革命群众；7月15日汪精卫集团在武汉公开“分共”。","k":["客观原因：反革命力量强大，大大超过革命力量；**资产阶级严重动摇，统一战线内部发生剧烈分化**","主观原因：党的领导机关在大革命后期犯了以陈独秀为代表的右倾机会主义错误，**放弃了对农民、对政权特别是对武装力量的领导权**","大革命失败的国际因素：大革命后期受到共产国际的错误指导","大革命失败后，国民党不再是工人、农民、城市小资产阶级和民族资产阶级的革命联盟，而是变成由代表地主阶级、买办性大资产阶级利益的反动集团控制的政党；其建立的南京国民政府**同北洋军阀统治没有本质区别**，国民党统治下中国社会的半殖民地半封建性质没有改变","1924年至1927年中国反帝反封建的革命，比以往任何一次革命、包括辛亥革命和五四运动，群众的动员程度更为广泛，斗争的规模更加宏伟，革命的社会内涵更为深刻，因此被称作**大革命**。","中国共产党是国共合作的倡导者和统一战线的组织者。"],"q":["考法：大革命失败最深刻的教训是**党必须掌握革命的领导权，特别是对武装力量的领导权**"],"m":"","c":["sg"],"id":"1927a"},{"y":1927.33,"d":"1927年4—5月","t":"中共五大","ch":["史纲·第四章"],"p":"湖北武汉","s":"首次明确民主集中制为党的根本组织原则","b":"1927年4—5月，中国共产党第五次全国代表大会在武汉举行，通过《中国共产党第三次修正章程决案》。","k":["**首次明确规定党组织的“指导原则为民主集中制”**","五大于1927年4月27日至5月9日在武汉举行，提出争取无产阶级对革命的领导权、建立革命民主政权和实行土地革命等正确原则。"],"q":["五大没有就如何争取革命领导权、如何领导农民实行土地革命、特别是如何建立党领导的革命武装提出有效具体措施，难以承担起挽救革命的任务。"],"m":"","c":["sg"],"id":"1927e"},{"y":1927.58,"d":"1927年8月1日","t":"南昌起义","ch":["史纲·第五章"],"p":"江西南昌","s":"打响武装反抗国民党反动派的第一枪","b":"大革命失败后，周恩来、贺龙、叶挺、朱德、刘伯承等领导党所掌握和影响的军队两万余人在南昌举行起义。","k":["**标志着中国共产党独立领导革命战争、创建人民军队和武装夺取政权的开端**","起义军南下广东途中受挫，朱德、陈毅率余部转战湘南，1928年4月上井冈山与毛泽东部会师","**8月1日后来被定为中国人民解放军建军节**"],"q":["易混：南昌起义是“第一枪”“开端”；**第一次公开打出“工农革命军”旗帜的是秋收起义**"],"m":"","c":["sg"],"id":"1927b"},{"y":1927.6,"d":"1927年8月7日","t":"八七会议","ch":["史纲·第五章"],"p":"湖北汉口","s":"由大革命失败到土地革命战争兴起的历史性转折","b":"大革命失败后全国陷入白色恐怖，共产党被宣布为“非法”，党的组织不断遭到破坏，活动被迫转入地下；1927年3月到1928年上半年，被杀害的共产党员和革命群众达31万多人，全党党员由五大时的57967人锐减到1万余人。党中央在汉口秘密召开紧急会议，总结大革命失败的教训，纠正以陈独秀为代表的右倾机会主义错误。","k":["**确定了实行土地革命和武装反抗国民党反动派的总方针**","毛泽东提出**“须知政权是由枪杆子中取得的”**","会后派干部到各地发动武装起义；但会议在反对右倾错误时，也为“左”倾错误的发展开了先河","八七会议明确提出**土地革命是中国资产阶级民主革命的中心问题**"],"q":["考法：**“枪杆子里面出政权”的思想最早在八七会议上提出**","易混：中国革命的**首要问题是分清敌友，中心问题是领导权问题，基本问题是农民问题，中国资产阶级民主革命的中心问题是土地革命**","易混：八七会议后建立**工农民主统一战线**（1927年8月—1937年7月），以反对封建压迫和国民党新军阀的统治为目标。"],"m":"","c":["sg"],"id":"1927c"},{"y":1927.69,"d":"1927年9月9日起","t":"秋收起义·井冈山革命根据地","ch":["史纲·第五章"],"p":"湘赣边界→江西井冈山","s":"由进攻城市转向农村进军的伟大开端","b":"毛泽东领导湘赣边界秋收起义，攻打长沙受挫后，果断放弃进攻大城市，率部转向敌人统治薄弱的农村山区。","k":["**起义第一次公开打出“工农革命军”的旗帜**","9月底三湾改编，**把党的支部建在连上，从组织上确立了党对军队的领导**","10月到达井冈山，**创建第一个农村革命根据地**；1928年4月朱德、陈毅部到达井冈山，两军会师组成工农革命军第四军","1928年毛泽东写下《中国的红色政权为什么能够存在？》《井冈山的斗争》，**提出“工农武装割据”思想**","中国革命由此进入土地革命战争时期（1927—1937年），又称**十年内战时期**。","井冈山根据地的建立开始了“**农村包围城市、武装夺取政权**”的正确道路。","1927年11月，成立了边界第一个红色政权——**茶陵县工农兵政府**。","1928年12月，毛泽东在井冈山主持制定《井冈山土地法》，是中国共产党历史上**第一个土地法**。"],"q":["考法：工农武装割据＝**以武装斗争为主要形式、以土地革命为基本内容、以农村革命根据地为战略阵地**，三者紧密结合","易混：实践证明，想通过城市武装起义或攻占大城市来夺取革命胜利是不可能的。","易混：《井冈山土地法》规定没收一切土地归苏维埃政府所有、禁止土地买卖，这些规定并不适合当时中国农村的实际。","易混：秋收起义打的是工农革命军的旗帜，南昌起义打的是国民革命军的旗帜；秋收起义不仅是军队的行动，而且有数量众多的工农武装参加。"],"m":"秋收转兵上井冈，支部建在连上","c":["sg"],"id":"1927d"},{"y":1928.47,"d":"1928年6月18日—7月11日","t":"中共六大","ch":["史纲·第五章"],"p":"苏联莫斯科","s":"唯一一次在国外召开的全国代表大会；确定以争取群众为首要任务，是党的工作方针的一次重要转变","b":"大革命失败后，党内对中国社会性质和革命性质认识不一，“左”倾盲动错误又给革命造成了损失。会议在继续把城市工作的复兴视为革命高潮到来的决定条件的同时，肯定了农村根据地和红军是决定革命新高潮的更大发展基础和重要力量。","k":["肯定中国仍是半殖民地半封建社会，**现阶段的革命仍是资产阶级民主革命**","指出当时处在两个革命高潮之间，**党的总任务是争取群众，而不是进攻和暴动**","不足：对中间阶级的作用和反动势力内部的矛盾缺乏正确估计，对农村根据地的重要性和民主革命的长期性认识不足","1928年12月29日，张学良从东北发出通告，宣布“恪守三民主义，服从国民政府，改易旗帜”；北洋军阀不再作为独立的政治力量继续存在，国民党在全国范围内建立了自己的统治。"],"q":["易混：土地革命时期三次“左”倾错误——瞿秋白盲动主义（1927—1928）、李立三冒险主义（1930）、王明教条主义（1931—1935），**危害最大的是王明“左”倾错误**"],"m":"","c":["sg"],"id":"1928a"},{"y":1929.99,"d":"1929年12月28日","t":"古田会议","ch":["史纲·第五章"],"p":"福建上杭古田","s":"确立思想建党、政治建军的原则","b":"红军长期处于农村游击环境，成分复杂（农民和其他小资产阶级占多数），存在单纯军事观点、极端民主化、非组织观点等非无产阶级思想，影响军队建设和党的领导。1929年12月，红四军第九次党的代表大会在福建上杭古田召开，通过了毛泽东起草的决议（即古田会议决议）。","k":["规定**红军是一个执行革命的政治任务的武装集团，必须绝对服从党的领导**","批判了单纯军事观点、极端民主化、非组织观点等错误思想","**古田会议决议是党和人民军队建设的纲领性文献**","**把思想建设放在党的建设首位，用无产阶级思想克服非无产阶级思想**","红军必须担负**打仗、筹款和做群众工作**的任务，必须加强政治工作","1929年4月，毛泽东在兴国主持制定《兴国土地法》，将“没收一切土地”改为“**没收一切公共土地及地主阶级的土地**”，这是一个原则性的改正，保护了中农的利益不受侵犯。","红军游击战争实际上已经成为中国革命的主要形式，农村根据地成为积蓄和锻炼革命力量的主要战略阵地。","《星星之火，可以燎原》（1930）指出红军、游击队和红色区域的建立和发展，是半殖民地中国在无产阶级领导之下的**农民斗争的最高形式**。","《反对本本主义》（1930）提出“**没有调查，就没有发言权**”的论断。","《反对本本主义》（1930）提出“中国革命斗争的胜利要靠中国同志了解中国情况”的重要思想，这是**独立自主思想的最初的明确表述**。","毛泽东思想**初步形成**于土地革命时期，标志是农村包围城市、武装夺取政权理论的提出，代表作有《中国的红色政权为什么能够存在？》《井冈山的斗争》《星星之火，可以燎原》《反对本本主义》。"],"q":["易混：三湾改编从“组织上”确立党对军队的领导；**古田会议从“思想上、政治上”确立建党建军原则**","易混：党对军队的绝对领导——**发端于南昌起义、奠基于三湾改编（支部建在连上）、定型于古田会议**","易混：《兴国土地法》仍规定没收的土地归苏维埃政府所有，农民对所分得的土地只有使用权、没有所有权。"],"m":"","c":["sg"],"id":"1929a"},{"y":1931.71,"d":"1931年9月18日","t":"九一八事变","ch":["史纲·第六章"],"p":"辽宁沈阳","s":"中国人民抗日战争的起点","b":"日本关东军炸毁沈阳北郊柳条湖附近的南满铁路，反诬中国军队所为，当夜炮轰东北军驻地北大营，接着向沈阳城等地发动进攻。国民党政府奉行“攘外必先安内”方针，实行不抵抗政策，东北三省很快沦陷。","k":["**揭开了中国人民抗日战争的序幕，也揭开了世界反法西斯战争的序幕**","1932年**日本扶植成立伪“满洲国”**；东北抗日义勇军和后来的东北抗日联军坚持抗战","中国共产党号召武装抗日，领导和推动了东北的抗日斗争","国际联盟和英、美等国对日本采取姑息、纵容政策，使日本对中国的侵略计划步步得逞","至1932年2月，中国东北全境沦陷。","1931年7月，蒋介石即已提出“攘外必先安内”的方针。"],"q":["易混：**九一八事变＝局部抗战开始（14年抗战的起点）；七七事变＝全民族抗战开始**"],"m":"","c":["sg"],"id":"1931a"},{"y":1931.87,"d":"1931年11月","t":"中华苏维埃第一次全国代表大会","ch":["史纲·第五章"],"p":"江西瑞金","s":"成立中华苏维埃共和国，中国历史上第一个全国性的工农民主政权","b":"1931年11月，中华苏维埃第一次全国代表大会在江西瑞金召开，成立了中华苏维埃共和国临时中央政府。大会的召开扩大了党和红色政权的影响，一定程度上加强了对处于被分割状态的各根据地的中枢指挥作用，推动了各根据地的政权、经济、文化教育和党的自身建设，开创了土地革命战争新局面。","k":["**通过《中华苏维埃共和国宪法大纲》**以及土地法令、劳动法等","选举产生中央执行委员会，**毛泽东当选为临时中央政府主席**","中华苏维埃共和国是**中国历史上第一个全国性的工农民主政权**，是中国共产党在局部地区执政的重要尝试","实行**工农兵代表大会制度**，各级苏维埃政府广泛吸收工农群众代表参加政权管理","红一方面军在毛泽东、朱德等指挥下贯彻积极防御的方针，实行“**诱敌深入**”等战术，连续粉碎了国民党军队的前三次“围剿”；1933年3月，取得了第四次反“围剿”战争的胜利。","开展土地革命，就是要**消灭封建地主的土地私有制，实行农民的土地私有制**，使广大农民在政治上得到翻身，农村生产力得到解放和发展。","1931年2月，毛泽东规定，农民已经分得的田**归农民个人私有**，可以自主租借买卖，别人不得侵犯；生产的产品除向政府缴纳土地税外，均归农民个人私有，可自由买卖。","土地革命的阶级路线是**坚定地依靠贫农、雇农，联合中农，限制富农，保护中小工商业者，消灭地主阶级**。"],"q":["易混：**土地革命时期政权性质——工农民主政权；抗日战争时期——一切赞成抗日又赞成民主的人们政权；解放战争时期——各个革命阶级的联合专政；新中国——人民民主专政**","易混：土地分配以乡为单位、**按人口平分土地，不是按劳动力**；在原耕地的基础上实行抽多补少、抽肥补瘦。"],"m":"","c":["sg"],"id":"1931b"},{"y":1934.78,"d":"1934年10月10日—1936年10月","t":"红军长征","ch":["史纲·第五章"],"p":"江西瑞金→陕北→甘肃会宁","s":"中国革命转危为安的伟大战略转移","b":"由于王明“左”倾教条主义错误的领导，中央革命根据地第五次反“围剿”失败，中央红军被迫进行战略转移。","k":["1935年10月中央红军到达陕北吴起镇；**1936年10月红一、二、四方面军在甘肃会宁、宁夏将台堡会师，长征胜利结束**","**长征是宣言书，是宣传队，是播种机**；宣告了国民党反动派围追堵截的破产","长征的胜利，是党和中国革命事业**从挫折走向胜利的伟大转折点**，形成了伟大的长征精神","王明“左”倾教条主义在革命性质和统一战线问题上混淆民主革命与社会主义革命的界限，**将民族资产阶级视为中国革命最危险的敌人**，一味排斥和打击中间势力。","王明“左”倾教条主义在革命道路问题上继续坚持以城市为中心，将准备城市工人的总同盟罢工和武装起义作为共产党最主要的任务。","王明“左”倾教条主义在土地革命问题上提出坚决打击富农和“**地主不分田，富农分坏田**”的主张。","王明“左”倾教条主义在军事斗争问题上实行**进攻中的冒险主义、防御中的保守主义、退却中的逃跑主义**。","王明“左”倾教条主义在党内斗争和组织问题上推行宗派主义和“**残酷斗争，无情打击**”的方针。","遵义会议后，中央红军**四渡赤水河、巧渡金沙江、强渡大渡河、飞夺泸定桥**，摆脱了国民党军队的围追堵截，赢得了战争的主动权。","党同**张国焘的分裂主义**进行了坚决斗争。","中央红军主力行程**二万五千里、纵横11个省**。","1936年10月9日，红四方面军到达甘肃会宁与红一方面军会合；10月22日，红二方面军到达甘肃隆德将台堡与红一方面军会合，至此三大主力红军的长征胜利结束。","长征宣告了中国共产党和红军肩负着民族希望胜利实现了**北上抗日的战略转移**。","中央红军进行长征的直接原因是红军在第五次反“围剿”作战中遭到失败，红军已无在原地扭转战局的可能。"],"q":["考法：长征胜利结束的标志是1936年10月三大主力会师；长征途中最重要的会议是遵义会议"],"m":"","c":["sg"],"id":"1934a"},{"y":1935.04,"d":"1935年1月15日","t":"遵义会议","ch":["史纲·第五章"],"p":"贵州遵义","s":"党的历史上一个生死攸关的转折点","b":"长征初期红军损失惨重，湘江战役后由出发时的8.6万余人锐减到3万余人。博古、李德等人的“左”倾错误军事指挥是第五次反“围剿”失败的主要原因，党和红军面临生死存亡的危机，迫切需要纠正错误、确立正确领导。1935年1月中央政治局在遵义召开扩大会议。","k":["**集中解决了当时具有决定意义的军事问题和组织问题**，结束了王明“左”倾教条主义在党中央的统治","**实际上确立了毛泽东在党中央和红军的领导地位**","是党第一次独立自主地运用马克思主义基本原理解决自己的路线、方针、政策问题，**标志着党在政治上开始走向成熟**","在极其危急的情况下**挽救了中国共产党、挽救了中国工农红军、挽救了中国革命**","1935年1月7日，红军攻克黔北重镇遵义；**1月15日至17日**，中共中央在此召开政治局扩大会议，即遵义会议。","遵义会议**增选毛泽东为中央政治局常委**。"],"q":["易混：遵义会议没有全面讨论政治路线问题，而是集中解决军事和组织问题——这是紧急情况下的正确选择","易混：遵义会议确立毛泽东的领导地位；**正式确立毛泽东思想为指导思想是1945年七大**"],"m":"生死攸关的转折点","c":["sg"],"id":"1935a"},{"y":1935.94,"d":"1935年12月9日","t":"一二·九运动·瓦窑堡会议","ch":["史纲·第六章"],"p":"北平·陕北瓦窑堡","s":"抗日救亡新高潮与抗日民族统一战线策略方针的确定","b":"1935年日本策动“华北事变”，企图使华北五省脱离中国政府管辖，民族危机空前严重。","k":["12月9日北平学生举行抗日救国示威游行，**标志着中国人民抗日救亡运动新高潮的到来**","12月中共中央在瓦窑堡召开政治局会议，**确定了建立抗日民族统一战线的策略方针**","毛泽东作《论反对日本帝国主义的策略》报告，**批判了党内的“左”倾关门主义**","瓦窑堡会议**开始解决党的政治路线问题、实现了政治路线的转变**，标志着党的抗日民族统一战线策略正式形成","一二·九运动喊出“反对华北自治”“打倒日本帝国主义”“**停止内战，一致对外**”等口号。","1935年8月1日，中共驻共产国际代表团草拟《中国苏维埃政府、中国共产党中央为抗日救国告全体同胞书》（**八一宣言**），呼吁全国各党派、各阶层、各军队团结起来，停止内战，一致抗日。","瓦窑堡会议决定将“工农共和国”口号改变为“**人民共和国**”。"],"q":["易混：1935年8月的《八一宣言》呼吁停止内战、一致抗日；**瓦窑堡会议才正式确定抗日民族统一战线的策略方针**"],"m":"","c":["sg"],"id":"1935b"},{"y":1936.95,"d":"1936年12月12日","t":"西安事变","ch":["史纲·第六章"],"p":"陕西西安","s":"西安事变的和平解决成为时局转换的枢纽，十年内战局面基本结束、国内和平初步实现","b":"蒋介石“攘外必先安内”的方针并没有根本改变，1936年12月初他到达西安，逼张学良、杨虎城“剿共”。张学良、杨虎城多次劝谏蒋介石停止内战、联共抗日无效后，在西安扣押蒋介石，实行“兵谏”。","k":["中国共产党从民族大义出发，**主张和平解决**，派周恩来等赴西安谈判","蒋介石被迫接受**“停止内战，联共抗日”**的主张","西安事变的和平解决使**十年内战的局面基本结束，国内和平初步实现**","1936年5月，中共中央发布《停战议和一致抗日通电》，放弃了“反蒋”的口号，**第一次公开把蒋介石作为联合的对象**。","1936年9月1日，中共中央发出党内指示，明确提出党的总方针是“**逼蒋抗日**”。","《中国革命战争的战略问题》（1936）分析中国革命战争的特点：中国是一个政治经济发展不平衡的大国、敌人强大、人民军队弱小、共产党的领导和土地革命。"],"q":["考法：**西安事变和平解决 ≠ 抗日民族统一战线正式形成**（正式形成在1937年9月）"],"m":"","c":["sg"],"id":"1936a"},{"y":1937.52,"d":"1937年7月7日","t":"七七事变·全民族抗战","ch":["史纲·第六章"],"p":"北平卢沟桥","s":"全民族抗战的开始","b":"日军借口一名士兵“失踪”，向北平西南卢沟桥一带的中国守军发动进攻，中国守军奋起抵抗。","k":["7月8日中共中央通电全国：“平津危急！华北危急！中华民族危急！**只有全民族实行抗战，才是我们的出路！**”","8月洛川会议提出**全面抗战路线**（人民战争路线），制定《抗日救国十大纲领》；红军主力改编为八路军，10月南方红军游击队改编为新四军","9月22日国民党中央通讯社发表中共中央提交的国共合作宣言，23日蒋介石发表谈话承认共产党的合法地位，**标志着以国共第二次合作为基础的抗日民族统一战线正式形成**","卢沟桥事变后，中国在东方开辟了世界**第一个大规模的反法西斯战场**。","1937年2月，中共中央致电国民党五届三中全会，提出停止内战、一致对外等五项要求。","中共中央表示，如果国民党将五项要求定为国策，共产党愿意实行**四项保证**：停止武力推翻国民党政府的方针，苏维埃政府改名为中华民国特区政府，红军改名为国民革命军，特区实行彻底的民主制度，停止没收地主土地的政策。"],"q":["易混：**共产党的全面抗战路线（依靠广大人民群众）vs 国民党的片面抗战路线（单纯依靠政府和军队）**","易混：第二次国共合作的新特点：国共双方有政权有军队的合作，没有正式的固定的组织形式和协商一致的具体的共同纲领，采取**党外合作**的形式。"],"m":"","c":["sg"],"id":"1937a"},{"y":1937.52,"d":"1937年7月7日—1938年10月","t":"正面战场·战略防御","ch":["史纲·第六章"],"p":"淞沪·太原·徐州·武汉","s":"国民党军队担负正面战场作战","b":"战略防御阶段，国民党政府的抗战态度比较积极，组织了一系列大规模会战。","k":["先后组织淞沪、太原、徐州、武汉等会战，**粉碎了日本“三个月灭亡中国”的狂妄计划**","1938年春**台儿庄战役，是抗战以来正面战场取得的最大胜利**","1937年12月日军攻陷南京，制造了**屠杀中国军民30万人以上的南京大屠杀**；12月13日现为南京大屠杀死难者国家公祭日","1938年10月广州、武汉失守后，**抗日战争进入战略相持阶段**","战略防御阶段，国民党正面战场的正规战是主要的，敌后游击战是辅助的。"],"q":["考法：进入相持阶段后，**日本对国民党改以政治诱降为主、军事打击为辅，国民党政策重心逐渐转向消极抗日、积极反共**"],"m":"","c":["sg"],"id":"1937b"},{"y":1937.62,"d":"1937年8月","t":"洛川会议","ch":["史纲·第六章"],"p":"陕西洛川","s":"制定全面抗战路线和《抗日救国十大纲领》","b":"1937年“七七事变”后全面抗日战争爆发，面对日军全面进攻，党需要明确抗战的路线、方针和策略，解决“如何抗战、依靠谁抗战”的关键问题。1937年8月，中共中央在陕北洛川召开政治局扩大会议。","k":["**制定了中国共产党的全面抗战路线，制定《抗日救国十大纲领》**","**坚持抗日战争中的无产阶级领导权**，在敌人后方放手发动独立自主的山地游击战争","毛泽东在《实践论》（1937）中把实践表述为“**主观见之于客观的东西**”，并对社会实践在人类认识过程中的重要地位和决定性作用作了系统阐释。","毛泽东在《矛盾论》（1937）中指出，马克思主义的最本质的东西，马克思主义的活的灵魂，就在于**具体地分析具体的情况**。","洛川会议通过的《抗日救国十大纲领》将**减租减息**作为抗日战争时期解决农民问题的基本政策。"],"q":["易混：**瓦窑堡会议（1935.12）侧重“建立统一战线”；洛川会议（1937.8）侧重“如何抗战”**、制定全面抗战路线"],"m":"","c":["sg"],"id":"1937d"},{"y":1937.71,"d":"1937年9月—1945年8月","t":"敌后战场与抗日根据地建设","ch":["史纲·第六章"],"p":"华北·华中敌后","s":"中国共产党成为全民族抗战的中流砥柱","b":"全民族抗战开始后，八路军、新四军深入敌后，发动群众开展游击战争，开辟敌后战场，建立抗日根据地。为克服根据地面临的严重困难局面，毛泽东提出“发展经济，保障供给”的经济工作和财政工作总方针，发出“自己动手，丰衣足食”的号召，领导根据地军民开展大生产运动。","k":["1937年9月平型关大捷，是**全国抗战以来中国军队的第一个大胜仗**","1940年8—12月百团大战，是抗战期间八路军在华北发动的**规模最大、持续时间最长**的战役","抗日民主政权实行**“三三制”：共产党员、非党的左派进步分子、不左不右的中间派各占三分之一**；农村实行减租减息","面对国民党顽固派的三次反共高潮（第二次以1941年1月皖南事变为顶点），**党坚持“发展进步势力，争取中间势力，孤立顽固势力”的方针**","1939年1月，国民党五届五中全会确定**“防共”“限共”“溶共”**的方针。","蒋介石将“抗战到底”解释为“**恢复卢沟桥事变以前的状态**”，这标志着国民党政府逐步转变为消极抗战。","1941年12月，日军发动太平洋战争，美、英对日宣战，中国政府也**正式对日宣战**。","在战略相持阶段，敌后游击战争成为**主要的抗日作战方式**。","中国抗日战争逐渐形成战略上互相配合的**两个战场**：一个是主要由国民党军队担负的正面战场，另一个是由共产党领导的人民军队为主担负的敌后战场。","在统一战线中必须坚持**独立自主原则**：保持在思想上、政治上和组织上的独立性，放手发动群众、壮大人民力量，坚持对人民军队的绝对领导，对国民党采取又团结又斗争、以斗争求团结的方针。","1939年7月，中国共产党明确提出“坚持抗战到底——反对中途妥协”“巩固国内团结——反对内部分裂”“力求全国进步——反对向后倒退”**三大口号**。","**顽固势力**是指大地主大资产阶级的抗日派，即以蒋介石集团为代表的国民党亲英美派。","中国共产党对顽固派贯彻又联合又斗争的政策，在同顽固派作斗争时坚持**有理、有利、有节**的原则。","抗日民主政权普遍采取民主集中制，各级抗日民主政权机构的领导人都经过人民选举产生；在少数民族聚居地区**试行民族区域自治**。","抗日战争时期建立的政权的性质是抗日民族统一战线性质的政权，是一切赞成抗日又赞成民主的人们的政权。"],"q":["易混：**减租减息（抗战时期，地主减租减息、农民交租交息）≠ 没收地主土地（解放战争时期）**","易混：进步势力指工人、农民和城市小资产阶级，是统一战线的基础和抗日战争的主要依靠力量；中间势力指民族资产阶级、开明绅士和地方实力派","易混：开明绅士指抗日战争时期地主和富农阶级中带有民主色彩的个别人士；地方实力派指在一定地域内具有较强军事、政治影响力的集团，例如桂系、晋系。","易混：“三三制”中，共产党员代表工人和农民，党外进步人士代表小资产阶级，中间派代表民族资产阶级和开明绅士（注意**没有地方实力派**）。"],"m":"","c":["sg"],"id":"1937c"},{"y":1938.4,"d":"1938年5月26日","t":"《论持久战》","ch":["史纲·第六章"],"p":"陕北延安","s":"科学预见了抗日战争的发展进程","b":"抗战初期，国内流行“亡国论”和“速胜论”两种错误观点。毛泽东在延安抗日战争研究会上发表长篇讲演。","k":["**驳斥了“亡国论”和“速胜论”，指出抗日战争是持久战，最后胜利属于中国**","预见抗日战争将经过**战略防御、战略相持、战略反攻三个阶段，战略相持阶段是最重要、是转变的枢纽**","强调“战争的伟力之最深厚的根源，存在于民众之中”，指出游击战争的战略地位和作用，**兵民是胜利之本**","《论持久战》系统阐明了抗日战争的发展规律和坚持抗战、争取抗战胜利必须实行的战略总方针，是中国共产党领导抗日战争的**纲领性文献**。"],"q":["考法：持久战的依据是中日双方的基本特点——敌强我弱、敌退步我进步、敌小我大、敌寡助我多助"],"m":"","c":["sg"],"id":"1938a"},{"y":1938.75,"d":"1938年9月29日—11月6日","t":"六届六中全会·提出“马克思主义中国化”","ch":["史纲·第六章"],"p":"陕北延安","s":"第一次明确提出“马克思主义中国化”的命题","b":"王明从苏联回国后提出“一切经过统一战线”的右倾主张，党内思想亟须统一。1938年8月中共驻共产国际代表王稼祥回国，传达共产国际指示：中共中央的政治路线是正确的，中共中央要以毛泽东为首来解决统一领导的问题。","k":["毛泽东指出：要**“使马克思主义在中国具体化，使之在其每一表现中带着必须有的中国的特性”**","强调在统一战线中坚持独立自主原则，**批判了“一切经过统一战线”的错误主张**","全会**基本上纠正了王明的右倾错误**，统一了全党的思想和步调","毛泽东在会上作《论新阶段》政治报告，**第一次提出“马克思主义中国化”的科学命题**，它源于对中国革命进程中正反两个方面实践经验的科学总结","毛泽东后来指出“六中全会是决定中国之命运的”；全会进一步巩固了毛泽东在全党的领导地位"],"q":["易混：**1938年提出“马克思主义中国化”；十九届六中全会决议、二十大报告进一步使用“马克思主义中国化时代化”的表述**","易混：“一切经过统一战线”“**一切服从统一战线**”是王明在抗日战争时期的右倾错误主张，其实质是放弃了党对统一战线的领导权，将抗日战争的领导权拱手让给国民党，否认抗日民族统一战线的独立自主原则。"],"m":"","c":["sg"],"id":"1938b"},{"y":1940.02,"d":"1940年1月9日","t":"《新民主主义论》","ch":["史纲·第六章"],"p":"陕北延安","s":"系统阐述新民主主义理论","b":"抗战进入相持阶段后，“中国向何处去”成为各界关注的问题。毛泽东在陕甘宁边区文化协会第一次代表大会上发表讲演，后以《新民主主义论》为题发表。","k":["中国革命分两步走：**第一步是新民主主义革命，第二步是社会主义革命**，好比文章的上篇和下篇","**系统阐述了新民主主义的政治、经济、文化纲领**","新民主主义文化是**民族的、科学的、大众的文化**","同期著作一起系统阐述了新民主主义革命理论，**标志着毛泽东思想走向成熟**","1939年、1940年之交，毛泽东撰写了《〈共产党人〉发刊词》《中国革命和中国共产党》《新民主主义论》等一批重要理论著作。","五四运动以后的中国民主革命，已经是**无产阶级领导的人民大众的反帝反封建的新民主主义革命**。","毛泽东总结中国共产党成立以来的历史经验，指出统一战线、武装斗争、党的建设是中国共产党在中国革命中战胜敌人的**三个法宝**。","《共产党人发刊词》（1939）第一次明确提出把中国共产党建设成为全范围的、广大群众思想上政治上组织上全巩固的马克思主义政党，毛泽东把建设这样的党称之为“**伟大的工程**”。","《中国革命和中国共产党》（1939）第一次提出新民主主义以及**新民主主义革命**这两个科学概念，指出所谓新民主主义革命就是在无产阶级领导之下的人民大众的反帝反封建的革命。","《中国革命和中国共产党》（1939）强调认清中国国情乃是认清一切革命问题的基本的依据。","农民问题是中国革命的基本问题，新民主主义革命实质上就是党领导下的农民革命，中国革命战争实质上就是党领导下的农民战争。"],"q":["易混：**民主主义革命是社会主义革命的必要准备，社会主义革命是民主主义革命的必然趋势**","易混：统一战线和武装斗争是中国革命的**两个基本特点**，是战胜敌人的两个基本武器。"],"m":"","c":["sg"],"id":"1940a"},{"y":1942.09,"d":"1942年2月1日—1945年4月","t":"延安整风运动","ch":["史纲·第六章"],"p":"陕北延安","s":"一次全党范围的马克思主义思想教育运动","b":"遵义会议以来党的路线已走上马克思主义的正确轨道，但对曾经给党的事业造成严重危害的主观主义、教条主义还没有来得及从思想上进行认真清理。为清除“左”倾和右倾错误、特别是教条主义的影响，党在全党范围内开展整风。1941年5月毛泽东作《改造我们的学习》报告，1942年2月作《整顿党的作风》《反对党八股》讲演。","k":["**主要内容：反对主观主义以整顿学风，反对宗派主义以整顿党风，反对党八股以整顿文风**","**反对主观主义是整风运动最主要的任务，重点是反对教条主义**","毛泽东对“实事求是”作了马克思主义的解释，**党的实事求是思想路线得以确立**","1945年4月六届七中全会通过《关于若干历史问题的决议》，**即党的第一个历史决议**","《在延安文艺座谈会上的讲话》（1942）提出文艺为人民大众服务、**为工农兵服务**的方针。","六届七中全会的召开标志着整风运动胜利结束。","整风运动提出对待犯错误同志的正确方针是“**惩前毖后、治病救人**”。"],"q":["易混：三个历史决议——1945年六届七中全会、1981年十一届六中全会、2021年十九届六中全会","易混：**遵义会议解决军事和组织问题，瓦窑堡会议解决政治路线问题，延安整风解决思想问题**（实事求是思想路线在全党确立）","易混：主观主义的实质是理论脱离实际，是实际工作中的唯心主义，其主要表现形式是教条主义和经验主义，尤其**教条主义是整风运动的重点**。"],"m":"","c":["sg"],"id":"1942a"},{"y":1945.31,"d":"1945年4月23日—6月11日","t":"中共七大·确立毛泽东思想为指导思想","ch":["史纲·第六章"],"p":"陕北延安","s":"把毛泽东思想确立为党的指导思想并写入党章","b":"抗战胜利前夕，党的第七次全国代表大会在延安召开。七大召开前，延安整风使全党团结在毛泽东的旗帜下，实现了党的空前统一和团结。","k":["毛泽东作《论联合政府》政治报告，提出党的政治路线：**放手发动群众，壮大人民力量，在党的领导下打败日本侵略者，解放全国人民，建立一个新民主主义的中国**","总结了党的三大优良作风：**理论和实践相结合、和人民群众紧密地联系在一起、自我批评**","中共七大以“团结的大会，胜利的大会”载入党的史册，标志着我们党**在政治上、思想上、组织上走向了成熟**","中共七大在中国共产党的文件上首次明确提出：“中国一切政党的政策及其实践在中国人民中所表现的作用的好坏、大小，归根到底，看它对于中国人民的**生产力的发展是否有帮助**及其帮助之大小，看它是束缚生产力的，还是解放生产力的。”","毛泽东在回答能否跳出治乱兴衰历史周期率问题时说：“我们已经找到新路，我们能跳出这周期率。这条新路，就是民主。**只有让人民来监督政府，政府才不敢松懈**。”","《论联合政府》（1945）提出废除国民党一党专政、建立由各党派组成民主联合政府的主张。","中共七大提出实现中国工业化的宏伟任务。","《论联合政府》提出的新民主主义经济纲领：没收封建地主阶级的土地归农民所有，没收官僚资本归新民主主义国家所有，保护民族工商业。"],"q":["易混：“毛泽东思想”一词由王稼祥在1943年7月首先提出；**1945年七大正式确立为党的指导思想**","考法：**毛泽东思想是马克思主义中国化的第一个重大理论成果**"],"m":"","c":["sg"],"id":"1945a"},{"y":1945.62,"d":"1945年8月15日","t":"抗日战争胜利","ch":["史纲·第六章"],"p":"全国","s":"近代以来中国人民反抗外敌入侵第一次取得完全胜利的民族解放战争","b":"1945年8月苏联对日宣战，中国军民发起大反攻；8月15日日本宣布无条件投降，9月2日在投降书上签字。","k":["**9月3日被确定为中国人民抗日战争胜利纪念日；10月25日台湾光复**","胜利原因：**中国共产党的中流砥柱作用**；全民族团结抗战；世界上一切爱好和平和正义的国家和人民的支持","意义：彻底粉碎了日本军国主义殖民奴役中国的图谋，洗刷了近代以来抗击外来侵略屡战屡败的民族耻辱，**重新确立了中国在世界上的大国地位，开辟了中华民族伟大复兴的光明前景**","**中国战场是世界反法西斯战争的东方主战场**","《开罗宣言》从法律层面明确了日本侵占台湾的非法性，**确认了台湾是中国领土**。","伟大抗战精神是天下兴亡、匹夫有责的爱国情怀，视死如归、宁死不屈的民族气节，不畏强暴、血战到底的英雄气概，百折不挠、坚忍不拔的必胜信念。"],"q":["易混：**14年抗战（1931—1945）vs 8年全民族抗战（1937—1945）**"],"m":"","c":["sg"],"id":"1945b"},{"y":1945.66,"d":"1945年8月28日—10月10日","t":"重庆谈判·《双十协定》","ch":["史纲·第七章"],"p":"重庆","s":"国民党被迫承认和平建国的基本方针","b":"抗战胜利后，中国面临两种命运、两个前途的抉择。蒋介石三次电邀毛泽东赴重庆谈判，其目的是一以此敷衍国内外舆论、掩盖其正在进行的内战准备，二是诱使中共交出人民军队和解放区政权以期不战而控制全中国，三是如果谈判不成即放手发动内战并把战争责任转嫁给中国共产党。","k":["毛泽东、周恩来、王若飞赴重庆谈判，**10月10日签订《政府与中共代表会谈纪要》（即《双十协定》）**","**国民党承认和平建国的基本方针**，同意召开政治协商会议，但军队和解放区政权问题未能解决","1945年8月25日中共中央发表《对目前时局的宣言》，**明确提出和平、民主、团结的口号**","政协协议较多地吸收了中间人士的意见，虽然还不是新民主主义性质的，但有利于冲破蒋介石的独裁统治和实行民主政治、有利于和平建国；在一个时期内，是否忠实履行政协协议成了人们衡量政治是非的重要尺度","抗战胜利后，国民党统治集团的根本目标是使战后的中国维持蒋介石的独裁统治，继续走半殖民地半封建社会的老路。","当时美国采取**扶蒋反共**政策。","1945年8月23日，中共中央政治局召开扩大会议，提出今后对国民党的方针是“**蒋反我亦反，蒋停我亦停**”，以斗争达到团结，迫使国民党在一定程度上接受人民的要求。"],"q":[],"m":"","c":["sg"],"id":"1945c"},{"y":1946.48,"d":"1946年6月26日","t":"全面内战爆发","ch":["史纲·第七章"],"p":"中原解放区","s":"解放战争全面开始","b":"国民党依仗军事优势和美国援助，以围攻中原解放区为起点，向各解放区发动全面进攻。","k":["战略防御阶段（1946年6月—1947年6月），**以歼灭敌人有生力量为主要目标，不以保守或夺取地方为主要目标**","1947年3月起国民党转为对陕北和山东解放区的重点进攻；5月**孟良崮战役**全歼整编第七十四师","1946年5月4日中共中央发出《关于清算减租及土地问题的指示》（《五四指示》），**将减租减息政策改为实现“耕者有其田”**","毛泽东指出，在军事上必须采取集中优势兵力、各个歼灭敌人的作战原则；在政治上必须在党的领导下建立最广泛的人民民主统一战线","1947年10月10日中国人民解放军总部发表宣言，提出**“打倒蒋介石，解放全中国”的口号**","1947年3月，国民党当局限期令中共驻南京、上海、重庆三地代表及工作人员全部撤退，至此一切和平谈判之门都被国民党关闭，国共关系彻底破裂。","全面内战爆发时，国民党政府拥有军队总兵力约**430万人**，控制着全国76%的面积、3.39亿人口；人民解放军总兵力只有约127万人，解放区人口约1.36亿，土地面积只占全国的24%。","毛泽东指出，蒋介石军事力量的优势和美国的援助只是临时起作用的因素，而蒋介石发动的战争的反人民性质、人心的向背则是**经常起作用的因素**，在这方面我们占着优势。","人民解放军的战争所具有的爱国的、正义的、革命的性质，必然要获得全国人民的拥护，这就是战胜蒋介石的**政治基础**。","政治协商会议达成政府组织案、国民大会案、和平建国纲领、军事问题案、宪法草案**五项协议**，确定了国会制、内阁制和省自治的政治制度。","政协会议闭幕的第二天，中共中央发出党内指示，要求全党准备为坚决实现政协协议而奋斗，同时做好进行自卫战争的准备，“**练兵、减租与生产**是目前解放区三件中心工作”。","解放战争时期建立的政权的性质是各个革命阶级的联合专政。"],"q":["考法：1946年8月毛泽东同斯特朗谈话，提出**“一切反动派都是纸老虎”**","易混：**解放战争三阶段是战略防御、战略进攻、战略决战；抗日战争三阶段是战略防御、战略相持（最重要）、战略反攻**","易混：统一战线的名称随时期而变：国民革命统一战线（大革命时期，1925—1927年）、工农民主统一战线（土地革命战争时期，1927—1937年）、抗日民族统一战线（全面抗日战争时期，1937—1945年）、**人民民主统一战线**（解放战争时期，1946—1949年）。"],"m":"","c":["sg"],"id":"1946a"},{"y":1947.38,"d":"1947年5月20日","t":"五二〇运动·第二条战线","ch":["史纲·第七章"],"p":"南京·上海·天津等地","s":"国民党统治区人民民主运动形成第二条战线","b":"国统区物价飞涨、民不聊生，各地学生举行“反饥饿、反内战、反迫害”示威游行，遭到军警镇压。","k":["毛泽东指出：中国境内已有了两条战线，**学生运动与国民党反动政府之间的尖锐斗争是第二条战线**","国民党政府派官员到原沦陷区接收时把接收变成劫收。","1948年8月法币发行额比1937年抗战前增发47万多倍，物价暴涨725万多倍，国统区陷入严重经济危机。","1946年6月23日南京下关事件，上海人民团体联合会请愿团在南京下关遭暴徒围殴5个小时，马叙伦、雷洁琼等多人受伤。","1947年2月28日台湾发生二二八起义。"],"q":["考法：第二条战线指**国统区以学生运动为先导的人民民主运动**"],"m":"","c":["sg"],"id":"1947a"},{"y":1947.49,"d":"1947年6月30日","t":"刘邓大军挺进大别山","ch":["史纲·第七章"],"p":"鲁西南→大别山","s":"揭开战略进攻的序幕","b":"经过一年作战，国民党军的全面进攻和重点进攻相继被粉碎，战争形势开始发生根本变化。","k":["刘伯承、邓小平率晋冀鲁豫野战军主力强渡黄河，**千里跃进大别山**","陈赓、谢富治兵团挺进豫西，陈毅、粟裕率华东野战军主力进入豫皖苏，三路大军在中原形成**“品”字形阵势**","**人民解放战争由战略防御转入战略进攻**"],"q":["易混：**挺进大别山＝战略进攻开始（1947年下半年）；三大战役＝战略决战（1948年秋—1949年初）**"],"m":"","c":["sg"],"id":"1947b"},{"y":1947.77,"d":"1947年10月10日","t":"《中国土地法大纲》","ch":["史纲·第七章"],"p":"河北平山西柏坡","s":"规定实行耕者有其田的土地制度","b":"1947年下半年，解放区2/3的地方已基本实现“耕者有其田”，但还有1/3的地方没有进行土地制度改革，已进行土改的地方有的也不够彻底。1947年7—9月中共中央工作委员会在西柏坡召开全国土地会议，制定《中国土地法大纲》，10月由中共中央公布。","k":["**废除封建性及半封建性剥削的土地制度，实行耕者有其田**","**按乡村人口平分土地，土地归农民所有**","解放区土改使广大农民踊跃参军支前，**为解放战争胜利奠定了雄厚的群众基础**","毛泽东指出：“如果我们能够普遍地彻底地解决土地问题，我们就获得了足以战胜一切敌人的**最基本的条件**。”","《中国土地法大纲》规定**征收富农多余土地**。","《中国土地法大纲》规定**废除一切地主的土地所有权**，废除一切乡村中在土地制度改革以前的债务。","乡村中一切地主的土地及公地**由乡村农会接收**、分配给无地或少地的农民。","《中国土地法大纲》规定保护民族工商业的发展。"],"q":["易混：**减租减息（抗战）→《五四指示》（1946）→《中国土地法大纲》（1947）→《土地改革法》（1950）**","易混：新民主主义革命时期党的土地政策总体上分两种：**消灭封建的土地制度**（土地革命战争时期、解放战争时期的土地改革政策），削弱封建的土地制度（抗日战争时期的土地政策）。","易混：《中国土地法大纲》改正了1946年五四指示中对地主照顾过多的不彻底性。"],"m":"","c":["sg"],"id":"1947c"},{"y":1947.98,"d":"1947年12月25日","t":"十二月会议·新民主主义三大经济纲领","ch":["史纲·第七章"],"p":"陕北米脂杨家沟","s":"完整提出新民主主义三大经济纲领","b":"中共中央在陕北米脂县杨家沟召开扩大会议，毛泽东作《目前形势和我们的任务》报告。","k":["**没收封建阶级的土地归农民所有**","**没收以蒋介石、宋子文、孔祥熙、陈立夫为首的垄断资本归新民主主义的国家所有**","**保护民族工商业**","毛泽东指出，中国革命已经发展到了一个**历史的转折点**：这是蒋介石20年反革命统治由发展到消灭的转折点，这是100多年来帝国主义在中国的统治由发展到消灭的转折点。","《在晋绥干部会议上的讲话》（1948）第一次完整地论述了**新民主主义革命的总路线**和总政策（无产阶级领导的，人民大众的，反对帝国主义、封建主义和官僚资本主义的革命）。","《在晋绥干部会议上的讲话》（1948）第一次把官僚资本主义、官僚资产阶级列为中国革命的对象和敌人，第一次有了“**三大对象、三座大山、三大敌人**”的说法。","《在晋绥干部会议上的讲话》（1948）提出土地改革的总路线：依靠贫农，团结中农，有步骤地、有分别地消灭封建剥削制度，发展农业生产。"],"q":["考法：**没收官僚资本具有民主革命和社会主义革命的双重性质**","考法：十二月会议所说的“转折点”是指人民解放军转入了全国规模的战略进攻，不是人民解放军占领南京，也不是战略决战时机成熟"],"m":"分地、收官、保民族","c":["sg"],"id":"1947d"},{"y":1948.7,"d":"1948年9月12日—1949年1月31日","t":"辽沈·淮海·平津三大战役","ch":["史纲·第七章"],"p":"东北·华东·华北","s":"战略决战，奠定了全国胜利的基础","b":"1948年秋人民解放军发展到280万人，解放区连成一片，中共中央决定同国民党军进行战略决战。","k":["辽沈战役（1948年9—11月）**解放东北全境**","淮海战役（1948年11月—1949年1月）以60万对80万，基本解放长江以北的华东、中原地区","平津战役（1948年11月—1949年1月）**北平和平解放，创造了“北平方式”**","三大战役**共歼灭和改编国民党军154万余人，国民党赖以维持其统治的主要军事力量基本被消灭**"],"q":["考法：解决国民党残余军队的三种方式——**天津方式（战斗解决）、北平方式（和平改编）、绥远方式（暂维原状，以后改编）**"],"m":"辽沈先打，淮海居中，平津收官","c":["sg"],"id":"1948b"},{"y":1949.2,"d":"1949年3月5—13日","t":"七届二中全会","ch":["史纲·第七章"],"p":"河北平山西柏坡","s":"为新中国的建立作了政治上、思想上的准备","b":"在全国胜利前夕，党在西柏坡召开七届二中全会，规划胜利后的建国方针。","k":["**党的工作重心由乡村移到城市，开始由城市到乡村并由城市领导乡村的时期**","提出**使中国稳步地由农业国转变为工业国、由新民主主义国家转变为社会主义国家**的发展方向","指出全国胜利后，国内的基本矛盾是**工人阶级和资产阶级的矛盾**，国外的基本矛盾是中国和帝国主义国家的矛盾","**提出“两个务必”：务必使同志们继续地保持谦虚、谨慎、不骄、不躁的作风，务必使同志们继续地保持艰苦奋斗的作风**","全会规定了党在全国胜利后在政治、经济、外交方面应当采取的基本政策，**提出“另起炉灶”的方针，同时正式确立“打扫干净屋子再请客”的外交方针**","毛泽东告诫全党，夺取全国胜利，这只是**万里长征走完了第一步**，中国革命以后的道路更长，工作更伟大，更艰苦","1948年9月，中共中央政治局会议上毛泽东论述了即将成立的新中国的国体和政体：“我们政权的阶级性是这样：**无产阶级领导的，以工农联盟为基础**，但不是仅仅工农，还有资产阶级民主分子参加的人民民主专政。”","毛泽东指出，不必搞资产阶级的议会制和三权分立，应当“建立**民主集中制的各级人民代表会议制度**”。","毛泽东指出，在胜利面前必须警惕资产阶级的“**糖衣炮弹**”的攻击。"],"q":["考法：1949年3月23日党中央离开西柏坡前往北平，毛泽东称之为**“进京赶考”**"],"m":"","c":["sg"],"id":"1949a"},{"y":1949.31,"d":"1949年4月21—23日","t":"渡江战役·南京解放","ch":["史纲·第七章"],"p":"长江中下游·南京","s":"宣告国民党反动统治的覆灭","b":"国民党政府拒绝在《国内和平协定》上签字，国共和谈破裂。","k":["4月21日毛泽东、朱德发布**《向全国进军的命令》**，人民解放军在千里战线上强渡长江","**4月23日南京解放，延续22年的国民党反动统治宣告覆灭**","1月14日毛泽东发表关于时局的声明，提出惩办战争罪犯、废除伪宪法和伪法统、改编一切反动军队等八项和平条件，谈判4月1日开始，因国民党政府拒绝在国内和平协定上签字而破裂。"],"q":["考法：毛泽东《七律·人民解放军占领南京》——**“宜将剩勇追穷寇，不可沽名学霸王”**"],"m":"","c":["sg"],"id":"1949b"},{"y":1949.5,"d":"1949年6月30日","t":"《论人民民主专政》","ch":["史纲·第七章"],"p":"北平","s":"系统论述人民民主专政理论，为新中国奠定理论基础","b":"新中国成立前夕，毛泽东发表《论人民民主专政》，总结新民主主义革命的基本经验，阐明新中国的国家性质。","k":["提出人民民主专政的概念：**工人阶级（经过共产党）领导的、以工农联盟为基础的人民民主专政**","提出团结民族资产阶级，利用一切于国计民生有利的城乡资本主义因素","**提出建国后“一边倒”的外交方针**","人民民主专政的基础是工人阶级、农民阶级和城市小资产阶级的联盟，而主要是工人和农民的联盟，因为这两个阶级占了中国人口的**80%—90%**。","进行中国人民革命和发展中国经济，需要团结民族资产阶级，但它**不能充当革命的领导者**，也不应当在国家政权中占主要的地位。"],"q":["易混：《将革命进行到底》（1948）第一次公开使用人民民主专政概念；《论人民民主专政》（1949）系统论述人民民主专政理论"],"m":"","c":["sg"],"id":"1949e"},{"y":1949.73,"d":"1949年9月21—30日","t":"新政协·《共同纲领》","ch":["史纲·第七章"],"p":"北平","s":"完成了建立新中国的各项准备","b":"1948年中共中央发布“五一口号”，号召召开新的政治协商会议，各民主党派和无党派民主人士热烈响应，走上与共产党合作的道路。1949年6月毛泽东发表《论人民民主专政》。","k":["中国人民政治协商会议第一届全体会议**代行全国人民代表大会的职权**","通过《中国人民政治协商会议共同纲领》，**起临时宪法的作用，规定新中国实行人民民主专政**","选举毛泽东为中央人民政府主席；定都北平并改名北京，**以五星红旗为国旗，以《义勇军进行曲》为代国歌**，采用公元纪年","1948年4月30日中共中央“五一口号”提出迅速召开政治协商会议、成立民主联合政府，**揭开了中国共产党同各党派、各团体、各族各界人士协商建国的序幕，奠定了中国共产党领导的多党合作和政治协商制度的基础**","抗日战争胜利后，某些民主党派的领导人鼓吹“中间路线”，企图在国共对立的纲领之外寻找**第三条道路**，主张走和平改良的道路。","他们所提倡的实质上是**资产阶级共和国的方案**、旧民主主义的道路。","1949年春，毛泽东提出民主党派应“**积极参政，共同建设新中国**”，标志着民主党派地位的根本变化：它们不再是旧中国反动政权下的在野党，而将在中国共产党领导下共同担负起管理国家和建设新中国的历史重任。","《共同纲领》成为中国人民的**大宪章**。","政协第一届全体会议确立“以公私兼顾、劳资两利，城乡互助、内外交流”的经济建设方针（即“**四面八方**”）。"],"q":["易混：1949年新政协代行人大职权、通过《共同纲领》；1954年第一届全国人大才通过第一部《中华人民共和国宪法》","易混：“占人类总数四分之一的中国人从此站起来了”出自政协第一届全体会议开幕词（9月21日），不是开国大典","**易混：人民政协是中国共产党领导的以工农联盟为基础的人民民主统一战线的组织形式（不是国家机关）**","易混：新政协的召开**标志着中国共产党领导的多党合作和政治协商制度正式确立，标志着爱国统一战线和全国人民大团结在组织上完全形成**"],"m":"","c":["sg"],"id":"1949c"},{"y":1949.75,"d":"1949年10月1日","t":"中华人民共和国成立","ch":["史纲·第八章"],"p":"北京天安门","s":"新民主主义革命取得伟大胜利","b":"10月1日下午，开国大典在北京天安门广场隆重举行，毛泽东宣告中华人民共和国中央人民政府成立。","k":["**结束了一百多年来中国被侵略被奴役的屈辱历史，真正实现了民族独立**","**中国人民从此站起来了，成为国家、社会和自己命运的主人**","实现了**从几千年封建专制政治向人民民主的伟大飞跃**","**为实现中华民族伟大复兴创造了根本社会条件**","近代中国的历史经验表明，**没有无产阶级及其政党——中国共产党的坚强领导**，中国人民革命的胜利是不可能的。","中国共产党之所以能够把革命引向胜利，一条重要的经验就是必须坚持把马克思列宁主义基本原理同中国具体实际结合起来，必须不断**推进马克思主义中国化**的事业。","建国初期实行**一边倒、另起炉灶、打扫干净屋子再请客**三大外交政策。"],"q":["考法：**新中国成立标志着半殖民地半封建社会的结束和新民主主义社会的建立**，中国进入从新民主主义向社会主义过渡的时期"],"m":"","c":["sg"],"id":"1949d"},{"y":1950.49,"d":"1950年6月28日","t":"《中华人民共和国土地改革法》","ch":["史纲·第八章"],"p":"新解放区","s":"在新解放区彻底废除封建土地制度；这次土改是我国历史上规模最大、历次土改运动中进行得最好的一次","b":"新中国成立时，占全国人口多数的新解放区还没有进行土地改革。1950年6月中央人民政府公布《土地改革法》，规定这次土改的目的是废除地主阶级封建剥削的土地所有制，实行农民的土地所有制，解放农村生产力，发展农业生产，为新中国的工业化开辟道路。","k":["**废除地主阶级封建剥削的土地所有制，实行农民的土地所有制**","**由征收富农多余土地改为保存富农经济，以孤立地主、保护中农**","到1952年底，除部分少数民族地区外，全国基本完成土改，延续两千多年的**封建土地制度被彻底摧毁**","1950年6月召开的中共七届三中全会确定，当时全党和全国人民的中心任务是要在3年左右的时间内，争取国家财政经济状况的基本好转。"],"q":["**易混：《中国土地法大纲》（1947）征收富农多余土地财产；《土地改革法》（1950）保存富农经济**"],"m":"","c":["sg"],"id":"1950a"},{"y":1950.8,"d":"1950年10月19日","t":"抗美援朝战争","ch":["史纲·第八章"],"p":"朝鲜半岛","s":"打出了国威军威，赢得了和平建设的环境","b":"1950年6月朝鲜内战爆发，美国出兵干涉并派第七舰队侵入台湾海峡；美军越过三八线，战火烧到鸭绿江边。应朝鲜请求，党中央作出抗美援朝、保家卫国的决策。","k":["10月19日中国人民志愿军跨过鸭绿江，10月25日打响第一仗，后定为抗美援朝纪念日","1953年7月27日朝鲜停战协定签字","抗美援朝战争有力地打破了美国军队不可战胜的神话，人民军队战斗力威震世界。"],"q":["**考法：抗美援朝战争伟大胜利，是中国人民站起来后屹立于世界东方的宣言书**"],"m":"","c":["sg"],"id":"1950b"},{"y":1953.45,"d":"1953年6月15日","t":"过渡时期总路线·“一五”计划","ch":["史纲·第八章"],"p":"全国","s":"“一化三改”：社会主义建设与社会主义改造同时并举","b":"1952年底国民经济恢复任务基本完成。1953年6月毛泽东在中央政治局会议上提出过渡时期总路线，同年底正式向全党全国公布。","k":["**在一个相当长的时期内，逐步实现国家的社会主义工业化，并逐步实现对农业、手工业和资本主义工商业的社会主义改造**","主体是社会主义工业化，两翼是三大改造，体现了发展生产力与变革生产关系的有机统一","**1953年开始实施第一个五年计划，以156个建设项目为中心进行工业建设，1957年超额完成**","一五计划确定的经济建设指导方针突出的核心要点是集中主要力量发展重工业，建立国家工业化和国防现代化的初步基础。","新民主主义社会的五种经济成分：**国营经济、合作社经济、个体经济、私人资本主义经济、国家资本主义经济**；其中处于十字路口的经济成分是个体经济。"],"q":["**易混：1953年过渡时期总路线（一化三改）vs 1958年社会主义建设总路线（鼓足干劲、力争上游、多快好省）**","最初设想是先完成工业化、然后进行社会主义改造，新的认识变为工业化建设和社会主义改造同时进行。"],"m":"一化三改，一体两翼","c":["sg"],"id":"1953a"},{"y":1954.71,"d":"1954年9月15日","t":"第一届全国人大·“五四宪法”","ch":["史纲·第八章"],"p":"北京","s":"人民代表大会制度在全国范围内建立","b":"第一届全国人民代表大会第一次会议在北京召开。","k":["**通过《中华人民共和国宪法》，这是我国第一部社会主义类型的宪法**","**人民代表大会制度成为我国的根本政治制度**"],"q":["**易混：根本政治制度＝人民代表大会制度；基本政治制度＝中国共产党领导的多党合作和政治协商制度、民族区域自治制度、基层群众自治制度**"],"m":"","c":["sg"],"id":"1954a"},{"y":1956.32,"d":"1956年4月25日","t":"《论十大关系》","ch":["史纲·第八章"],"p":"北京","s":"以毛泽东为主要代表的中国共产党人开始探索中国自己的社会主义建设道路的标志，是党探索中国社会主义建设道路的良好开端","b":"苏共二十大暴露了苏联模式的问题。毛泽东用一个多月时间听取国务院34个部门的汇报后，在中央政治局扩大会议上作报告。","k":["**提出“以苏为鉴”，强调把马克思列宁主义基本原理同中国具体实际进行“第二次结合”**","**基本方针：调动一切积极因素为社会主义事业服务**","**提出以农业为基础、以工业为主导，以农轻重为序发展国民经济的总方针**","**提出一整套“两条腿走路”的方针：重工业和轻工业、中央工业和地方工业、沿海工业和内地工业、大型企业和小型企业同时并举**","《论十大关系》论述的**第一大关系是重工业、轻工业和农业的关系**。"],"q":["**易混：“双百”方针针对科学文化工作；“长期共存、互相监督”针对共产党与民主党派的关系**","易混：**把马克思列宁主义基本原理同中国具体实际进行“第二次结合”是1956年4月《论十大关系》提出的，不是中共八大提出的**；《论十大关系》为同年9月中共八大的召开作了理论准备"],"m":"","c":["sg"],"id":"1956a"},{"y":1956.71,"d":"1956年9月15日","t":"中共八大","ch":["史纲·第八章"],"p":"北京","s":"为全面建设社会主义指明了方向","b":"社会主义改造即将基本完成，党在执政条件下召开第一次全国代表大会。","k":["**国内主要矛盾已经是人民对于建立先进的工业国的要求同落后的农业国的现实之间的矛盾，是人民对于经济文化迅速发展的需要同当前经济文化不能满足人民需要的状况之间的矛盾**","**党和人民的主要任务是集中力量发展社会生产力，尽快把我国从落后的农业国变为先进的工业国**","**经济建设方针：既反保守又反冒进，在综合平衡中稳步前进**","陈云提出“**三个主体、三个补充**”的设想","中共八大通过了中国共产党在全国执政以后制定的**第一部党章**。"],"q":["**易混：主要矛盾表述——八大（1956）；1981年历史决议“人民日益增长的物质文化需要同落后的社会生产之间的矛盾”；十九大（2017）“人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾”**","易混：“第二次结合”是《论十大关系》（1956年4月）提出的，不是八大提出的；1958年社会主义建设总路线是八大二次会议通过的，不是八大"],"m":"","c":["sg"],"id":"1956b"},{"y":1956.96,"d":"1956年底","t":"三大改造基本完成·社会主义基本制度确立","ch":["史纲·第八章"],"p":"全国","s":"我国进入社会主义初级阶段","b":"1955年下半年起农业合作化迅速推进，带动手工业和资本主义工商业改造形成高潮；1956年初出现全行业公私合营高潮。","k":["**农业：互助组（社会主义萌芽）→ 初级社（半社会主义）→ 高级社（完全社会主义），坚持自愿互利、典型示范、国家帮助**","**资本主义工商业：和平赎买，经过国家资本主义由初级形式（加工订货、统购包销、经销代销）到高级形式（公私合营），全行业公私合营后实行“定息”**","**社会主义基本制度的确立，是中国历史上最深刻最伟大的社会变革，为当代中国一切发展进步奠定了根本政治前提和制度基础**","不足：1955年夏季以后要求过急，工作过粗，改变过快，形式过于简单划一","初级农业生产合作社以土地入股和统一经营为特点，实行集体劳动，产品分配采取**按劳分配和土地入股分红相结合**。","高级农业生产合作社实行生产资料农民集体所有、按劳付酬，**取消土地分红**。"],"q":["**易混：个别企业公私合营时利润按“四马分肥”分配（国家所得税、企业公积金、工人福利费、资方红利）；全行业公私合营后改为“定息”**"],"m":"","c":["sg"],"id":"1956c"},{"y":1957.16,"d":"1957年2月27日","t":"《关于正确处理人民内部矛盾的问题》","ch":["史纲·第八章"],"p":"北京","s":"把正确处理人民内部矛盾作为国家政治生活的主题","b":"1956年国际上发生波匈事件，国内也出现少数人闹事的情况。毛泽东在最高国务会议上讲话，6月经整理后公开发表。","k":["**社会主义社会的基本矛盾仍然是生产关系和生产力、上层建筑和经济基础之间的矛盾，它们既相适应又相矛盾，可以通过社会主义制度本身不断得到解决**","**严格区分敌我矛盾和人民内部矛盾两类不同性质的矛盾：前者用专政的方法，后者用民主的方法（团结—批评—团结）**","同年整风运动中开展的反右派斗争被严重扩大化，造成了不幸的后果","**解决人民内部矛盾的各领域方针：科学文化领域实行“百花齐放、百家争鸣”，民族之间实行民族平等、团结互助，共产党和民主党派之间实行“长期共存、互相监督”**"],"q":["**考法：处理人民内部矛盾的方法——政治思想领域“团结—批评—团结”，物质利益分配“统筹兼顾、适当安排”**","**易混：“长期共存、互相监督、肝胆相照、荣辱与共”十六字方针是十二大增加的，不是毛泽东提出的；毛泽东提出的是“长期共存、互相监督”八字方针**","易混：敌我矛盾是分清敌我的问题，人民内部矛盾是分清是非的问题；解决前者用专政的方法，解决后者用民主的方法。"],"m":"","c":["sg"],"id":"1957a"},{"y":1958.34,"d":"1958年5月5日","t":"社会主义建设总路线·“大跃进”·人民公社化运动","ch":["史纲·第八章"],"p":"全国","s":"急于求成的严重失误","b":"八大二次会议正式通过“鼓足干劲、力争上游、多快好省地建设社会主义”的总路线，随后全国掀起“大跃进”和人民公社化运动。","k":["**以高指标、瞎指挥、浮夸风和“共产风”为主要标志的“左”倾错误严重泛滥**","**人民公社“一大二公”，搞平均主义和无偿调拨**","1958年5月，党的八大二次会议通过“鼓足干劲、力争上游、多快好省地建设社会主义”的总路线，反映了广大人民群众迫切要求改变国家经济文化落后状况的普遍愿望，但**忽视了客观的经济规律**。"],"q":[],"m":"","c":["sg"],"id":"1958a"},{"y":1962.03,"d":"1962年1月11日—2月7日","t":"七千人大会·国民经济调整","ch":["史纲·第八章"],"p":"北京","s":"初步总结“大跃进”以来的经验教训","b":"1961年1月八届九中全会正式通过对国民经济实行“调整、巩固、充实、提高”的八字方针。","k":["**1962年初扩大的中央工作会议（七千人大会）开展批评与自我批评，发扬党内民主**","以1961年1月中共八届九中全会为起点，我国社会主义建设开始从“大跃进”轨道转入全面调整。"],"q":["**易混：八字方针是“调整、巩固、充实、提高”，不要与1979年的“调整、改革、整顿、提高”混淆**"],"m":"","c":["sg"],"id":"1962a"},{"y":1964.79,"d":"1964年10月16日、12月21日","t":"第一颗原子弹爆炸·明确“四个现代化”","ch":["史纲·第八章"],"p":"新疆罗布泊·北京","s":"社会主义建设取得重大成就，明确现代化目标","b":"1964年10月16日我国第一颗原子弹爆炸成功；12月三届全国人大一次会议召开。","k":["**周恩来在政府工作报告中提出，在不太长的历史时期内，把我国建设成为具有现代农业、现代工业、现代国防和现代科学技术的社会主义强国**","提出**“两步走”**设想：先建立一个独立的比较完整的工业体系和国民经济体系，再全面实现四个现代化"],"q":["**易混：1954年一届全国人大提出工业、农业、交通运输业和国防现代化；1964年三届全国人大一次会议明确农业、工业、国防和科学技术现代化目标**"],"m":"","c":["sg"],"id":"1964a"},{"y":1966.37,"d":"1966年5月16日—1976年10月","t":"“文化大革命”","ch":["史纲·第八章"],"p":"全国","s":"一场给党、国家和各族人民带来严重灾难的内乱","b":"1966年5月中央政治局扩大会议通过《五一六通知》，8月八届十一中全会通过《关于无产阶级文化大革命的决定》，“文化大革命”全面发动。","k":["**1981年历史决议指出：“文化大革命”是一场由领导者错误发动，被反革命集团利用，给党、国家和各族人民带来严重灾难的内乱**","**1976年10月中央政治局执行党和人民的意志，一举粉碎“四人帮”，结束了“文化大革命”**"],"q":["**易混：“文化大革命”不是也不可能是任何意义上的革命或社会进步；要把毛泽东晚年的错误同经过长期历史检验形成为科学理论的毛泽东思想区别开来**"],"m":"","c":["sg"],"id":"1966a"},{"y":1971.82,"d":"1971年10月25日","t":"恢复联合国合法席位·外交新局面","ch":["史纲·第八章"],"p":"美国纽约·北京","s":"外交工作打开新局面","b":"中国国际地位不断提高，许多亚非拉国家支持恢复新中国在联合国的合法权利。","k":["**1971年10月第26届联合国大会通过第2758号决议，恢复中华人民共和国在联合国的一切合法权利**","**1972年2月美国总统尼克松访华，中美发表《联合公报》（上海公报）；1979年1月1日中美正式建交**","**1972年9月中日两国建交；1974年毛泽东提出划分“三个世界”的战略思想**"],"q":["中间地带、三个世界划分都是毛泽东提出的，不要和邓小平混淆。"],"m":"","c":["sg"],"id":"1971a"},{"y":1978.36,"d":"1978年5月11日","t":"真理标准问题大讨论","ch":["史纲·第九章"],"p":"北京","s":"一场马克思主义的思想解放运动","b":"粉碎“四人帮”后，“两个凡是”（凡是毛主席作出的决策都坚决维护，凡是毛主席的指示都始终不渝地遵循）的方针严重束缚人们的思想。","k":["**《光明日报》发表特约评论员文章《实践是检验真理的唯一标准》，引发全国范围的大讨论**","**冲破了“两个凡是”的严重束缚，为十一届三中全会的召开作了思想准备**","**为重新确立解放思想、实事求是的思想路线奠定了基础**"],"q":[],"m":"","c":["sg"],"id":"1978a"},{"y":1978.9,"d":"1978年11月24日起","t":"农村改革·家庭联产承包责任制","ch":["史纲·第九章"],"p":"安徽凤阳小岗村等","s":"经济体制改革首先在农村取得突破","b":"1978年11月，安徽省凤阳县小岗村开创了家庭联产承包责任制的先河，农民自发实行包产到户、包干到户。","k":["**1982年1月1日，党历史上第一个关于农村工作的一号文件正式出台，明确指出包产到户、包干到户都是社会主义集体经济的生产责任制**","**家庭联产承包责任制的实质是打破人民公社体制下土地集体所有、集体经营的旧的农业耕作模式，实现土地集体所有权和经营权的分离，确立土地集体所有制基础上以户为单位的家庭承包经营的新型农业耕作模式**","家庭联产承包责任制在全国普遍推行，**人民公社体制随之废除**"],"q":["考法：改革从农村开始，1984年十二届三中全会后改革重点转向城市"],"m":"","c":["sg"],"id":"1978c"},{"y":1978.97,"d":"1978年12月18—22日","t":"十一届三中全会","ch":["史纲·第九章"],"p":"北京","s":"新中国成立以来党的历史上具有深远意义的伟大转折","b":"全会前召开的中央工作会议上，邓小平作《解放思想，实事求是，团结一致向前看》讲话，实际上成为全会的主题报告。","k":["**重新确立了解放思想、实事求是的思想路线**","**停止使用“以阶级斗争为纲”的错误口号，作出把党和国家工作中心转移到经济建设上来、实行改革开放的历史性决策**","**开启了改革开放和社会主义现代化建设新时期，实际上形成了以邓小平为核心的党的第二代中央领导集体**","提出实现民主制度化、法律化的任务，决定健全党的民主集中制，健全党规党法，严肃党纪；增选中央领导机构成员，成立中央纪律检查委员会","《解放思想，实事求是，团结一致向前看》是解放思想、开辟新时期新道路、开创中国特色社会主义新理论的**宣言书**。","十一届三中全会是新中国成立以来党的历史上具有深远意义的**伟大转折**，标志着中国共产党从根本上冲破了长期“左”倾错误的严重束缚。"],"q":["**考法：十一届三中全会是中国特色社会主义理论体系形成发展的起点**","**易混：科学评价毛泽东并概括毛泽东思想的科学体系和活的灵魂，是1981年十一届六中全会《关于建国以来党的若干历史问题的决议》，不是十一届三中全会**"],"m":"伟大转折：思想路线、工作中心、改革开放","c":["sg"],"id":"1978b"},{"y":1979.24,"d":"1979年3月30日","t":"坚持四项基本原则","ch":["史纲·第九章"],"p":"北京","s":"立国之本","b":"改革开放初期，社会上出现怀疑和否定社会主义道路、党的领导等错误思潮。邓小平在党的理论工作务虚会上作《坚持四项基本原则》讲话。","k":["**必须坚持社会主义道路，坚持无产阶级专政（人民民主专政），坚持共产党的领导，坚持马列主义、毛泽东思想**","**四项基本原则是立国之本，改革开放是强国之路**","**邓小平首次提出“四项基本原则”的概念，指出坚持四项基本原则“是实现四个现代化的根本前提”**"],"q":["易混：四项基本原则是1979年3月理论工作务虚会首次提出的，不是在1978年十一届三中全会上提出的。"],"m":"","c":["sg"],"id":"1979a"},{"y":1980.65,"d":"1980年8月26日","t":"设立经济特区","ch":["史纲·第九章"],"p":"深圳·珠海·汕头·厦门","s":"对外开放迈出重要步伐","b":"1979年7月中央决定对广东、福建两省实行特殊政策和灵活措施；1980年决定在深圳、珠海、汕头、厦门试办经济特区，8月26日深圳经济特区正式成立。","k":["1984年开放大连、上海等14个沿海港口城市；1988年设立海南省并建立经济特区；1990年**开发开放上海浦东**","**逐步形成经济特区—沿海开放城市—沿海经济开放区—沿江和内陆开放城市—沿边开放城市的全方位对外开放格局**"],"q":[],"m":"","c":["sg"],"id":"1980a"},{"y":1981.49,"d":"1981年6月27日","t":"第二个历史决议","ch":["史纲·第九章"],"p":"北京","s":"党在指导思想上完成了拨乱反正","b":"十一届六中全会通过《关于建国以来党的若干历史问题的决议》。","k":["**彻底否定“文化大革命”的理论和实践**","**实事求是地评价毛泽东的历史地位：他的功绩是主要的，错误是次要的**","**科学论述了毛泽东思想，概括了贯穿其中的立场、观点和方法——毛泽东思想活的灵魂：实事求是、群众路线、独立自主**","**对我国社会主义主要矛盾作了规范表述：人民日益增长的物质文化需要同落后的社会生产之间的矛盾**","**第一次提出我国社会主义制度还处于初级的阶段**","提出“**计划经济为主、市场调节为辅**”的方针","《决议》标志着党在指导思想上**拨乱反正的胜利完成**。"],"q":["**易混：三个历史决议——1945年《关于若干历史问题的决议》、1981年《关于建国以来党的若干历史问题的决议》、2021年《中共中央关于党的百年奋斗重大成就和历史经验的决议》**","**考法：《决议》解决了两个相互联系的重大历史课题：一是科学评价毛泽东的历史地位和毛泽东思想的科学体系，二是根据新的实际和发展要求实行改革开放、确立中国社会主义现代化建设正确道路**"],"m":"活的灵魂：实事求是、群众路线、独立自主","c":["sg"],"id":"1981a"},{"y":1982.67,"d":"1982年9月1日","t":"中共十二大","ch":["史纲·第九章"],"p":"北京","s":"第一次明确提出“建设有中国特色的社会主义”","b":"邓小平在大会开幕词中总结历史经验。","k":["**提出“把马克思主义的普遍真理同我国的具体实际结合起来，走自己的道路，建设有中国特色的社会主义”**","提出到20世纪末力争使全国工农业年总产值**翻两番**的目标","同年12月五届全国人大五次会议通过现行宪法（“八二宪法”）"],"q":["易混：邓小平理论主题形成于十二大，轮廓形成于十三大，走向成熟于南方谈话，“邓小平理论”正式提出于十五大并写入党章"],"m":"","c":["sg"],"id":"1982a"},{"y":1984.81,"d":"1984年10月20日","t":"十二届三中全会·经济体制改革决定","ch":["史纲·第九章"],"p":"北京","s":"改革重点由农村转向城市","b":"全会通过《中共中央关于经济体制改革的决定》。","k":["**提出社会主义经济是公有制基础上的有计划的商品经济，突破了把计划经济同商品经济对立起来的传统观念**"],"q":["**易混：改革目标的演进——计划经济为主、市场调节为辅（十二大）→ 有计划的商品经济（1984）→ 社会主义市场经济体制（1992年十四大）**"],"m":"","c":["sg"],"id":"1984a"},{"y":1987.82,"d":"1987年10月25日","t":"中共十三大","ch":["史纲·第九章"],"p":"北京","s":"系统阐述社会主义初级阶段理论","b":"大会召开时，改革开放已经进行了将近十年。","k":["**我国正处在并将长期处在社会主义初级阶段：一是我国已经是社会主义社会，二是我国的社会主义社会还处在初级阶段**","**概括党在社会主义初级阶段的基本路线：以经济建设为中心，坚持四项基本原则，坚持改革开放（“一个中心、两个基本点”）**","提出“三步走”发展战略：第一步从1981年到1990年，国民生产总值翻一番，解决人民的温饱问题；第二步从1991年到20世纪末，国民生产总值再翻一番，人民生活达到小康水平；第三步到21世纪中叶，国民生产总值再翻两番，人民生活比较富裕，基本实现现代化","**第一次对中国特色社会主义理论进行系统的概括，标志着邓小平理论轮廓的形成**"],"q":["**易混：社会主义初级阶段特指我国从1956年生产资料私有制的社会主义改造基本完成到社会主义现代化基本实现的整个历史阶段**"],"m":"一个中心、两个基本点；三步走","c":["sg"],"id":"1987a"},{"y":1992.05,"d":"1992年1月18日—2月21日","t":"邓小平南方谈话","ch":["史纲·第九章"],"p":"武昌·深圳·珠海·上海","s":"又一个解放思想、实事求是的宣言书","b":"东欧剧变、苏联解体前后，一些人对改革开放产生了姓“资”姓“社”的疑问。邓小平视察南方并发表重要谈话。","k":["**计划多一点还是市场多一点，不是社会主义与资本主义的本质区别，计划和市场都是经济手段**","**社会主义的本质：解放生产力，发展生产力，消灭剥削，消除两极分化，最终达到共同富裕**","**判断标准：是否有利于发展社会主义社会的生产力，是否有利于增强社会主义国家的综合国力，是否有利于提高人民的生活水平（“三个有利于”）**","**“发展才是硬道理”**"],"q":["**考法：南方谈话和十四大标志着邓小平理论走向成熟**"],"m":"三个有利于，发展是硬道理","c":["sg"],"id":"1992a"},{"y":1992.78,"d":"1992年10月12日","t":"中共十四大","ch":["史纲·第九章"],"p":"北京","s":"确立社会主义市场经济体制的改革目标","b":"在南方谈话精神推动下，改革开放和现代化建设进入新的阶段。","k":["**明确我国经济体制改革的目标是建立社会主义市场经济体制**","**确立邓小平建设有中国特色社会主义理论在全党的指导地位**"],"q":["**易混：十四大称“邓小平建设有中国特色社会主义理论”；十五大正式使用“邓小平理论”并确立为党的指导思想**","**考法：以邓小平南方谈话和党的十四大为标志，改革开放和现代化建设事业进入从计划经济体制向社会主义市场经济体制转变的新阶段**"],"m":"","c":["sg"],"id":"1992b"},{"y":1997.5,"d":"1997年7月1日、1999年12月20日","t":"香港、澳门回归祖国","ch":["史纲·第九章"],"p":"香港·澳门","s":"“一国两制”的成功实践","b":"“一国两制”构想最初为解决台湾问题提出，首先运用于解决香港、澳门问题。1984年中英、1987年中葡分别签署关于香港、澳门问题的联合声明。","k":["**1997年7月1日中国政府恢复对香港行使主权，1999年12月20日恢复对澳门行使主权**","**实行“港人治港”“澳人治澳”、高度自治**","要坚定落实爱国者治港、爱国者治澳原则，把特别行政区管治权牢牢掌握在爱国者手中。"],"q":["**考法：“一国两制”的前提是一个中国；台湾问题是中国的内政**","一国两制构想最早是针对台湾问题提出来的，后来被率先运用于解决香港和澳门问题；香港、澳门问题是历史上殖民主义侵略遗留下来的问题，台湾问题是国内战争遗留下来的问题，两者性质不同。"],"m":"","c":["sg"],"id":"1997a"},{"y":1997.7,"d":"1997年9月12日","t":"中共十五大","ch":["史纲·第九章"],"p":"北京","s":"把邓小平理论确立为党的指导思想","b":"邓小平于1997年2月逝世，党的十五大高举邓小平理论伟大旗帜。","k":["**正式使用“邓小平理论”的科学称谓，确立为党的指导思想并写入党章**","**明确公有制为主体、多种所有制经济共同发展是社会主义初级阶段的基本经济制度**","**提出依法治国、建设社会主义法治国家的基本方略**","非公有制经济是我国社会主义市场经济的**重要组成部分**"],"q":["**考法：邓小平理论的首要基本理论问题是“什么是社会主义、怎样建设社会主义”，精髓是解放思想、实事求是**"],"m":"","c":["sg"],"id":"1997b"},{"y":2000.15,"d":"2000年2月25日","t":"提出“三个代表”重要思想","ch":["史纲·第九章"],"p":"广东","s":"回答“建设什么样的党、怎样建设党”","b":"江泽民在广东考察时首次全面提出；2001年“七一”讲话作了系统阐述。","k":["**中国共产党始终代表中国先进生产力的发展要求，始终代表中国先进文化的前进方向，始终代表中国最广大人民的根本利益**","三个代表是我们党的立党之本、执政之基、力量之源，贯彻三个代表重要思想，关键在坚持与时俱进，核心在坚持党的先进性，本质在坚持执政为民。","发展是党执政兴国的第一要务，改革是动力、发展是目的、稳定是前提，实施引进来和走出去相结合的对外开放战略。"],"q":["**易混：邓小平理论——什么是社会主义、怎样建设社会主义；“三个代表”——建设什么样的党、怎样建设党；科学发展观——实现什么样的发展、怎样发展**"],"m":"生产力、先进文化、根本利益","c":["sg"],"id":"2000a"},{"y":2001.95,"d":"2001年12月11日","t":"加入世界贸易组织","ch":["史纲·第九章"],"p":"瑞士日内瓦·北京","s":"对外开放进入新阶段","b":"经过约15年的谈判，中国正式成为世贸组织成员。","k":["**标志着我国对外开放进入在更大范围、更宽领域、更深层次上参与经济全球化的新阶段**"],"q":[],"m":"","c":["sg"],"id":"2001a"},{"y":2002.85,"d":"2002年11月8日","t":"中共十六大","ch":["史纲·第九章"],"p":"北京","s":"把“三个代表”重要思想确立为党的指导思想","b":"新世纪召开的第一次党的全国代表大会。","k":["**确立“三个代表”重要思想为党的指导思想并写入党章**","**提出在21世纪头二十年全面建设惠及十几亿人口的更高水平的小康社会**","**提出“两个毫不动摇”：毫不动摇地巩固和发展公有制经济，毫不动摇地鼓励、支持和引导非公有制经济发展**"],"q":["易混：十六大“全面建设小康社会”；十八大改为“全面建成小康社会”"],"m":"","c":["sg"],"id":"2002a"},{"y":2007.79,"d":"2007年10月15日","t":"中共十七大","ch":["史纲·第九章"],"p":"北京","s":"把科学发展观写入党章","b":"改革开放即将走过三十年，大会全面总结了改革开放的宝贵经验。","k":["**第一次明确提出“中国特色社会主义理论体系”，包括邓小平理论、“三个代表”重要思想以及科学发展观等重大战略思想**","科学发展观的第一要义是推动经济社会发展，核心立场是以人为本，基本要求是全面协调可持续，根本方法是统筹兼顾。"],"q":["考法：中国特色社会主义道路、理论体系在十七大提出；十八大加上制度；十九大加上文化"],"m":"","c":["sg"],"id":"2007a"},{"y":2012.86,"d":"2012年11月8日","t":"中共十八大","ch":["史纲·第十章"],"p":"北京","s":"中国特色社会主义进入新时代的起点","b":"大会之后，十八届一中全会选举习近平为中共中央总书记。","k":["**把科学发展观同马克思列宁主义、毛泽东思想、邓小平理论、“三个代表”重要思想一道，确立为党必须长期坚持的指导思想**","**提出“五位一体”总体布局：经济建设、政治建设、文化建设、社会建设、生态文明建设**","提出道路自信、理论自信、制度自信；**倡导富强、民主、文明、和谐，自由、平等、公正、法治，爱国、敬业、诚信、友善的社会主义核心价值观**","2012年11月29日习近平在参观《复兴之路》展览时阐释了实现中华民族伟大复兴的**中国梦**","**提出“两个百年”奋斗目标：在中国共产党成立一百年时全面建成小康社会，在新中国成立一百年时建成富强民主文明和谐的社会主义现代化国家**"],"q":["易混：“三个自信”（十八大）→ 增加文化自信，形成“四个自信”（2016年“七一”讲话）"],"m":"","c":["sg"],"id":"2012a"},{"y":2013.68,"d":"2013年9月7日—11月12日","t":"全面深化改革·“一带一路”倡议","ch":["史纲·第十章"],"p":"北京·哈萨克斯坦·印度尼西亚","s":"开启全面深化改革和全方位对外开放新局面","b":"2013年9月、10月，习近平出访哈萨克斯坦和印度尼西亚时，先后提出共建“丝绸之路经济带”和“21世纪海上丝绸之路”。","k":["11月十八届三中全会通过《中共中央关于全面深化改革若干重大问题的决定》","**全面深化改革的总目标是完善和发展中国特色社会主义制度，推进国家治理体系和治理能力现代化**","**使市场在资源配置中起决定性作用和更好发挥政府作用**","此后形成“四个全面”战略布局：**全面建设社会主义现代化国家（原为全面建成小康社会）、全面深化改革、全面依法治国、全面从严治党**"],"q":["易混：市场的作用——“基础性作用”（十四大）→“决定性作用”（十八届三中全会）","**易混：十八届三中全会也是划时代的，但“开启改革开放和社会主义现代化建设新时期”是十一届三中全会，“确定建立社会主义市场经济体制”是十四大，不要张冠李戴**"],"m":"","c":["sg"],"id":"2013a"},{"y":2015.82,"d":"2015年10月26日","t":"十八届五中全会·新发展理念","ch":["史纲·第十章"],"p":"北京","s":"提出创新、协调、绿色、开放、共享的新发展理念","b":"我国经济发展进入新常态，需要用新的发展理念引领发展方式转变。","k":["创新是引领发展的第一动力，协调是持续健康发展的内在要求，绿色是永续发展的必要条件，开放是国家繁荣发展的必由之路，共享是中国特色社会主义的本质要求","**坚持以人民为中心的发展思想**"],"q":[],"m":"创新、协调、绿色、开放、共享","c":["sg"],"id":"2015a"},{"y":2017.8,"d":"2017年10月18日","t":"中共十九大","ch":["史纲·第十章"],"p":"北京","s":"中国特色社会主义进入新时代","b":"经过长期努力，我国发展站到了新的历史起点上。","k":["**作出中国特色社会主义进入新时代的重大政治论断**","**我国社会主要矛盾已经转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾**","**确立习近平新时代中国特色社会主义思想为党的指导思想并写入党章**","**新时代“两步走”：2020年到2035年基本实现社会主义现代化；2035年到本世纪中叶建成富强民主文明和谐美丽的社会主义现代化强国**","**揭示中国共产党人的初心和使命，就是为中国人民谋幸福、为中华民族谋复兴**"],"q":["**易混：主要矛盾变了，但我国仍处于并将长期处于社会主义初级阶段的基本国情没有变，我国是世界最大发展中国家的国际地位没有变**"],"m":"新时代、新矛盾、新思想、新目标","c":["sg"],"id":"2017a"},{"y":2018.19,"d":"2018年3月11日","t":"宪法修正案","ch":["史纲·第十章"],"p":"北京","s":"把党的理论创新成果载入国家根本法","b":"十三届全国人大一次会议通过《中华人民共和国宪法修正案》。","k":["**把习近平新时代中国特色社会主义思想载入宪法**","**在宪法正文中写入“中国共产党领导是中国特色社会主义最本质的特征”**","增加有关监察委员会的规定，国家监察委员会成立"],"q":[],"m":"","c":["sg"],"id":"2018a"},{"y":2020.82,"d":"2020年10月26日","t":"十九届五中全会·新发展格局","ch":["史纲·第十章"],"p":"北京","s":"擘画“十四五”规划和2035年远景目标","b":"在全面建成小康社会胜利在望之际，全会审议通过关于“十四五”规划和2035年远景目标的建议。","k":["**提出加快构建以国内大循环为主体、国内国际双循环相互促进的新发展格局**","**明确到2035年基本实现社会主义现代化的远景目标**","构建新发展格局最本质的特征是实现高水平的自立自强，构建新发展格局必须保证经济循环畅通无阻，实现生产、分配、流通、消费各环节有机衔接。"],"q":["考法：新发展阶段明确了历史方位，新发展理念明确了指导原则，新发展格局明确了路径选择"],"m":"","c":["sg"],"id":"2020a"},{"y":2021.5,"d":"2021年7月1日","t":"庆祝建党百年·全面建成小康社会","ch":["史纲·第十章"],"p":"北京天安门","s":"实现第一个百年奋斗目标","b":"2021年2月全国脱贫攻坚总结表彰大会宣告：现行标准下9899万农村贫困人口全部脱贫，832个贫困县全部摘帽。","k":["**习近平宣告：我们实现了第一个百年奋斗目标，在中华大地上全面建成了小康社会，历史性地解决了绝对贫困问题**","提出伟大建党精神：**坚持真理、坚守理想，践行初心、担当使命，不怕牺牲、英勇斗争，对党忠诚、不负人民**","**强调坚持把马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合（“两个结合”）**"],"q":[],"m":"","c":["sg"],"id":"2021a"},{"y":2021.85,"d":"2021年11月8日","t":"第三个历史决议","ch":["史纲·第十章"],"p":"北京","s":"全面总结党的百年奋斗重大成就和历史经验","b":"十九届六中全会通过《中共中央关于党的百年奋斗重大成就和历史经验的决议》。","k":["总结“十个坚持”的历史经验：**坚持党的领导、人民至上、理论创新、独立自主、中国道路、胸怀天下、开拓创新、敢于斗争、统一战线、自我革命**","**指出党确立习近平同志党中央的核心、全党的核心地位，确立习近平新时代中国特色社会主义思想的指导地位（“两个确立”）**","十个明确是习近平新时代中国特色社会主义思想的主体内容，十四个坚持构成了新时代坚持和发展中国特色社会主义的基本方略，十三个方面成就全景式地展示了习近平新时代中国特色社会主义思想的理论与实践成果。"],"q":["**易混：马克思主义中国化的理论成果——毛泽东思想、中国特色社会主义理论体系、习近平新时代中国特色社会主义思想**","深刻领悟两个确立的决定性意义，要增强四个意识（政治意识、大局意识、核心意识、看齐意识）、坚定四个自信（道路自信、理论自信、制度自信、文化自信）、做到两个维护（坚决维护习近平总书记党中央核心、全党核心地位，坚决维护党中央权威和集中统一领导）。"],"m":"","c":["sg"],"id":"2021b"},{"y":2022.79,"d":"2022年10月16日","t":"中共二十大","ch":["史纲·第十章"],"p":"北京","s":"以中国式现代化全面推进中华民族伟大复兴","b":"大会在全党全国各族人民迈上全面建设社会主义现代化国家新征程的关键时刻召开。","k":["**中心任务：团结带领全国各族人民全面建成社会主义现代化强国、实现第二个百年奋斗目标，以中国式现代化全面推进中华民族伟大复兴**","中国式现代化是**人口规模巨大、全体人民共同富裕、物质文明和精神文明相协调、人与自然和谐共生、走和平发展道路的现代化**","“六个必须坚持”：**人民至上、自信自立、守正创新、问题导向、系统观念、胸怀天下**","**高质量发展是全面建设社会主义现代化国家的首要任务**。"],"q":[],"m":"","c":["sg"],"id":"2022a"}]}</script>

/* ---------- 时间带 ---------- */
let POS=[],trackW=800,curEls=null,ERASEG=[];
function cacheCurEls(){const tr=$('#track');curEls={tr:tr,line:$('.cur-line',tr),dot:$('.cur-dot',tr),fill:$('.rail-fill',tr)};}
/* 小球定位：只写 transform（translateX / 进度条 dasharray），走合成层。
   轨道宽度必须现测、不许只信 layoutRibbon 的缓存：轨道是 flex:1，左端阶段名
   长度随时期变（3～9 字），轨道宽跟着变；而 layoutRibbon 只在初始化 / 尺寸
   变化时跑——初次测量时阶段名还没填（空文本），缓存值先天偏大一截，之后切
   时期也不刷新。旧代码每帧拿这份过期宽度算像素偏移，跳到靠后的时期时小球
   被整体推出轨道右端、飞出胶囊（2026-11-14 用户实机截图：跳到 1978 年小球
   贴在屏幕右缘）。clientWidth 在布局干净时只是读缓存值、不触发重排；切时期
   那一帧阶段名刚改、布局本就待算，顺带测得新宽，之后每帧都是净读。 */
/* 直线轨道：中心线恒在 y=18（单行轨道高 36px），轨道 SVG、小球、节点圆点共用这条直线，视觉上严丝合缝。 */
function railPath(){
  return 'M0 18L'+Math.max(1,Math.round(trackW))+' 18';
}
let ballLastP=null;
function paintBall(p){
  if(!curEls)cacheCurEls();if(!curEls)return;
  const w=curEls.tr&&curEls.tr.clientWidth;if(w&&w!==trackW)trackW=w;
  /* 位置钳制在轨道两端之内：弹簧欠阻尼的过冲、拖动预览的边界值，
     都不许把小球带出轨道——过冲时球贴在端点止住，而不是飞出去 */
  const pc=p<0?0:p>1?1:p;ballLastP=pc;
  const x=pc*trackW,tx='translateX('+x.toFixed(2)+'px)';
  if(curEls.line)curEls.line.style.transform=tx;
  if(curEls.dot)curEls.dot.style.transform=tx;
  if(curEls.fill)curEls.fill.style.strokeDasharray=(pc*100).toFixed(2)+' 100';
  /* 单行化后轨道上没有任何文字标签（游标年份标签、年份刻度均已删除），paintBall 只写
     游标竖线 / 圆点 / 进度条三处 transform 与 dasharray，不再有标签避让逻辑 */
}
function layoutRibbon(){
  const L=LIST,N=L.length,tr=$('#track');
  /* 先把阶段名填上再测宽：阶段名长度决定轨道宽，空着测会把 trackW 测大一截，
     POS 的 pad 与轨道线都按这份宽度算，先填可一并对齐（paintBall 另有现测兜底） */
  const en0=$('#eraName');if(en0&&!en0.textContent){try{const r0=eraOf(cur());en0.textContent=r0.short;en0.setAttribute('data-era',r0.k);}catch(_){}}
  trackW=tr.clientWidth||trackW;
  const pad=12/trackW,inset=p=>pad+(1-2*pad)*p;
  /* 节点等距：位置只由序号决定，与真实年份间隔无关，游标每步移动距离相同 */
  POS=L.map((e,i)=>inset((i+0.5)/N));
  const set=ERASET;
  const wd=railPath();
  /* 单行轨道只生成三样：轨道线 SVG、五段时代色带（纯色段、无文字）、节点圆点与游标。
     年份刻度与时代名标签不再生成——阶段由色带分段 + 胶囊左端常驻的当前阶段名表达。
     手机端（≤760px）连节点圆点也不生成：轨道只剩五段时期，拖动按时期跳转（见 bindTrack），
     一百多个圆点既无意义又白占合成层。ERASEG 缓存每段的起止分数与首个事件序号，
     供手机端时期判定与桌面端共用同一套 inset 坐标，不会两处算出不同的段界 */
  ERASEG=[];
  let h='<svg class="rail-svg" viewBox="0 0 '+Math.max(1,Math.round(trackW))+' 36" preserveAspectRatio="none" aria-hidden="true"><path class="rail-w" d="'+wd+'"/><path class="rail-fill" pathLength="100" stroke-dasharray="0 100" d="'+wd+'"/></svg>';
  set.forEach(r=>{
    let a=-1,b=-1;L.forEach((e,i)=>{if(e.y>=r.from&&e.y<r.to){if(a<0)a=i;b=i;}});
    if(a<0)return;
    const x0=inset(a/N),x1=inset((b+1)/N);
    ERASEG.push({k:r.k,first:a,x0:x0,x1:x1});
    h+='<div class="band" data-era="'+r.k+'" style="left:'+(x0*100).toFixed(3)+'%;width:'+((x1-x0)*100).toFixed(3)+'%"><span class="bb"></span></div>';
  });
  if(!isNarrow())h+=L.map((e,i)=>'<span class="dot-e" data-i="'+i+'" data-era="'+eraOf(e).k+'" style="left:'+(POS[i]*100).toFixed(3)+'%;top:18px"></span>').join('');
  h+='<span class="cur-line"></span><span class="cur-dot"></span>';
  tr.innerHTML=h;cacheCurEls();
  if(isNarrow()){
    tr.setAttribute('aria-label','时间轴（按时期拖动）');tr.title='拖动选择时期，松手跳到该时期的第一个事件。';
    tr.setAttribute('aria-valuemin','1');tr.setAttribute('aria-valuemax',String(ERASEG.length||set.length));
  }else{
    tr.setAttribute('aria-label','时间轴（可拖动；节点等距排列）');tr.title='拖动浏览；节点按顺序等距排列，与真实年份间隔无关。← → 切换节点，Home / End 跳转首尾。';
    tr.setAttribute('aria-valuemin','1');tr.setAttribute('aria-valuemax',String(N));
  }
  paintDots();updateCursor();
  /* 轨道刚整段重建过：新游标元素没有 transform、停在轨道左端，updateCursor 里
     setBall 走的是弹簧（下一帧才写位置）——在 rAF 被节流的环境（应用内嵌
     WebView 息屏 / 后台切回）里球会长时间停在左端假死。按上次画过的位置同步
     补画一笔：弹簧在飞时它下一帧自己覆盖，在息时补画值就是目标值，不跳变 */
  if(ballLastP!=null)paintBall(ballLastP);
}
function paintDots(){
  const L=LIST,vis=filtered()?new Set(VIS.map(e=>e.id)):null;
  $$('#track .dot-e').forEach(d=>{const e=L[+d.dataset.i];d.classList.toggle('done',!!S.done[e.id]);d.classList.toggle('dim',!!vis&&!vis.has(e.id));});

function updateCursor(){

  if(!curEls)cacheCurEls();

  if(!S.playing)setBall(p);
  $$('.dot-e',tr).forEach(d=>d.classList.toggle('now',+d.dataset.i===i));
  const pcEl=$('#playCount');if(pcEl)swapText(pcEl,(i+1)+' / '+L.length);
  /* 当前阶段名：胶囊左端常驻文本，游标走到哪段就报哪段的阶段名（短名），颜色随段走 */
  const en=$('#eraName');if(en){en.textContent=r.short;en.setAttribute('data-era',r.k);}

function bindTrack(){
  const tr=$('#track');let drag=false,px=null,raf=0;
  const pick=()=>{raf=0;if(px==null)return;const rc=tr.getBoundingClientRect(),t=(px-rc.left)/rc.width,L=LIST;
    const vis=filtered()&&VIS.length?new Set(VIS.map(e=>e.id)):null;let bi=-1,bd=9;
    POS.forEach((p,i)=>{if(vis&&!vis.has(L[i].id))return;const d=Math.abs(p-t);if(d<bd){bd=d;bi=i;}});
    if(bi>=0&&L[bi].id!==curId())select(L[bi].id,{from:'ribbon'});};
  const queue=x=>{px=x;if(!raf)raf=requestAnimationFrame(pick);};
  /* 手机端（≤760px）：轨道不细分节点、只认五个时期。拖动全程不调 select——
     桌面那套「拖到哪个节点就跳哪个节点」在手机上每过一个节点就要重渲详情、
     列表高亮与游标，正是滑动卡顿的来源。这里拖动只做预览（小球跟手 +
     胶囊左端阶段名跟着手指变，每帧只写 transform 与一处文本），松手才一次性
     跳到所停时期的第一个事件；点按（按下即松手）同样按时期跳转 */
  let mDrag=false,mEra=-1,mRaf=0,mX=null;
  const eraAt=t=>{let j=0;ERASEG.forEach((s,idx)=>{if(t>=s.x0)j=idx;});return j;};
  const mPreview=()=>{mRaf=0;if(mX==null||!ERASEG.length)return;const rc=tr.getBoundingClientRect(),t=Math.max(0,Math.min(1,(mX-rc.left)/rc.width));const j=eraAt(t);mEra=j;setBall(t);
    const r=ERASET[j],en=$('#eraName');if(en&&r){en.textContent=r.short;en.setAttribute('data-era',r.k);}};
  const mQueue=x=>{mX=x;if(!mRaf)mRaf=requestAnimationFrame(mPreview);};
  const mCommit=()=>{if(mRaf){cancelAnimationFrame(mRaf);mRaf=0;}
    const seg=mEra>=0?ERASEG[mEra]:null;mEra=-1;
    if(!seg){updateCursor();return;}
    /* 跳到该时期的第一个事件：有筛选时取该时期内第一个可见事件，该时期没有可见事件则不动 */
    let target=null;
    if(filtered()&&VIS.length)target=VIS.find(e=>eraOf(e).k===seg.k)||null;
    else target=LIST[seg.first]||null;
    if(target&&target.id!==curId())select(target.id,{from:'ribbon'});else updateCursor();};
  const mCancel=()=>{if(mRaf){cancelAnimationFrame(mRaf);mRaf=0;}mEra=-1;updateCursor();};
  tr.addEventListener('pointerdown',ev=>{if(ev.button>0)return;try{tr.setPointerCapture(ev.pointerId);}catch(_){}
    if(isNarrow()){mDrag=true;mEra=-1;mQueue(ev.clientX);}
    else{drag=true;queue(ev.clientX);}});
  tr.addEventListener('pointermove',ev=>{if(mDrag)mQueue(ev.clientX);else if(drag)queue(ev.clientX);});
  const end=()=>{if(mDrag){mDrag=false;mCommit();}drag=false;};
  const cancel=()=>{if(mDrag){mDrag=false;mCancel();}drag=false;};
  tr.addEventListener('pointerup',end);tr.addEventListener('pointercancel',cancel);tr.addEventListener('lostpointercapture',end);
  tr.addEventListener('keydown',ev=>{const L=navList();
    if(ev.key==='Home'){ev.preventDefault();select(L[0].id);}
    else if(ev.key==='End'){ev.preventDefault();select(L[L.length-1].id);}
    else if(ev.key==='ArrowUp'){ev.preventDefault();step(1);}
    else if(ev.key==='ArrowDown'){ev.preventDefault();step(-1);}});
}

/* ---------- 横向滑动翻页（跟手） ----------
   粒度：每滑一次只进 / 退一个小节——时间轴里最小的内容单位就是单个节点（一张事件卡），
   按当前导航列表（navList）的阅读顺序走 neighbor(±1)，不再整时代 / 整阶段跳转。
   主界面（#detail）与沉浸阅读（#immScroll）共用同一套 makePager：
   - 只认触摸 / 触控笔；起点落在按钮等交互元素上不启动；横向优先级刻意高于
     竖向（自然手势多是左下 / 左上 / 右下 / 右上这类斜滑，做不到完全水平）：
     |dx|≥6px 且 |dx|≥|dy|×0.65 即锁定（容忍约 57° 的斜角），位移再大些放宽到
     |dx|≥|dy|×0.5（约 63°）；竖向定轴反过来收严，须 |dy|≥10px 且
     |dy|≥|dx|×2.4（或行程够长后 |dy|>|dx|×2）才让行，竖滑保持原生滚动、
     判定后本手势不再翻页。
   - 两个容器仍是 touch-action:pan-y（竖滑原生接管）；另挂一条 non-passive 的
     touchmove：横向位移 ≥3px 且 |dx|≥|dy|×0.5 就 preventDefault 掐住原生滚动，
     锁定后整段手势持续拦截、并把容器 scrollTop 钉回锁定值——横滑一旦锁定，
     竖直滚动在本手势内完全让路、不再抢。明显竖向的手势从不拦截，滚动原样。
   - 锁定（≤6px，几乎触摸第一刻）即在当前视口位置盖一条翻页条（.pager-strip，
     恰好一屏高）：当前页克隆按克隆时刻的滚动位置内移、与原页重合，相邻页从
     自身顶部排起、与当前页并排；原页 visibility:hidden 让位。跟手从触摸原点
     起算全程位移（锁定前的几 px 一并计入、无死区跳变），拖动中整条 1:1 跟手
     （transform 只等于手指位移，无阻尼、无滞后、无缩放浮动），方向锁定后固定，
     位移钳制在一页宽内。
   - 松手先把 pointerup 的最终坐标并入位移与速度采样（轻扫的末段位移只在松手
     事件里），再按低阈值决定翻页：位移 ≥min(46px, 页宽 12%)，或 ≥14px 且同向
     速度 ≥0.30px/ms，或 ≥8px 且同向速度 ≥0.60px/ms；没等到锁定就松手、但位移
     ≥12px 且斜向宽容达标的快速轻扫也直接翻一页。达标后 Wobble 弹簧带松手初速度
     滑到目标页 / 回弹原页（overshootClamping 防过冲），落定后才以
     select(...,{from:'pager'}) 提交并拆条，提交本身不叠加任何过渡，画面连续不断层。
     没等到锁定就松手的短扫同样按斜滑宽容判定（|dx|≥12px 且 |dx|≥|dy|×0.5）。
   - 首 / 末节没有相邻页：只许 30px 内受阻跟手，松手必回弹，不越界。
   - 连续滑动：落定与提交不阻塞下一次手势。弹簧还在飞时新手指按下即接管
     （takeover）：停弹簧、条不拆、内容不提交，手势原点按当前条位反推，从
     当前位移无缝接着滑，同向继续翻、反向滑回取消；提交只在最终落定后走
     select(...,{from:'pager'}) 的快速路径——只换当前卡片内容（pagerSwap
     抑制进入动画、无 View Transition、无整页重绘），侧栏 / 时间轴不重排。
   - 减少动态效果时不建条：松手过阈值直接 step(±1)（其余过渡本就被全局规则关掉）。
   - pointercancel（竖向接管 / 手势被打断）：拖动中直接拆条还原，绝不把页面
     留在半翻状态；弹簧落定途中没有活动手势，cancel 不触发拆条。
   - 帧率（iPad 60fps 专项）：每帧只写一件事——翻页条的 transform（pointermove
     合并进 rAF、弹簧落定走 paint，均为 translate3d 独立合成层）。逐帧重绘源的
     关停只限条内：克隆卡的 backdrop-filter / 阴影 / 过渡 / 动画全关（条只是静态
     快照，见 .pager-strip 规则）。页面其余表面的滤镜翻页期间一律保留（所有
     引擎同规矩）：.detail 的背板是静态 mesh + blob、不随条身平移失效，关掉
     它的 saturate(160%) 只会让整页背景在滑动开始 / 落定各变色一次（用户
     三报）、并在落定那帧叠一笔全屏重栅格（切换重卡的一半）；WebKit 还多一
     层：同一 Backdrop Root 的玻璃面共用背景快照，关 .detail 的滤镜会连带
     顶栏胶囊与左边栏在滑动期间采样到原始蓝背景而发蓝（iPad 实测，见翻页
     CSS 一节），故 WebKit 的 .paging 关滤镜旧规矩已一并废除。背景
     blob 不隐藏（静止缓存层，藏掉整页瞬间掉色）；沉浸侧覆盖层模糊本就是独立
     .imm-bg 层、不参与重绘。上一版的深度转场（离场压暗 / 入场转亮 / 接缝
     阴影）已整体移除——三层整页罩层的 opacity 逐帧写入同样在吃帧，顺滑优先
     于转场。落定弹簧保持 stiffness 290 / damping 30。 */
function makePager(scroller,host,htmlFor,guard){
  if(!scroller||!host)return;
  let pid=null,sx=0,sy=0,mode=0,dir=0,target=null,W=0;
  let strip=null,curX=0,vel=0,samples=[],spring=null,pending=null,busy=false,stLock=0;
  /* 跟手绘制合并到帧：pointermove 一帧内可来多次，逐次写 transform 是白白掉帧；
     move 只记最新位移、挂一个 rAF 一帧画一次（弹簧落定走自己的 rAF、直接 paint）。
     paint() 会作废排队中的 move 绘制，保证松手 / 弹簧的最终位置不被旧帧覆盖 */
  let rafPaint=0,queuedX=null;
  function pushSample(x,t){
    samples.push({x:x,t:t});
    while(samples.length>2&&t-samples[0].t>120)samples.shift();
    if(samples.length>1){const a=samples[0],b=samples[samples.length-1];vel=(b.x-a.x)/Math.max(1,b.t-a.t);}
  }
  function paint(x){curX=x;if(rafPaint){cancelAnimationFrame(rafPaint);rafPaint=0;queuedX=null;}if(strip)strip.style.transform='translate3d('+x.toFixed(1)+'px,0,0)';}
  function queuePaint(x){curX=x;queuedX=x;if(rafPaint)return;rafPaint=requestAnimationFrame(()=>{rafPaint=0;const qx=queuedX;queuedX=null;if(qx!==null&&strip)strip.style.transform='translate3d('+qx.toFixed(1)+'px,0,0)';});}
  function appliedDx(dx){
    if(!target)return dir>0?Math.max(-30,Math.min(0,dx*0.32)):Math.max(0,Math.min(30,dx*0.32));
    return dir>0?Math.max(-W,Math.min(0,dx)):Math.max(0,Math.min(W,dx));
  }
  function makePage(html,shiftY){
    const page=document.createElement('div');page.className='pager-page';page.style.width=W+'px';
    let card=null;
    if(html==null){
      const src=host.querySelector('.card');
      if(src){card=src.cloneNode(true);card.classList.remove('enter','enter-next','enter-prev');card.style.transform='translateY('+(-shiftY)+'px)';}
    }else{
      const t=document.createElement('template');t.innerHTML=html;
      card=t.content.firstElementChild;
    }
    if(card){
      /* 条内两页都是临时替身：剥掉全部 id 与共享元素名，免得与正文真卡片撞 id / 撞 view-transition-name */
      card.querySelectorAll('[id]').forEach(n=>n.removeAttribute('id'));
      card.removeAttribute('id');card.removeAttribute('aria-labelledby');
      const tt=card.querySelector('.title'),yy=card.querySelector('.year');
      if(tt)tt.style.viewTransitionName='none';if(yy)yy.style.viewTransitionName='none';
      page.appendChild(card);
    }
    return page;
  }
  function build(dx){
    W=scroller.clientWidth;const st=scroller.scrollTop;stLock=st;
    target=neighbor(dir);
    strip=document.createElement('div');strip.className='pager-strip';strip.setAttribute('aria-hidden','true');
    try{strip.inert=true;}catch(_){}
    strip.style.top=st+'px';strip.style.height=scroller.clientHeight+'px';strip.style.width=(W*2)+'px';
    const curPage=makePage(null,st);
    if(target){
      const L=navList(),ci=L.findIndex(e=>e.id===curId()),ti=ci+dir;
      const pv=ti-1>=0?L[ti-1]:null,nx=ti+1<L.length?L[ti+1]:null;
      const adjPage=makePage(htmlFor(target,pv,nx),0);
      if(dir>0){strip.appendChild(curPage);strip.appendChild(adjPage);strip.style.left='0px';}
      else{strip.appendChild(adjPage);strip.appendChild(curPage);strip.style.left=(-W)+'px';}
    }else{
      strip.appendChild(curPage);strip.style.left='0px';
    }
    host.appendChild(strip);
    document.documentElement.classList.add('paging');
    const real=host.querySelector(':scope > .card');if(real)real.style.visibility='hidden';
    paint(appliedDx(dx));
  }
  function teardown(){
    if(rafPaint){cancelAnimationFrame(rafPaint);rafPaint=0;queuedX=null;}
    document.documentElement.classList.remove('paging');
    if(strip){strip.remove();strip=null;}
    const real=host.querySelector(':scope > .card');if(real)real.style.removeProperty('visibility');
  }
  function finishSettle(){
    if(!busy)return;busy=false;
    const p=pending,tg=target;pending=null;target=null;
    if(spring){const s=spring;spring=null;try{s.stop();}catch(_){}}
    teardown();
    if(p==='commit'&&tg)select(tg.id,{from:'pager'});
  }
  function settle(commit,v0){
    const toX=commit?-dir*W:0;
    pending=commit?'commit':'back';busy=true;
    if(!window.Wobble||!Wobble.Spring){finishSettle();return;}
    try{
      spring=new Wobble.Spring({fromValue:curX,toValue:toX,stiffness:290,damping:30,mass:1,initialVelocity:v0||0,overshootClamping:true,restDisplacementThreshold:0.5,restVelocityThreshold:0.02});
      spring.onUpdate(s=>paint(s.currentValue));
      spring.onStop(()=>finishSettle());
      spring.start();
    }catch(_){spring=null;finishSettle();}
  }
  function commitWanted(){
    const ax=Math.abs(curX),dv=-vel*dir;/* 速度只认与拖动同向的分量，反向甩手不算 */
    return ax>=Math.min(46,W*0.12)||(ax>=14&&dv>=0.30)||(ax>=8&&dv>=0.60);
  }
  /* 连续滑动接管：弹簧落定途中（busy）新手指按下，不等落定、不等提交——先把
     busy 清掉再停弹簧（弹簧 onStop 回调里的 finishSettle 见 busy 已清会直接
     返回，不拆条、不提交），然后把正在飞的翻页条直接交还给这根手指：手势
     原点按当前条位反推（sx = 按下点 − 能产生当前 curX 的虚拟位移，无相邻页
     的受阻跟手按 0.32 阻尼反推），后续 pointermove 的既有公式画出的位置与
     接管瞬间严丝合缝；接着同向滑是继续翻、反向滑回去是取消本次翻页，提交
     与否改由这次手势松手时的 commitWanted 重新决定。落定从此不阻塞新手势，
     连续快速滑动可以一页接一页不停顿。 */
  function takeover(ev){
    if(!strip||!busy)return false;
    if(ev.target&&ev.target.closest&&ev.target.closest('button,a,input,select,textarea,label'))return false;
    if(!guard())return false;
    busy=false;pending=null;
    if(spring){const s=spring;spring=null;try{s.stop();}catch(_){}}
    pid=ev.pointerId;mode=1;vel=0;
    sx=ev.clientX-(target?curX:curX/0.32);sy=ev.clientY;
    samples=[{x:ev.clientX,t:ev.timeStamp||0}];
    return true;
  }
  scroller.addEventListener('pointerdown',ev=>{
    if(ev.pointerType==='mouse')return;
    if(pid!==null)return;
    if(busy){takeover(ev);return;}
    if(ev.target&&ev.target.closest&&ev.target.closest('button,a,input,select,textarea,label'))return;
    if(!guard())return;
    pid=ev.pointerId;sx=ev.clientX;sy=ev.clientY;mode=0;dir=0;target=null;vel=0;
    samples=[{x:ev.clientX,t:ev.timeStamp||0}];
  },{passive:true});
  /* 横滑让路拦截（touch 通道，non-passive）：横向分量 ≥3px 且不小于纵向一半
     就掐住原生竖向滚动（斜滑也算），锁定后整段手势持续拦截；明显竖向不拦截。
     pointer 判定（下方）仍是翻页状态机本体，这里只负责不让浏览器先把滚动抢走 */
  scroller.addEventListener('touchmove',ev=>{
    if(pid===null||busy)return;
    if(mode===1){ev.preventDefault();return;}
    if(mode===0&&ev.touches&&ev.touches.length===1){
      const t=ev.touches[0],tdx=t.clientX-sx,tdy=t.clientY-sy;
      if(Math.abs(tdx)>=3&&Math.abs(tdx)>=Math.abs(tdy)*0.5)ev.preventDefault();
    }
  },{passive:false});
  window.addEventListener('pointermove',ev=>{
    if(ev.pointerId!==pid||mode===2)return;
    const dx=ev.clientX-sx,dy=ev.clientY-sy,now=ev.timeStamp||0;
    pushSample(ev.clientX,now);
    if(mode===0){
      const ax=Math.abs(dx),ay=Math.abs(dy);
      if((ax>=6&&ax>=ay*0.65)||(ax>=18&&ax>=ay*0.5)){mode=1;dir=dx<0?1:-1;
        if(reducedMotion()){W=scroller.clientWidth;target=neighbor(dir);curX=dx;}
        else build(dx);}
      else if((ay>=10&&ay>=ax*2.4)||(ax+ay>=26&&ay>ax*2))mode=2;
      return;
    }
    /* 已锁定：竖向位置钉死在锁定值，本手势内页面不许再上下漂；跟手绘制走 queuePaint 合并到帧 */
    if(strip&&scroller.scrollTop!==stLock)scroller.scrollTop=stLock;
    if(strip)queuePaint(appliedDx(dx));else curX=dx;
  },{passive:true});
  window.addEventListener('pointerup',ev=>{
    if(ev.pointerId!==pid)return;
    pid=null;
    /* 松手最终坐标并入采样：轻扫的末段位移与速度只体现在 pointerup 里，
       不并入就会把快速轻扫判成没滑够 */
    const fdx=ev.clientX-sx,fdy=ev.clientY-sy;
    pushSample(ev.clientX,ev.timeStamp||0);
    if(mode===2){mode=0;target=null;return;}
    if(mode===0){
      /* 没等到锁定就松手的短促轻扫：位移不大但方向明确，同样翻一页 */
      const ax=Math.abs(fdx);
      if(ax>=12&&ax>=Math.abs(fdy)*0.5){const d=fdx<0?1:-1;if(neighbor(d))step(d);}
      target=null;return;
    }
    mode=0;
    if(strip)paint(appliedDx(fdx));else curX=fdx;
    if(reducedMotion()){if(target&&commitWanted())step(dir);target=null;return;}
    if(!strip){target=null;return;}
    settle(!!target&&commitWanted(),vel);
  },{passive:true});
  window.addEventListener('pointercancel',ev=>{
    if(ev.pointerId!==pid)return;
    pid=null;mode=0;
    if(busy)return;
    target=null;teardown();
  },{passive:true});
}
makePager($('#detail'),$('#detail'),(e,pv,nx)=>cardHTMLFor(e,pv,nx),()=>!immersiveOn);
makePager($('#immScroll'),$('#immDetail'),(e,pv,nx)=>immCardHTMLFor(e,pv,nx),()=>immersiveOn);

/* ---------- 交互 ---------- */
let navDir=null,vtBusy=false;
function setSwap(id,name){const w=document.getElementById(id);if(!w)return;$$('.ic',w).forEach(ic=>ic.classList.toggle('on',ic.dataset.icon===name));}
function starBurst(starEl){
  if(reducedMotion())return;
  $$('.star-burst-particle',starEl).forEach(p=>p.remove());
  const N=8;
  for(let i=0;i<N;i++){
    const p=document.createElement('span');p.className='star-burst-particle';
    p.innerHTML='<svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7-6.2-3.7-6.2 3.7 1.6-7L2 9.2l7.1-.6z"/></svg>';
    const angle=(i/N)*Math.PI*2+Math.random()*0.6,dist=26+Math.random()*18;
    const dx=Math.cos(angle)*dist,dy=Math.sin(angle)*dist;
    p.style.transitionDuration='500ms';p.style.transitionTimingFunction='cubic-bezier(0.22, 1, 0.36, 1)';
    starEl.appendChild(p);
    requestAnimationFrame(()=>{p.style.transform='translate('+dx.toFixed(1)+'px, '+dy.toFixed(1)+'px) scale('+(0.6+Math.random()*0.6).toFixed(2)+') rotate('+((Math.random()*120-60)|0)+'deg)';p.style.opacity='0';});
    p.addEventListener('transitionend',()=>p.remove(),{once:true});
    setTimeout(()=>{if(p.parentNode)p.remove();},700);
  }
}
function ensurePill(wrap){let p=$('.mv-pill',wrap);if(!p){p=document.createElement('span');p.className='mv-pill';p.setAttribute('aria-hidden','true');wrap.insertBefore(p,wrap.firstChild);}return p;}
function movePill(wrap,btn,animate){
  if(!wrap||!btn)return;const pill=ensurePill(wrap);

function swapText(el,txt){
  if(!el)return;
  if(!el.textContent||el.textContent===txt){el.textContent=txt;return;}
  if(reducedMotion()||!el.animate||el._swp){el.textContent=txt;return;}
  el._swp=true;
  const out=el.animate([{opacity:1,filter:'blur(0px)',transform:'translateY(0)'},{opacity:0,filter:'blur(2px)',transform:'translateY(-4px)'}],{duration:120,easing:'cubic-bezier(0.22, 1, 0.36, 1)',fill:'forwards'});
  out.onfinish=()=>{el.textContent=txt;const inn=el.animate([{opacity:0,filter:'blur(2px)',transform:'translateY(4px)'},{opacity:1,filter:'blur(0px)',transform:'translateY(0)'}],{duration:130,easing:'cubic-bezier(0.22, 1, 0.36, 1)',fill:'forwards'});inn.onfinish=()=>{el._swp=false;};};
}

/* 播放：小球匀速连续滑动。位置按导航序号线性推进（每个节点一份相同时长，1× = 6 秒，
   与真实年份间隔无关），逐帧用 requestAnimationFrame 只更新 transform：
   小球 translateX、进度条 scaleX，均已 will-change 提升到合成层，不写 left/width、不触发重排；
   不用 CSS 过渡、不用缓动、不分段跳跃；球到达某节点时才激活该节点。
   速度只改变每份时长的长短，逐帧按当前 dwell() 推进，调速时位置保持连续。 */
const BASE_DWELL=6000,SPEEDS=[0.5,1,2,3];
let playRaf=0,playLast=0,playPos=-1,playIdxs=[];
function dwell(){return BASE_DWELL/S.speed;}
function paintPlayPos(p){if(immersiveOn)return;/* 沉浸中主页冻结：游标也不动，退出时由 updateCursor 的弹簧一次滑到新位置 */setBall(p);}
/* Wobble 弹簧跟随：小球改弹簧追目标（stiffness 170 / damping 19，带一点 overshoot 再落稳），
   替代原匀速线性。只做标量弹簧（轨道进度 p），onUpdate 里写 transform，不碰 scrollTop。
   播放时逐帧 updateConfig 改 toValue 连续跟随；切节点时同一弹簧直接改目标，不重建、不跳变。 */
let ballSpring=null,ballPrimed=false;
function setBall(p){
  if(!ballPrimed){
    ballPrimed=true;paintBall(p);
    if(ballSpring)ballSpring.updateConfig({fromValue:p,toValue:p});
    return;
  }
  if(!ballSpring||reducedMotion()){paintBall(p);return;}
  const tr=$('#track');if(tr)tr.classList.add('springy');
  ballSpring.updateConfig({toValue:p});
  ballSpring.start();
}
function initBallSpring(){
  if(!window.Wobble||!Wobble.Spring||reducedMotion())return;
  try{
    ballSpring=new Wobble.Spring({fromValue:0,toValue:0,stiffness:170,damping:19,mass:1,restDisplacementThreshold:0.0004,restVelocityThreshold:0.0004});
    ballSpring.onUpdate(s=>{paintBall(s.currentValue);});
    ballSpring.onStop(()=>{const tr=$('#track');if(tr)tr.classList.remove('springy');});
  }catch(_){ballSpring=null;}
}
function playFrame(ts){
  playRaf=0;if(!S.playing)return;
  if(!playLast)playLast=ts;
  const dt=Math.min(250,ts-playLast);playLast=ts;
  const L=navList(),N=L.length;
  if(!N||!POS.length){setPlay(false);return;}
  const full=LIST;
  playIdxs=L.map(e=>full.indexOf(e));
  playPos+=dt/dwell();
  if(playPos>=N-1){
    playPos=N-1;paintPlayPos(POS[playIdxs[N-1]]);
    if(curId()!==L[N-1].id)select(L[N-1].id,{auto:true});
    setPlay(false);return;
  }
  const k=Math.floor(playPos);
  if(L[k]&&curId()!==L[k].id)select(L[k].id,{auto:true});
  const a=POS[playIdxs[k]],b=POS[playIdxs[k+1]];
  paintPlayPos(a+(b-a)*(playPos-k));
  if(S.playing)playRaf=requestAnimationFrame(playFrame);
}
function startPlay(){
  const L=navList();if(!L.length||!POS.length)return;
  const full=LIST;
  playIdxs=L.map(e=>full.indexOf(e));
  let k=L.findIndex(e=>e.id===curId());if(k<0)k=0;
  /* 暂停后继续：若球还停在当前节点的这一段里，从原位置接着滑，不跳回节点 */
  if(playPos<k||playPos>=k+1)playPos=k;
  playLast=0;
  paintPlayPos(playPos>=L.length-1?POS[playIdxs[L.length-1]]:POS[playIdxs[k]]+(POS[playIdxs[Math.min(k+1,L.length-1)]]-POS[playIdxs[k]])*(playPos-k));
  playRaf=requestAnimationFrame(playFrame);
}
function setPlay(on){
  if(on&&isNarrow())on=false;/* 手机端已删播放功能：窄屏下拒绝启动（隐藏按钮之外的兜底） */
  S.playing=on;const b=$('#playBtn');b.setAttribute('aria-pressed',String(on));b.setAttribute('aria-label',on?'暂停自动播放':'自动播放');if(!b.dataset.built){b.dataset.built='1';b.innerHTML='<span class="icon-swap" id="playSwap"><span class="ic" data-icon="play">'+IC.play+'</span><span class="ic" data-icon="pause">'+IC.pause+'</span></span>';}setSwap('playSwap',on?'pause':'play');
  $('#app').classList.toggle('playing',on);
  if(playRaf){cancelAnimationFrame(playRaf);playRaf=0;}
  if(on)startPlay();
}

/* 沉浸不再调 Fullscreen API：覆盖层本身已是 fixed 全屏；全屏请求在沙箱 iframe 里要么被拒、
   要么在入场落定后触发整页 resize + 重排（滑块画布、Lenis 观察器一齐被惊动），正是
   「显示之后」那一下卡死的引信。去掉后进入沉浸只剩覆盖层自身的淡入，落定即定格磨砂 */

   那一页（模糊背景不跟着翻页变），退出这一刻才渲染新页，并给新卡挂 imm-sync

   侧栏高亮与时间轴游标也在同一刻补上（游标走它自己的弹簧滑过去）。没在沉浸里
   翻过页（immMainStale 为假）时什么都不做，退出保持原样无多余动画 */

function enterImmersive(){
