<title>史纲时间轴 · sadpotatomine 的复习本</title>
<style>
:root{
  --bg:#F5F7FA;--panel:#FFFFFF;--sunk:#E8EDF3;--ink:#1E2A36;--ink-2:#455668;--ink-3:#5F7186;
  --line:#D8E0EA;--line-2:#E6ECF2;--hover:rgba(237,242,247,.62);--focus:#2470B8;--accent:#2470B8;--accent-hover:#1D5F9E;
  --warn-bg:rgba(248,243,231,.72);--warn-line:#E4D7B8;--warn-ink:#7A5E1E;--warn-k:rgba(176,141,52,.15);
  --mn-bg:rgba(234,243,246,.70);--mn-line:#BFD9DE;--mn-ink:#285E6B;
  --gold:#90701E;--green:#247A68;--mark:rgba(74,144,217,.28);--hl:#1D4ED8;
  --shadow:0 1px 2px rgba(20,34,52,.06),0 10px 30px rgba(20,34,52,.12);
  --serif:"Iowan Old Style","Palatino Linotype",Georgia,"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","Noto Serif SC",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC","Helvetica Neue",Arial,sans-serif;
  --era:#72879A;--era-ink:#54687C;--era-tint:rgba(114,135,154,.11);
  /* 动效标尺（Apple 标准值）：hover 150ms / 按压 100ms / 入场 250ms / 结构 320ms */
  --ease-apple:cubic-bezier(0.16,1,0.3,1);--ease-snappy:cubic-bezier(0.2,0,0,1);--ease-spring:cubic-bezier(0.34,1.56,0.64,1);
  --ease:var(--ease-apple);--ease-out:var(--ease-apple);
  --dur-micro:150ms;--dur-press:100ms;--dur-enter:250ms;--dur-struct:320ms;
  /* 时间轴收起/展开专用：更长的时长 + 更平缓的入场曲线（起步缓、出程长尾），淡入淡出与滑动错峰衔接 */
  --dur-ribbon:560ms;--ease-ribbon:cubic-bezier(0.22,1,0.36,1);
  /* 沉浸阅读进/出专用：只驱动 transform/opacity（GPU 合成层），一次到位、长尾缓动，进出同帧反向，不分段衔接 */
  --dur-immersive:640ms;--ease-immersive:cubic-bezier(0.22,1,0.36,1);
  /* 翻页专用：--dur-page 供正文内按钮等非手势切页的 enter 动画用；左右滑翻页走跟手拖动 + Wobble 弹簧落定，不用淡入淡出 */
  --dur-page:420ms;--dur-page-out:160ms;
  --ease-soft:cubic-bezier(0.22,1,0.36,1);--ease-draw:cubic-bezier(0.65,0,0.45,1);--dur-ui:250ms;
  /* 玻璃配方：样例 4 号「超透薄玻璃」再降两档——6px 轻模糊、底色再降（胶囊专用覆写 0.5%/1%，几乎全透明）、高光与投影同步再淡。
     浮动 chrome 用 --glass-tint；内容区（侧栏 / 正文面 / 沉浸层）用 --glass-panel，
     卡片与输入类小件用 --glass-card / --glass-field：都只是半透明底 + 背景模糊 + 细边框，
     文字本身不透明、不进任何滤镜，保持原样清晰 */
  --glass-tint:rgba(255,255,255,.04);
  --glass-blur:blur(6px) saturate(140%);
  --glass-border:rgba(255,255,255,.24);
  --glass-rim-top:rgba(255,255,255,.22);
  --glass-rim-bottom:rgba(0,0,0,.015);
  --glass-ring:rgba(255,255,255,.08);
  --glass-shadow:0 6px 20px rgba(20,34,52,.03);
  --glass-shadow-up:0 -6px 20px rgba(20,34,52,.03);
  --glass-insets:inset 0 1px 1px var(--glass-rim-top),inset 0 -1px 1px var(--glass-rim-bottom),inset 1px 0 1px rgba(255,255,255,.04),inset -1px 0 1px rgba(255,255,255,.04),0 0 0 .5px var(--glass-ring);
  --on-glass:rgba(255,255,255,.14);--on-glass-hover:rgba(255,255,255,.25);
  --glass-panel:rgba(255,255,255,.32);
  --glass-panel-blur:blur(14px) saturate(160%);
  --glass-era:rgba(255,255,255,.82);
  --glass-card:rgba(255,255,255,.26);
  --glass-field:rgba(255,255,255,.22);
  --glass-strong:rgba(245,247,250,.44);
  /* 沉浸定格底：磨砂层入场落定后撤掉实时模糊、换这层近不透明同色底（底层主页沉浸期间冻结不动，定格后画面几乎无差别） */
  --imm-veil:rgba(245,247,250,.92);
  /* 圆角等级：chips/按钮/开关全胶囊，内容卡片 24px，框架表面（顶栏/底栏/抽屉）28px，节点全圆 */
  --r-chip:999px;--r-card:24px;--r-frame:28px;
}
:root[data-theme="dark"]{
  --bg:#131A22;--panel:#1A232E;--sunk:#232F3D;--ink:#EAF0F6;--ink-2:#C2CFDC;--ink-3:#9FB0C2;
  --line:#2E3B4A;--line-2:#263241;--hover:rgba(34,46,60,.62);--focus:#7DB6F0;--accent:#357EC2;--accent-hover:#2C6BA8;
  --warn-bg:rgba(46,42,30,.72);--warn-line:#4A4230;--warn-ink:#E3C98A;--warn-k:rgba(227,201,138,.16);

  .side{position:fixed;z-index:50;top:0;bottom:0;left:0;width:min(72vw,290px);border-right:0;border-radius:0 var(--r-frame) var(--r-frame) 0;overflow:hidden;isolation:isolate;background:var(--imm-veil);-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:14px 0 36px rgba(20,34,52,.16);transform:translateX(-104%);visibility:hidden;transition:transform var(--dur-enter) var(--ease-apple),background-color var(--dur-struct) var(--ease-apple),visibility 0s linear var(--dur-enter);padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}

/* ===== site-wide button motion (per BUTTON/MARK research reports) ===== */
[data-ripplet]{position:relative;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.ripplet-wrap{position:absolute;inset:0;overflow:hidden;border-radius:inherit;pointer-events:none;z-index:0}
.ripplet-ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.16;transform:scale(0);pointer-events:none}
.filters,.speed{position:relative}
.chip,.speed button{position:relative;z-index:1}
.chip[aria-pressed="true"]:hover,.speed button[aria-pressed="true"]:hover{background:transparent}
.mv-pill{position:absolute;left:0;top:0;width:0;height:0;background:var(--accent);box-shadow:0 1px 3px rgba(20,34,52,.18);transition:transform var(--dur-ui) var(--ease-soft),width var(--dur-ui) var(--ease-soft),height var(--dur-ui) var(--ease-soft);will-change:transform,width;pointer-events:none;z-index:0}
.filters .mv-pill{border-radius:999px}
.speed .mv-pill{border-radius:999px}
.icon-swap{position:relative;display:inline-grid;flex:none}
.icon-swap .ic{grid-area:1/1;display:grid;place-items:center;opacity:0;filter:blur(2px);transform:scale(.25);transition:opacity var(--dur-ui) var(--ease-soft),filter var(--dur-ui) var(--ease-soft),transform var(--dur-ui) var(--ease-soft);pointer-events:none}
.icon-swap .ic.on{opacity:1;filter:blur(0);transform:scale(1)}
.pn-arrow{display:inline-block;transition:transform var(--dur-press) var(--ease-soft)}
.pn button:active .pn-arrow{transform:translateX(3px)}
.pn button.prev:active .pn-arrow{transform:translateX(-3px)}
@media (hover:hover){.pn button:hover .pn-arrow{transform:translateX(3px)}.pn button.prev:hover .pn-arrow{transform:translateX(-3px)}}
.card.enter-next{animation:pageNext var(--dur-page) var(--ease-immersive) both}
.card.enter-prev{animation:pagePrev var(--dur-page) var(--ease-immersive) both}
@keyframes pageNext{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes pagePrev{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
/* 退出沉浸时主页同步到沉浸里翻到的新页：与覆盖层 640ms 淡出同帧启动、同曲线，
   新页在覆盖层下方一边淡入一边轻滑到位，覆盖层淡尽时主页已稳稳落在新页上 */
.card.imm-sync-next{animation:immSyncNext var(--dur-immersive) var(--ease-immersive) both}
.card.imm-sync-prev{animation:immSyncPrev var(--dur-immersive) var(--ease-immersive) both}
.card.imm-sync{animation:immSync var(--dur-immersive) var(--ease-immersive) both}
@keyframes immSyncNext{from{opacity:.2;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes immSyncPrev{from{opacity:.2;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes immSync{from{opacity:.2}to{opacity:1}}
/* 左右滑跟手翻页条：横向锁定后临时盖在滚动视口上的一条横带，恰好一屏高、两页宽，
   左页 / 右页并排；拖动时整条 1:1 跟手平移（只写 transform，走合成层），松手由 Wobble
   弹簧滑到目标页或回弹，落定后立刻拆除、底下真实内容无缝接续。带身 pointer-events:none，
   不接管点击；纵向滚动仍由容器原生负责（touch-action:pan-y 不变）。 */
.pager-strip{position:absolute;left:0;display:flex;overflow:hidden;pointer-events:none;z-index:5;will-change:transform;transform:translate3d(0,0,0);backface-visibility:hidden;contain:layout paint}
/* 翻页条是静态快照：克隆卡内一切逐帧重绘源在条内一律关停——backdrop-filter 逐帧重采样、
   box-shadow / text-shadow 光栅化、transition / animation 逐帧求值，条内都不需要；
   底色本身带 alpha，关掉这些在滑动的几百毫秒里看不出差别，落定拆条后真实卡片原样 */
.pager-strip *{-webkit-backdrop-filter:none!important;backdrop-filter:none!important;box-shadow:none!important;text-shadow:none!important;transition:none!important;animation:none!important}
/* 翻页期间任何表面的滤镜一律保留、一个不关（Chromium 与 WebKit 同规矩）：
   .detail 的背板是 body mesh + 静止 blob，位于它的身后、不随条身平移变化，
   保滤镜没有逐帧重采样；而 blur(14px) saturate(160%) 一旦关掉，整面正文的
   饱和与亮度立刻跳一档、落定恢复时再跳回来——用户三报的「左右滑时背景会
   变色一下」就是它（此前误判 14px 模糊开关对合成色无影响：模糊本身影响小，
   saturate(160%) 的开关才是变色主因）。同理，落定拆条那一帧也不再有「全屏
   模糊重新栅格化」与内容替换叠在同一帧——那是每次滑动切换「狠狠卡一下」
   的一半来源。
   WebKit 曾单独留过一条 .paging 关 .detail 滤镜的旧规矩（防祖先与后代同组
   逐帧重绘），2026-11-14 已废除：iPad 实测它才是平板变色的元凶——WebKit 里
   同一 Backdrop Root 的玻璃面（顶栏 / 侧栏 / 正文面）共用一份背景快照，
   .detail 的滤镜一关，整组背景被迫重算，顶栏胶囊与左边栏在重算期间直接
   采样到未经深色玻璃面压制的原始蓝色 mesh+blob，整段滑动期间发蓝、落定
   恢复滤镜才变回深色（用户附 iPad 截图为证；安卓 Chromium 从不关滤镜、
   无此现象）。保滤镜后翻页期间零背景失效，条身仍是独立合成层逐帧只走
   transform。其余表面同理一律不动（2026-11-14 用户两次要求：滑动时与
   正常阅读同色）：
   - 任何表面的 background 不动；顶 / 底两颗胶囊与沉浸工具键的 backdrop 模糊 /
     折射全部保留、不关停（面积小，逐帧重采样成本有界；此前「关模糊 + 换
     --imm-veil 近不透明定格底」在深色下把透出蓝晕的玻璃面换成近黑实底，已废除）；
   - 背景 blob 翻页期间不隐藏：它们早已静止、是合成器缓存层，藏掉会让整页背景瞬间掉色 */
/* 沉浸期间底层正文面 / 侧栏的 backdrop 模糊关停：它们整层被 .imm-bg 的磨砂盖住、看不见，
   却仍在逐帧合成；关掉后沉浸里只剩 .imm-bg 一层全屏模糊在工作，进出沉浸不再多层叠加 */
html.imm-on .detail,html.imm-on .side{-webkit-backdrop-filter:none;backdrop-filter:none}
/* 沉浸期间顶栏 / 底栏整颗隐藏：它们被磨砂层 + 覆盖层完全盖住、点不到，却仍带着各自的
   backdrop 模糊躺在 .imm-bg 的采样区里——采样区里只要有带滤镜的活层，磨砂层就得逐帧
   重算。隐藏后采样区里只剩全静态的正文面，磨砂模糊算一次即被缓存（见 .imm-bg 注释） */
html.imm-on .top,html.imm-on .ribbon{visibility:hidden}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ===== 沉浸阅读覆盖层 =====
   独立 fixed 层盖住整个屏幕，自带滚动，内容单栏居中（复用 .card 版式）。
   进/出只过渡覆盖层自身的 opacity + transform；底层 .app 布局不加类、不动、不参与动画。
   本节写在样式表最后：同优先级时后写者胜，确保退出键的 absolute 定位不被
   [data-ripplet]{position:relative} 等规则覆盖（旧 bug：退出键被压成 relative，
   排到 100vh 应用下方、屏幕之外）。 */
.imm-overlay{position:fixed;inset:0;z-index:80;background:transparent;opacity:0;transform:translateY(18px);visibility:hidden;pointer-events:none;will-change:opacity,transform;transition:opacity var(--dur-immersive) var(--ease-immersive),transform var(--dur-immersive) var(--ease-immersive),visibility 0s linear var(--dur-immersive)}
.imm-overlay.show{opacity:1;transform:none;visibility:visible;pointer-events:auto;transition:opacity var(--dur-immersive) var(--ease-immersive),transform var(--dur-immersive) var(--ease-immersive),visibility 0s linear 0s}
.imm-overlay[hidden]{display:none}
/* 沉浸的磨砂背景独立成 .imm-bg 一层：只承接 backdrop 模糊+底色，不做滚动容器的祖先。
   以前模糊挂在覆盖层本体上，层内正文一滚动 / 翻页，WebKit 就逐帧重采样整屏模糊，
   背景跟着内容一起抖、帧率掉得最厉害。背景层因此独立出来、静止不动：翻页时它纹丝不动
   （画面与合成缓存都不变），只有翻页条在上层平移；沉浸里翻到哪页，模糊背景始终是进沉浸那一刻的样子。
   它必须是覆盖层的同级（body 直下、z-index 低一层），不能做覆盖层的子元素：覆盖层带
   will-change:opacity,transform，是一个 Backdrop Root，子元素的 backdrop-filter 只能采样
   隔离组内部、采不到组外的主页面——模糊会静默失效，只剩半透明底色盖着清晰的主页面文字
   （上一版正是这样把模糊弄丢的）。同级独立层则直接模糊它下面的主页面，磨砂效果与改版前一致；
   进 / 出与覆盖层同帧同曲线淡入淡出，退出时在它淡尽的过程中露出已同步到新页的主页面。 */
.imm-bg{position:fixed;inset:0;z-index:79;background:var(--glass-strong);-webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%);pointer-events:none;opacity:0;visibility:hidden;transition:opacity var(--dur-immersive) var(--ease-immersive),visibility 0s linear var(--dur-immersive)}
.imm-bg.show{opacity:1;visibility:visible;transition:opacity var(--dur-immersive) var(--ease-immersive),visibility 0s linear 0s}
.imm-bg[hidden]{display:none}
/* 磨砂常驻、但采样区里不许有活物：用户明确要求沉浸背景的模糊保留、只是不许跟随内容变动。
   本层模糊的是冻结的主页面，本身永不变动；真正的逐帧重算来自采样区里的动态元素——
   此前顶/底栏胶囊带着各自的 backdrop 模糊躺在采样区里、全屏请求又在落定瞬间触发整页
   resize。现在 html.imm-on 把顶/底栏整颗隐藏、正文/侧栏模糊关停、背景 blob 静止、
   全屏请求删除，采样区里只剩全静态内容：模糊只在入场时算一次并被合成器缓存，
   沉浸里滚动只是把正文图层盖在缓存好的磨砂纹理上合成，不再逐帧重采样 */
.imm-scroll{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;background:transparent}
#immDetail{position:relative}
.imm-scroll .card{margin-bottom:0;padding-top:26px;padding-bottom:96px}
/* 沉浸翻页 = 与主界面同一套左右滑跟手翻页（见脚本「横向滑动翻页」一节与 .pager-strip）：
   拖动时新旧两页并排 1:1 跟手，松手弹簧落定，不再淡出 / 淡入硬切。 */
/* 沉浸右上角工具组：主题切换键 + 退出键并排，都是 40px 图标圆键，两颗合计只占右上角约 88px，
   不再横压正文首行。主题键此前只在顶栏里，沉浸覆盖层一盖住就看不见、点不到；这里放一颗
   （id=themeBtn，图标由 updateThemeBtn 统一维护，点击走与滑块同一套提交：S.theme +
   applyTheme + save，滑块经 __ldFollow 静默跟随）。两颗键的文字标签一律隐藏：主题键的
   .btn-lab 仍由 updateThemeBtn 写入当前态文案（供 title 同步），退出键的标签同理只留无障碍名 */
.imm-tools{position:absolute;top:calc(10px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right));z-index:7;display:flex;align-items:center;gap:8px}
.imm-overlay .immersive-exit .btn-lab{display:none}
/* 手机端正文首行让出工具键的高度：圆键底沿约在 48px，正文从 58px 起，时代标题不再钻到键下 */
@media (max-width:760px){.imm-scroll .card{padding-top:58px}.imm-overlay .immersive-exit{width:38px;height:38px}}
/* 沉浸工具键（主题 / 退出）改用与顶栏同款的玻璃（2026-11-14 用户点名「用我的那个动效和玻璃效果」）：
   磨砂底 + 边缘高光环（::before，与 .top 同一条规则）+ 对角高光（::after，本就共用）；
   Chromium 下再叠顶栏同款折射（#lg-refract + 1px 模糊 + 180% 饱和，.has-lg 门控、翻页中
   同样保留，与 .top 完全一致）。两颗键各只有约 40px，采样面积远小于顶栏整颗胶囊；翻页期间背景
   一律不动（见翻页节），颜色不跳。底部计数胶囊不改，常驻 --imm-veil 定格底。
   入场动效与覆盖层同套：.imm-tools 容器随 .show 以 --dur-immersive / --ease-immersive 落定
   （只动容器，不动按钮本体——按钮自身的 hover / 按压 transform 不被动画填充覆盖）；
   退场随覆盖层整体淡出，不单独动画 */
@keyframes immToolsIn{from{opacity:0;transform:translateY(-8px) scale(.94)}to{opacity:1;transform:none}}
.imm-overlay.show .imm-tools{animation:immToolsIn var(--dur-immersive) var(--ease-immersive) both}
.imm-overlay .immersive-exit{position:relative;opacity:1;transform:none;visibility:visible;pointer-events:auto;background:var(--glass-tint);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur)}
html.has-lg .imm-overlay .immersive-exit{-webkit-backdrop-filter:url("#lg-refract") blur(1px) saturate(180%);backdrop-filter:url("#lg-refract") blur(1px) saturate(180%)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.imm-overlay .immersive-exit{background:var(--panel);-webkit-backdrop-filter:none;backdrop-filter:none}}
@media (prefers-reduced-transparency:reduce){.imm-overlay .immersive-exit{background:var(--panel);-webkit-backdrop-filter:none;backdrop-filter:none}}
.imm-overlay .immersive-exit:hover{transform:translateY(-1px)}
.imm-overlay .immersive-exit:active{transform:scale(.96);transition-duration:var(--dur-press)}
/* 沉浸翻页为左右滑跟手翻页（见脚本「横向滑动翻页」一节），没有翻页按钮；
   .imm-nav 只作计数胶囊的定位容器：覆盖全屏、pointer-events:none 不挡滚动与点击，
   计数胶囊恒定悬浮在底部中央（各宽度一致）。 */
.imm-nav{position:absolute;inset:0;z-index:6;pointer-events:none}
.imm-count{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);padding:6px 14px;border-radius:999px;border:1px solid var(--glass-border);background:var(--imm-veil);-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:var(--glass-shadow),var(--glass-insets);font-size:13.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap;pointer-events:none}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.imm-count{background:var(--panel);-webkit-backdrop-filter:none;backdrop-filter:none}}
@media (prefers-reduced-transparency:reduce){.imm-count{background:var(--panel);-webkit-backdrop-filter:none;backdrop-filter:none}}
/* lenis.css（darkroomengineering/lenis，MIT）—— Lenis 必需样式，随库一并内联 */
html.lenis,html.lenis body{height:auto}.lenis:not(.lenis-autoToggle).lenis-stopped{overflow:clip}.lenis.lenis-smooth [data-lenis-prevent]{overscroll-behavior:contain}.lenis.lenis-smooth iframe{pointer-events:none}.lenis.lenis-autoToggle{transition-property:overflow;transition-duration:1ms;transition-behavior:allow-discrete}
/* View Transitions：只给详情标题/年份起共享元素名，节点切换时小幅交叉过渡；无此 API 的浏览器走原硬切 */
.card .title{view-transition-name:ev-title}
.card .year{view-transition-name:ev-year}
::view-transition-old(ev-title),::view-transition-new(ev-title),::view-transition-old(ev-year),::view-transition-new(ev-year){animation-duration:340ms}
::view-transition-old(root),::view-transition-new(root){animation-duration:200ms}
</style>
</head>
<body>

<div class="bg-blobs" aria-hidden="true"><i class="blob blob-a"></i><i class="blob blob-b"></i></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><filter id="lg-refract" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="64" xChannelSelector="R" yChannelSelector="G"/></filter></defs></svg>
<script>(function(){/* 顶栏折射能力检测，与「我的订阅」同款：仅 Chromium 且 CSS.supports 认可 backdrop-filter:url() 时给 html 加 .has-lg，其余环境顶栏保持纯磨砂 */try{var ua=navigator.userAgent||'';var isChromium=/Chrome|Chromium|Edg/.test(ua)&&!/OPR/.test(ua);if(isChromium&&window.CSS&&CSS.supports&&CSS.supports('backdrop-filter','url("#lg-refract")')){document.documentElement.classList.add('has-lg');}}catch(e){}})();</script>
<div class="app" id="app">
  <header class="top">
    <button class="btn icon-btn menu-btn" id="menuBtn" type="button" data-ripplet aria-label="打开目录" aria-controls="side" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    <div class="brand"><b>史纲时间轴</b><span>sadpotatomine 的复习本</span></div>
    <div class="tools">
      <div class="prog" id="prog"><span class="bar" aria-hidden="true"><i></i></span><span class="txt"></span></div>
      <button class="btn" id="ribbonBtn" type="button" data-ripplet aria-pressed="false" title="收起页面底部的时间轴条"><span class="icon-swap" id="ribSwap"><span class="ic on" data-icon="collapse"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M3.5 15.5h17M9.5 8.5L12 11l2.5-2.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="ic" data-icon="expand"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M3.5 15.5h17M9.5 11L12 8.5l2.5 2.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span></span><span class="btn-lab">收起时间轴</span></button>
      <button class="btn" id="immersiveBtn" type="button" data-ripplet aria-pressed="false" title="隐藏顶栏、目录和时间轴，专注阅读正文"><span class="icon-swap" id="immSwap"><span class="ic on" data-icon="enter"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V5.5A1.5 1.5 0 0 1 5.5 4H9M15 4h3.5A1.5 1.5 0 0 1 20 5.5V9M20 15v3.5a1.5 1.5 0 0 1-1.5 1.5H15M9 20H5.5A1.5 1.5 0 0 1 4 18.5V15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="ic" data-icon="exit"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></span></span><span class="btn-lab">沉浸阅读</span></button>
      <div class="ld-inline" id="ld-inline">
        <div class="ld-stage" id="ld-stage">
          <canvas id="ld-cv"></canvas>
          <button class="ld-switch" id="ld-sw" type="button" role="switch" aria-checked="false" aria-label="切换深色 / 浅色主题"></button>
          <span class="ld-sr" id="ld-live" aria-live="polite"></span>
        </div>
      </div>
    </div>
  </header>
  <div class="wrap">
    <aside class="side" id="side" aria-label="事件目录">
      <div class="drawer-head"><b>目录</b><button class="btn icon-btn" id="closeSide" type="button" data-ripplet aria-label="关闭目录"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button></div>
      <div class="side-head">
        <div class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 16l4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><input id="q" type="search" placeholder="搜索事件、人物" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="搜索"><kbd id="kbd">/</kbd><button class="clear" id="clearQ" type="button" data-ripplet aria-label="清除搜索" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button></div>
        <div class="filters" role="group" aria-label="筛选">
          <button class="chip" type="button" data-ripplet data-f="all" aria-pressed="true">全部</button>
          <button class="chip" type="button" data-ripplet data-f="star" aria-pressed="false"><span class="chip-star">★</span> 重点</button>
          <label class="sel" id="selWrap" data-ripplet><select id="chSel" aria-label="按章节筛选"></select></label>
        </div>
        <div class="side-cap" id="cap"></div>
      </div>
      <div class="list" id="list"></div>
    </aside>
    <div class="scrim" id="scrim"></div>
    <main class="detail" id="detail" tabindex="-1"></main>
  </div>
  <footer class="ribbon">
    <button class="btn icon-btn play" id="playBtn" type="button" data-ripplet aria-label="自动播放" aria-pressed="false"></button>
    <span class="era-name" id="eraName"></span>
    <div class="track" id="track" role="slider" tabindex="0" aria-label="时间轴（可拖动；节点等距排列）" title="拖动浏览；节点按顺序等距排列，与真实年份间隔无关。← → 切换节点，Home / End 跳转首尾。"></div>
    <span class="play-count" id="playCount" aria-hidden="true"></span>
    <div class="speed" role="group" aria-label="播放速度">
      <button type="button" data-ripplet data-speed="0.5" aria-pressed="false" title="0.5 倍速（每节点停留更久）">0.5×</button>
      <button type="button" data-ripplet data-speed="1" aria-pressed="true" title="1 倍速">1×</button>
      <button type="button" data-ripplet data-speed="2" aria-pressed="false" title="2 倍速">2×</button>
      <button type="button" data-ripplet data-speed="3" aria-pressed="false" title="3 倍速">3×</button>
    </div>
  </footer>
  <div class="vh" id="live" aria-live="polite"></div>
</div>
<div class="imm-bg" id="immBg" aria-hidden="true" hidden></div>
<div class="imm-overlay" id="immOverlay" role="dialog" aria-modal="true" aria-label="沉浸阅读" hidden>
  <div class="imm-scroll" id="immScroll" data-lenis-prevent><div id="immDetail"></div></div>
  <nav class="imm-nav" id="immNav" aria-label="沉浸阅读进度">
    <span class="imm-count" id="immCount" aria-hidden="true"></span>
  </nav>
  <div class="imm-tools">
    <button class="immersive-exit" id="themeBtn" type="button" aria-pressed="false" aria-label="切换主题"></button>
    <button class="immersive-exit" id="immersiveExit" type="button" aria-label="退出沉浸" title="退出沉浸"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span class="btn-lab">退出沉浸</span></button>
  </div>
